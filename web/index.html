{b:"b",k:"1 sayılı CBK",q:"1 sayılı Cumhurbaşkanlığı Kararnamesine göre aşağıdakilerden hangisi Millî Eğitim Bakanlığının görevlerinden biridir?",o:["Yükseköğretim dışındaki eğitim-öğretim kurumlarını açmak, açılmasına izin vermek ve denetlemek","Üniversite kurmak","Yükseköğretim kurumlarının akademik denetimini yapmak","Diyanet hizmetlerini yürütmek"],a:0,e:"MEB'in görevleri CBK md.301'de sayılır; yükseköğretim dışındaki kurumların açılması, izin ve denetimi bunlardandır.",d:"1 s. CBK md.301",s:"pCbk"},
{b:"b",k:"1 sayılı CBK",q:"1 sayılı CBK md.303'te sayılan MEB hizmet birimlerinden hangisi, 176 sayılı CBK ile yürürlükten kaldırılmıştır?",o:["Öğretmen Yetiştirme ve Geliştirme Genel Müdürlüğü","Teftiş Kurulu Başkanlığı","Hukuk Hizmetleri Genel Müdürlüğü","Destek Hizmetleri Genel Müdürlüğü"],a:0,e:"Hizmet birimleri listesinde Öğretmen Yetiştirme ve Geliştirme Genel Müdürlüğü, 176 sayılı CBK ile mülga gösterilmektedir.",d:"1 s. CBK md.303",s:"pCbk"},
{b:"b",k:"1 sayılı CBK",q:"1 sayılı CBK'ye göre MEB'de döner sermaye işletmesi kurmak hangi birimin görevidir?",o:["Destek Hizmetleri Genel Müdürlüğü","Strateji Geliştirme Başkanlığı","Teftiş Kurulu Başkanlığı","Personel Genel Müdürlüğü"],a:0,e:"Döner sermaye işletmesi kurulması ve yönetimine ilişkin işler Destek Hizmetleri Genel Müdürlüğünün görevleri arasındadır.",d:"1 s. CBK md.318",s:"pCbk"},
{b:"b",k:"1 sayılı CBK",q:"1 sayılı CBK'ye göre MEB'in hukuk birimi görevlerini hangi düzenlemeye göre yürütür?",o:["659 sayılı KHK (hukuki danışmanlık ve muhakemat hizmetleri)","2577 sayılı Kanun","4483 sayılı Kanun","5018 sayılı Kanun"],a:0,e:"Hukuk birimi, 659 sayılı KHK'de belirtilen görevleri yerine getirir.",d:"1 s. CBK md.317",s:"pCbk"},
{b:"b",k:"1 sayılı CBK",q:"1 sayılı CBK md.320'ye göre Teftiş Kurulu Başkanlığı rehberlik, teftiş, inceleme ve soruşturma görevlerini nasıl yürütür?",o:["Bakanın emri veya onayı üzerine","İl valisinin talebiyle","Kendiliğinden, hiçbir onaya bağlı olmaksızın","Cumhurbaşkanlığı Devlet Denetleme Kurulunun talimatıyla"],a:0,e:"Teftiş Kurulu Başkanlığı Bakanın emri veya onayı üzerine Bakanlık teşkilatı ve Bakanlığın denetimindeki kurumlarda görev yapar.",d:"1 s. CBK md.320",s:"pCbk"},
{b:"b",k:"1 sayılı CBK",q:"1 sayılı CBK md.320'ye göre MEB Teftiş Kurulu Başkanlığının görev merkezi ve çalışma merkezleri için hangisi doğrudur?",o:["Görev merkezi Ankara'dır; Bakan onayıyla çalışma merkezleri oluşturulabilir.","Her ilde bir teftiş kurulu kurulur.","Görev merkezi İstanbul'dur.","Çalışma merkezlerini valiler belirler."],a:0,e:"Müfettişlerin görev merkezi Ankara olup ihtiyaç duyulan illerde Bakan onayıyla çalışma merkezleri oluşturulabilir.",d:"1 s. CBK md.320",s:"pCbk"},
{b:"b",k:"1 sayılı CBK",q:"1 sayılı CBK'ye göre MEB'in taşra teşkilatı nasıl yapılanır?",o:["Her il ve ilçede millî eğitim müdürlüğü kurulur.","Yalnızca bölge müdürlükleri kurulur.","Yalnızca il merkezlerinde müdürlük bulunur.","Taşra teşkilatı valiliklere bağlı şubelerden oluşur ve MEB ile bağı yoktur."],a:0,e:"Bakanlık taşra teşkilatı, her il ve ilçede kurulan millî eğitim müdürlüklerinden oluşur.",d:"1 s. CBK md.327",s:"pCbk"},
{b:"b",k:"1739 METK",q:"1739 sayılı Kanun'un “genellik ve eşitlik” ilkesine göre eğitim kurumları hangi ayırım gözetilmeksizin herkese açıktır? Aşağıdakilerden hangisi maddede sayılmaz?",o:["Dil","Engellilik","Din","Yerleşim yeri"],a:3,e:"Md.4: Eğitim kurumları dil, ırk, cinsiyet, engellilik ve din ayırımı gözetilmeksizin herkese açıktır; hiçbir kişiye, aileye, zümreye veya sınıfa imtiyaz tanınamaz.",d:"1739 s. K. md.4",s:"p1739"},
{b:"b",k:"1739 METK",q:"Aşağıdakilerden hangisi 1739 sayılı Kanun'da sayılan Türk millî eğitiminin temel ilkelerinden biri değildir?",o:["Süreklilik","Yöneltme","Planlılık","Ücretsizlik"],a:3,e:"Md.4-17'deki 14 ilke: genellik ve eşitlik, ferdin ve toplumun ihtiyaçları, yöneltme, eğitim hakkı, fırsat ve imkân eşitliği, süreklilik, Atatürk inkılap ve ilkeleri ve Atatürk milliyetçiliği, demokrasi eğitimi, laiklik, bilimsellik, planlılık, karma eğitim, okul ile ailenin işbirliği, her yerde eğitim.",d:"1739 s. K. md.4-17",s:"p1739"},
{b:"b",k:"1739 METK",q:"Yöneltme ilkesine göre bireylerin yöneltilmesinde neyden yararlanılır?",o:["Rehberlik hizmetleri ile objektif ölçme ve değerlendirme metotlarından","Velinin tercihi ve okul başarı sıralamasından","Yalnızca merkezî sınav puanından","Sınıf öğretmeninin kanaatinden"],a:0,e:"Md.6: Bireyler ilgi, istidat ve kabiliyetleri ölçüsünde çeşitli programlara veya okullara yöneltilir; bu süreçte rehberlik ve objektif ölçme-değerlendirme metotlarından yararlanılır.",d:"1739 s. K. md.6",s:"p1739"},
{b:"b",k:"1739 METK",q:"Fırsat ve imkân eşitliği ilkesi kapsamında aşağıdakilerden hangisi Kanun'da yer alır?",o:["Maddi imkânlardan yoksun başarılı öğrencilere parasız yatılılık, burs, kredi ve başka yollarla yardım; özel eğitime ve korunmaya muhtaç çocuklar için özel tedbirler","Her öğrenciye burs verilmesi","Kız öğrencilere ortaöğretimde kontenjan ayrılması","Özel okullarda ücretsiz öğrenci okutulması"],a:0,e:"Md.8: Eğitimde kadın, erkek herkese fırsat ve imkân eşitliği sağlanır.",d:"1739 s. K. md.8",s:"p1739"},
{b:"b",k:"1739 METK",q:"1739 sayılı Kanun'daki “süreklilik” ilkesi neyi ifade eder?",o:["Genel ve mesleki eğitimin hayat boyu devam etmesini","Zorunlu eğitimin kesintisiz 12 yıl olmasını","Okulların yaz aylarında da açık olmasını","Öğretmenlerin aynı okulda en az beş yıl çalışmasını"],a:0,e:"Md.9: Fertlerin genel ve mesleki eğitiminin hayat boyu devam etmesi esastır; yetişkinlerin sürekli eğitimini sağlamak da bir eğitim görevidir.",d:"1739 s. K. md.9",s:"p1739"},
{b:"b",k:"1739 METK",q:"Demokrasi eğitimi ilkesine göre eğitim kurumlarında hangisine meydan verilmez?",o:["Atatürk milliyetçiliğine aykırı siyasi ve ideolojik telkinlere ve günlük siyasi olay ve tartışmalara karışılmasına","Öğrenci temsilciliği seçimlerine","Okul meclisi çalışmalarına","Sosyal etkinlik kulüplerine"],a:0,e:"Md.11: Öğrencilere demokrasi bilinci kazandırılır; eğitim kurumlarında bu nitelikteki telkin ve tartışmalara hiçbir şekilde meydan verilmez.",d:"1739 s. K. md.11",s:"p1739"},
{b:"b",k:"1739 METK",q:"Karma eğitim ilkesi için hangisi doğrudur?",o:["Karma eğitim esastır; imkân ve zorunluluklara göre bazı okullar yalnız kız veya yalnız erkek öğrencilere ayrılabilir.","Karma eğitim yalnızca ilkokulda uygulanır.","Karma eğitim velinin talebine bağlıdır.","Ortaöğretimde karma eğitim yapılamaz."],a:0,e:"Md.15: Okullarda kız ve erkek karma eğitim yapılması esastır.",d:"1739 s. K. md.15",s:"p1739"},
{b:"b",k:"1739 METK",q:"Okul ile ailenin işbirliği ilkesi gereğince okullarda ne kurulur?",o:["Okul-aile birlikleri","Okul meclisleri","Zorunlu veli dernekleri","Mahalle eğitim kurulları"],a:0,e:"Md.16: Eğitim kurumlarının amaçlarının gerçekleştirilmesine katkıda bulunmak için okul ile aile arasında işbirliği sağlanır; bu amaçla okullarda okul-aile birlikleri kurulur.",d:"1739 s. K. md.16",s:"p1739"},
{b:"b",k:"1739 METK",q:"Resmî, özel ve gönüllü her kuruluşun eğitimle ilgili faaliyetleri hangi bakımdan kimin denetimine tabidir?",o:["Millî eğitim amaçlarına uygunluğu bakımından Millî Eğitim Bakanlığının","Kamu düzeni bakımından İçişleri Bakanlığının","Mali yönden yalnızca Sayıştayın","Hiçbir denetime tabi değildir"],a:0,e:"Md.17 (her yerde eğitim): Millî eğitimin amaçları yalnız okullarda değil, evde, çevrede, işyerlerinde, her yerde ve her fırsatta gerçekleştirilmeye çalışılır.",d:"1739 s. K. md.17",s:"p1739"},
{b:"b",k:"1739 METK",q:"1739 sayılı Kanun'un 2. maddesinde Türk millî eğitiminin genel amaçları kaç bent hâlinde sayılmıştır?",o:["2","3","4","5"],a:1,e:"Md.2 genel amaçları üç bentte sayar ve bir kapanış paragrafıyla tamamlanır.",d:"1739 s. K. md.2",s:"s1739h"},
{b:"b",k:"1739 METK",q:"1739 sayılı Kanun'un “ferdin ve toplumun ihtiyaçları” ilkesine göre millî eğitim hizmeti neye göre düzenlenir?",o:["Türk vatandaşlarının istek ve kabiliyetleri ile toplumun ihtiyaçlarına göre","Yalnızca ekonominin ihtiyaçlarına göre","Velilerin taleplerine göre","Yerel yönetimlerin kararlarına göre"],a:0,e:"Md.5.",d:"1739 s. K. md.5",s:"p1739"},
{b:"b",k:"1739 METK",q:"1739 sayılı Kanun'un eğitim hakkı ilkesine göre hangisi doğrudur?",o:["İlköğretim görmek her Türk vatandaşının hakkıdır; sonraki kademelerden ilgi, istidat ve kabiliyetleri ölçüsünde yararlanılır.","Her kademe zorunlu ve parasızdır.","Yükseköğretim her vatandaşın sınavsız hakkıdır.","Ortaöğretim yalnızca başarılı öğrencilere açıktır."],a:0,e:"Md.7.",d:"1739 s. K. md.7",s:"p1739"},
{b:"b",k:"1739 METK",q:"1739 sayılı Kanun'a göre eğitim sisteminin her derece ve türüyle ilgili ders programlarının hazırlanıp uygulanmasında temel alınan nedir?",o:["Atatürk inkılap ve ilkeleri ile Anayasada ifadesini bulan Atatürk milliyetçiliği","Uluslararası standartlar","Velilerin görüşleri","Öğretmenlerin tercihleri"],a:0,e:"Md.10: Millî ahlak ve millî kültürün bozulmadan korunması ve Türk dilinin geliştirilmesine önem verilir.",d:"1739 s. K. md.10",s:"p1739"},
{b:"b",k:"1739 METK",q:"1739 sayılı Kanun'daki “planlılık” ilkesine göre hangisine ağırlık verilir?",o:["Mesleki ve teknik eğitime","Yükseköğretime","Yaygın eğitime","Özel okullara"],a:0,e:"Md.14: Eğitim ekonomik, sosyal ve kültürel kalkınma hedefleriyle uyumlu planlanır; eğitim kurumlarının standartları önceden tespit edilir.",d:"1739 s. K. md.14",s:"p1739"},
{b:"b",k:"1739 METK",q:"1739 sayılı Kanun'un “bilimsellik” ilkesine göre hangisi doğrudur?",o:["Ders programları, öğretim metotları ve ders araçları bilimsel ve teknolojik esaslara göre sürekli geliştirilir.","Programlar yalnızca beş yılda bir değiştirilebilir.","Ders araçları Bakan onayıyla sabitlenir.","Bilimsel araştırma yalnızca üniversitelerde yapılır."],a:0,e:"Md.13: Eğitimde verimin artırılması ve gelişme sağlanması araştırma ve değerlendirmelere dayanır.",d:"1739 s. K. md.13",s:"p1739"},
{b:"b",k:"1739 METK",q:"1739 sayılı Kanun'un öğretmenlik mesleğini düzenleyen 43 ve 45. maddeleri hangi kanunla yürürlükten kaldırılmıştır?",o:["7354 sayılı Öğretmenlik Meslek Kanunu","7528 sayılı Öğretmenlik Mesleği Kanunu","652 sayılı KHK","6287 sayılı Kanun"],a:0,e:"7354 md.10 ile kaldırıldı (14.02.2022). 7354 de daha sonra 7528 sayılı Kanunla yürürlükten kalktı.",d:"7354 s. K. md.10",s:"s7354"},
{b:"b",k:"1739 METK",q:"1739 sayılı Kanun'a göre Türk millî eğitim sistemi hangi iki ana bölümden oluşur?",o:["Örgün eğitim ve yaygın eğitim","Resmî eğitim ve özel eğitim","Temel eğitim ve mesleki eğitim","Zorunlu eğitim ve isteğe bağlı eğitim"],a:0,e:"Millî eğitim sistemi örgün ve yaygın eğitim olmak üzere iki ana bölümden kurulur.",d:"1739 s. K. md.18",s:"p1739"},
{b:"b",k:"1739 METK",q:"1739 sayılı Kanun'a göre okul öncesi eğitim için hangisi doğrudur?",o:["Mecburi ilköğretim çağına gelmemiş çocukları kapsar ve isteğe bağlıdır.","Zorunludur ve parasızdır.","Yalnızca özel okullarda verilir.","İlkokulun ilk iki yılını kapsar."],a:0,e:"1739'a göre okul öncesi eğitim isteğe bağlıdır. Not: 573 sayılı KHK, özel eğitim gerektiren bireyler için okul öncesi eğitimi ayrıca düzenler.",d:"1739 s. K. okul öncesi eğitim hükmü",s:"p1739"},
{b:"b",k:"1739 METK",q:"1739 sayılı Kanun'a göre ilköğretim için hangisi doğrudur?",o:["Kız ve erkek bütün vatandaşlar için zorunludur ve devlet okullarında parasızdır.","İsteğe bağlıdır.","Yalnızca devlet okullarında zorunludur.","Ücretlidir; ücret velinin gelirine göre belirlenir."],a:0,e:"Anayasa md.42 ile uyumlu olarak ilköğretim zorunlu ve devlet okullarında parasızdır.",d:"1739 s. K. md.22",s:"p1739"},
{b:"b",k:"1739 METK",q:"1739 sayılı Kanun'a göre ilköğretim kurumlarının yapısı hangisidir?",o:["Dört yıl süreli ve zorunlu ilkokul ile dört yıl süreli ve zorunlu ortaokul ve imam-hatip ortaokullarından oluşur.","Sekiz yıllık kesintisiz ilköğretim okulundan oluşur.","Beş yıllık ilkokul ve üç yıllık ortaokuldan oluşur.","Altı yıllık ilkokul ve iki yıllık ortaokuldan oluşur."],a:0,e:"6287 sayılı Kanun'la getirilen 4+4 yapı 1739 md.22'de yer alır.",d:"1739 s. K. md.22",s:"p1739"},
{b:"b",k:"222 İlköğretim",q:"222 sayılı Kanun'a göre ilköğretim nedir?",o:["Türk çocuklarının bedenî, zihnî ve ahlaki gelişmelerine hizmet eden temel eğitim ve öğretimdir","Mesleki eğitimin ilk basamağıdır","Okul öncesi eğitimi de kapsayan zorunlu eğitimdir","Yalnızca okuma-yazma öğretimidir"],a:0,e:"Md.1 ilköğretimi temel eğitim ve öğretim olarak tanımlar.",d:"222 s. K. md.1",s:"p222"},
{b:"b",k:"222 İlköğretim",q:"222 sayılı Kanun'a göre ilköğretim için hangisi doğrudur?",o:["Öğrenim çağındaki kız ve erkek çocuklar için zorunludur ve Devlet okullarında parasızdır","Zorunludur ancak tüm okullarda ücretlidir","İsteğe bağlıdır","Yalnızca köylerde zorunludur"],a:0,e:"Md.2 zorunluluğu ve Devlet okullarında parasızlığı düzenler; Anayasa md.42 ile uyumludur.",d:"222 s. K. md.2",s:"p222"},
{b:"b",k:"222 İlköğretim",q:"6287 sayılı Kanun değişikliğinden sonra ilköğretim hangi kademelerden oluşur?",o:["Dört yıl süreli zorunlu ilkokul ile dört yıl süreli zorunlu ortaokul","Beş yıllık ilkokul ve üç yıllık ortaokul","Sekiz yıllık kesintisiz tek kademe","Dört yıllık ilkokul ve isteğe bağlı ortaokul"],a:0,e:"Md.7 (6287 s. K., 2012): İlköğretim dört yıl süreli ve zorunlu ilkokul ile dört yıl süreli ve zorunlu ortaokuldan oluşur.",d:"222 s. K. md.7",s:"p222"},
{b:"b",k:"222 İlköğretim",q:"222 sayılı Kanun'a göre çocuğu zamanında okula yazdırmakla kim yükümlüdür?",o:["Veli, vasi veya aile başkanı","Okul müdürü","Muhtar","İlçe millî eğitim müdürü"],a:0,e:"Md.46 bu yükümlülüğü veliye yükler. Yazdırılmayan çocukları okul müdürleri kayda alır ve gelmeyenler hakkında devamsız öğrenciler gibi işlem yapılır (md.48).",d:"222 s. K. md.46",s:"p222"},
{b:"b",k:"222 İlköğretim",q:"222 sayılı Kanun'a göre okula yazdırılmayan çocukları kim kayda alır?",o:["Okul müdürleri","Muhtarlar","İlçe millî eğitim müdürü","Valilik"],a:0,e:"Md.48: Kayda alınan bu çocuklar okula gelmezse devamsız öğrenciler gibi işlem yapılır.",d:"222 s. K. md.48",s:"p222"},
{b:"b",k:"222 İlköğretim",q:"222 sayılı Kanun'da öngörülen idari para cezalarını (ör. çocuğunu okula göndermeyen veliye) vermeye yetkili makam hangisidir?",o:["Mahallî mülki amir","İlçe ilköğretim kurulu","Okul müdürü","Sulh ceza hâkimi"],a:0,e:"Eski metindeki ilçe ilköğretim kurulu hükümleri (md.26-39) yürürlükten kaldırılmıştır. Güncel metinde veliye önce tebligat yapılır (md.55), idari para cezası md.56'da düzenlenir ve cezayı mahallî mülki amir verir (md.59).",d:"222 s. K. md.55, 56, 59",s:"p222"},
{b:"b",k:"222 İlköğretim",q:"222 sayılı Kanun'a göre çocuğunu mazeretsiz olarak okula göndermeyen veliye, devam edilmeyen her gün için verilecek idari para cezası ne kadardır?",o:["15 Türk lirası","100 Türk lirası","500 Türk lirası","1.000 Türk lirası"],a:0,e:"Veliye önce tebligat yapılır (md.55); devamsızlık sürerse her gün için 15 TL idari para cezası uygulanır ve tebligata rağmen çocuğu göndermeyene daha yüksek ceza öngörülür (md.56).",d:"222 s. K. md.55-56",s:"p222"},
{b:"b",k:"222 İlköğretim",q:"222 sayılı Kanun'a göre ilköğretim çağındaki çocukları okula devamlarına engel olacak şekilde çalıştıranlar hakkında hangisi doğrudur?",o:["İdari para cezası uygulanır; cezayı mahallî mülki amir verir.","Yalnızca okul müdürü tarafından uyarılırlar.","İlçe ilköğretim kurulu hapis cezası verir.","Herhangi bir yaptırım öngörülmemiştir."],a:0,e:"Çocukları okula devamlarını engelleyecek şekilde çalıştırmak yasaktır; Kanundaki idari para cezalarını mahallî mülki amir verir.",d:"222 s. K. md.59",s:"p222"},
{b:"b",k:"5580 Özel Öğretim",q:"5580 sayılı Kanun'a göre özel okullara kurum açma izni kim tarafından verilir?",o:["Valilikçe uygun görülenler için Bakanlıkça","Belediye tarafından","İlçe millî eğitim müdürlüğünce","Kaymakamlıkça"],a:0,e:"Md.3: Başvurular millî eğitim müdürlüğüne yapılır; valilikçe uygun görülen okullara izin Bakanlıkça, diğer kurumlara valilikçe verilir. Ret hâlinde Bakanlığa itiraz edilebilir.",d:"5580 s. K. md.3",s:"p5580"},
{b:"b",k:"5580 Özel Öğretim",q:"5580 sayılı Kanun'un 3. maddesine göre aşağıdakilerden hangisi yanlıştır?",o:["Kurum açma izni alınmadan öğrenci kaydı yapılamaz.","Askerî okulların ve emniyet okullarının benzeri özel okullar açılabilir.","Bina, Bakanlıkça belirlenen standartlara uygun ve yeterli olmalıdır.","Kurum açma başvurusu millî eğitim müdürlüğüne yapılır."],a:1,e:"Md.3: Askerî okullar ve emniyet okulları ile din eğitimi veren kurumların benzerleri açılamaz.",d:"5580 s. K. md.3",s:"p5580"},
{b:"b",k:"5580 Özel Öğretim",q:"Valilikçe kurum açma izni verilmemesi hâlinde başvuru sahibi ne yapabilir?",o:["Bakanlığa itiraz edebilir","Belediyeye başvurur","Doğrudan Danıştaya dava açmak zorundadır","Bir yıl yeniden başvuramaz"],a:0,e:"5580 md.3 ret kararına karşı Bakanlığa itiraz yolunu düzenler.",d:"5580 s. K. md.3",s:"p5580"},
{b:"b",k:"5580 Özel Öğretim",q:"Kurum açma izni verilen özel öğretim kurumu iki yıl içinde eğitim ve öğretime başlamazsa ne olur?",o:["Kurum açma izni iptal edilir.","İzin bir yıl uzatılır.","Para cezası verilir.","İzin devredilir."],a:0,e:"5580 md.7 izin iptali ve kapatma hâllerini düzenler.",d:"5580 s. K. md.7",s:"p5580"},
{b:"b",k:"5580 Özel Öğretim",q:"5580 sayılı Kanun ile yürürlükten kaldırılan kanun hangisidir?",o:["625 sayılı Özel Öğretim Kurumları Kanunu","222 sayılı İlköğretim ve Eğitim Kanunu","2916 sayılı Özel Eğitime Muhtaç Çocuklar Kanunu","3308 sayılı Mesleki Eğitim Kanunu"],a:0,e:"5580 sayılı Kanun, 625 sayılı eski Özel Öğretim Kurumları Kanunu'nun yerini almıştır. 2916 sayılı Kanun ise 573 sayılı KHK ile kaldırılmıştır.",d:"5580 s. K. md.14",s:"p5580"},
{b:"b",k:"5580 Özel Öğretim",q:"5580 sayılı Kanun'a göre milletlerarası özel öğretim kurumları hangi izinle açılabilir?",o:["Cumhurbaşkanının izniyle","Valinin izniyle","İl millî eğitim müdürünün onayıyla","Dışişleri Bakanlığının izniyle"],a:0,e:"Milletlerarası özel öğretim kurumlarının açılması Cumhurbaşkanı iznine bağlıdır; Türk öğrencilerin bu kurumlara kabulü ayrıca sınırlanmıştır.",d:"5580 s. K. md.5",s:"p5580"},
{b:"b",k:"5580 Özel Öğretim",q:"5580 sayılı Kanun'a göre özel okullar, toplam öğrenci sayısının en az yüzde kaçı oranında ücretsiz öğrenci okutmak zorundadır?",o:["%3","%10","%1","%5"],a:0,e:"Okullar toplam öğrenci sayısının %3'ü oranında ücretsiz öğrenci okutmakla yükümlüdür; bu oran %10'a kadar artırılabilir.",d:"5580 s. K. md.13",s:"p5580"},
{b:"b",k:"5580 Özel Öğretim",q:"5580 sayılı Kanun'a göre özel öğretim kurumlarında çalışan öğretmenlerin aylık ücreti için hangisi doğrudur?",o:["Resmî okullarda aynı durumdaki öğretmenlere ödenen aylıktan az olamaz.","Asgari ücretin altında belirlenebilir.","Tamamen kurucunun takdirindedir.","Bakanlıkça her kurum için ayrı ayrı belirlenir."],a:0,e:"Özel kurumlarda görevli öğretmenlerin ücreti, resmî okullardaki emsallerinin aylığından az olamaz.",d:"5580 s. K. md.9",s:"p5580"},
{b:"b",k:"573 KHK Özel Eğitim",q:"Özel eğitimde bireyin ihtiyaçlarına en uygun ortamda ve akranlarından mümkün olduğunca ayrılmadan eğitim almasını öngören ilke hangisidir?",o:["En az kısıtlayıcı ortam","Bireyselleştirilmiş değerlendirme","Erken tanılama","Aile katılımı"],a:0,e:"Bu ilke 573 sayılı KHK'nın temel ilkeleri ve Özel Eğitim Hizmetleri Yönetmeliğinde yer alır; kaynaştırma/bütünleştirme uygulamalarının dayanağıdır.",d:"573 s. KHK md.4",s:"p573"},
{b:"b",k:"573 KHK Özel Eğitim",q:"573 sayılı Özel Eğitim Hakkında KHK hangi yetki kanununa dayanılarak çıkarılmıştır?",o:["4216 sayılı Yetki Kanunu","5378 sayılı Kanun","1739 sayılı Kanun","222 sayılı Kanun"],a:0,e:"573 sayılı KHK 30/5/1997 tarihinde 4216 sayılı Yetki Kanunu'na dayanılarak çıkarılmış ve 6/6/1997 tarihli Resmî Gazete'de yayımlanmıştır.",d:"573 s. KHK, künye",s:"p573"},
{b:"b",k:"573 KHK Özel Eğitim",q:"573 sayılı KHK'ye göre “kaynaştırma” nedir?",o:["Özel eğitim gerektiren bireylerin eğitimlerini akranlarıyla birlikte resmî ve özel okullarda sürdürmeleri esasına dayanan özel eğitim uygulaması","Özel eğitim okullarının birleştirilmesi","Engelli öğrencilerin yatılı okullara yerleştirilmesi","Özel eğitim öğretmenlerinin genel eğitim okullarına atanması"],a:0,e:"Kaynaştırma, bireyin akranlarıyla aynı ortamda eğitim almasını esas alan uygulamadır.",d:"573 s. KHK md.3",s:"p573"},
{b:"b",k:"573 KHK Özel Eğitim",q:"573 sayılı KHK'ye göre “eğitsel değerlendirme ve tanılama” hangi bulgulara dayanır?",o:["Bireyin tüm gelişim alanları ve eğitim ihtiyaçlarının belirlenmesi için yapılan tıbbi ve eğitsel değerlendirmelere","Yalnızca velinin beyanına","Yalnızca sınıf öğretmeninin gözlemine","Yalnızca zekâ testi puanına"],a:0,e:"Tanılama çok boyutludur; tıbbi ve eğitsel değerlendirme bulguları birlikte kullanılır.",d:"573 s. KHK md.3",s:"p573"},
{b:"b",k:"573 KHK Özel Eğitim",q:"Aşağıdakilerden hangisi 573 sayılı KHK'nin 4. maddesindeki özel eğitimin genel ilkelerinden biri değildir?",o:["Özel eğitim gerektiren bireylerin öncelikle ayrı yatılı kurumlarda eğitim alması","Özel eğitime erken yaşta başlanması","Bireysel eğitim programı hazırlanması","Ailelerin özel eğitim sürecinin her aşamasına etkin katılımı"],a:0,e:"İlke, bireylerin sosyal ve fiziksel çevrelerinden mümkün olduğunca ayrılmadan eğitilmesidir; ayrı yatılı kurum önceliği ilkelere aykırıdır.",d:"573 s. KHK md.4",s:"p573"},
{b:"b",k:"573 KHK Özel Eğitim",q:"573 sayılı KHK'ye göre okul öncesi dönemdeki özel eğitim gerektiren bireylerin eğitimi için hangisi doğrudur?",o:["Zorunludur.","İsteğe bağlıdır.","Yalnızca özel kurumlarda verilir.","Yalnızca evde verilir."],a:0,e:"1739'da okul öncesi eğitim isteğe bağlı olmakla birlikte, 573 sayılı KHK özel eğitim gerektiren bireyler için okul öncesi eğitimi zorunlu kılar; gerektiğinde süresi uzatılabilir.",d:"573 s. KHK md.7",s:"p573"},
{b:"b",k:"573 KHK Özel Eğitim",q:"573 sayılı KHK'ye göre özel eğitim gerektiren bireylerin mesleki eğitimi için hangisi doğrudur?",o:["3308 sayılı Kanun'daki çırak, kalfa ve usta hakları ile yükümlülüklerinden yararlanırlar.","Mesleki eğitimden muaf tutulurlar.","Yalnızca korumalı işyerlerinde eğitim alabilirler.","Mesleki eğitim yalnızca 18 yaşından sonra başlar."],a:0,e:"KHK, özel eğitim gerektiren bireylerin 3308 sayılı Kanun'daki haklardan yararlanmasını güvence altına alır.",d:"573 s. KHK md.19",s:"p573"},
{b:"b",k:"573 KHK Özel Eğitim",q:"573 sayılı KHK'ye göre özel eğitim okul ve kurumları ile rehberlik ve araştırma merkezlerini kim açar?",o:["Millî Eğitim Bakanlığı","Valilik","Belediye","Aile ve Sosyal Hizmetler Bakanlığı"],a:0,e:"Resmî özel eğitim okul ve kurumları ile RAM'lar Bakanlıkça açılır; özel olanlar özel öğretim mevzuatına göre açılır.",d:"573 s. KHK md.23",s:"p573"},
{b:"b",k:"573 KHK Özel Eğitim",q:"573 sayılı KHK'ye göre özel eğitim okul ve kurumlarında teftiş kimler tarafından yapılır?",o:["Özel eğitim veya rehberlik ve psikolojik danışma alanında yetişmiş müfettişlerce","Okul müdürlerince","Rehberlik ve araştırma merkezi müdürlerince","Okul-aile birliğince"],a:0,e:"KHK, özel eğitim kurumlarının teftişinin alanda yetişmiş müfettişlerce yapılmasını öngörür.",d:"573 s. KHK md.26",s:"p573"},
{b:"b",k:"573 KHK Özel Eğitim",q:"573 sayılı KHK ile yürürlükten kaldırılan kanun hangisidir?",o:["2916 sayılı Özel Eğitime Muhtaç Çocuklar Kanunu","625 sayılı Özel Öğretim Kurumları Kanunu","5378 sayılı Engelliler Hakkında Kanun","1739 sayılı Millî Eğitim Temel Kanunu"],a:0,e:"573 sayılı KHK, 2916 sayılı Özel Eğitime Muhtaç Çocuklar Kanunu'nu yürürlükten kaldırmıştır.",d:"573 s. KHK md.28",s:"p573"},
{b:"b",k:"Öğretmenlik Mesleği (7528)",q:"7354 sayılı Öğretmenlik Meslek Kanunu'nu yürürlükten kaldıran düzenleme hangisidir?",o:["7528 sayılı Öğretmenlik Mesleği Kanunu","7417 sayılı Kanun","652 sayılı KHK","1 sayılı Cumhurbaşkanlığı Kararnamesi"],a:0,e:"7528 sayılı Kanun 18/10/2024 tarihli ve 32696 sayılı Resmî Gazete'de yayımlandı. Konu listesi 2022 tarihli olduğu için 7354'e atıf yapmaz; güncel düzenleme 7528'dir.",d:"7528 s. K.",s:"s7528"},
{b:"b",k:"Öğretmenlik Mesleği (7528)",q:"7528 sayılı Kanun ile kurulan ve öğretmenlik mesleğine hazırlık eğitimini veren kurum hangisidir?",o:["Millî Eğitim Akademisi","Öğretmen Akademileri Vakfı","Eğitim Bilimleri Enstitüsü","Talim ve Terbiye Kurulu Başkanlığı"],a:0,e:"Md.1: Kanunun amacı arasında Millî Eğitim Akademisinin kurulması, görevleri, teşkilat yapısı ve personeli de sayılır.",d:"7528 s. K. md.1",s:"s7528"},
{b:"b",k:"Öğretmenlik Mesleği (7528)",q:"7528 sayılı Kanun'a göre öğretmenlik; genel kültür, özel alan eğitimi ve hangi bakımdan hazırlığı gerektiren özel bir ihtisas mesleğidir?",o:["Öğretmenlik meslek bilgisi","Pedagojik yeterlik sınavı","Lisansüstü eğitim","Uygulama stajı"],a:0,e:"Md.7/1 öğretmenliği bu üç alanda hazırlık gerektiren özel bir ihtisas mesleği olarak tanımlar.",d:"7528 s. K. md.7",s:"s7528"},
{b:"b",k:"Öğretmenlik Mesleği (7528)",q:"7528 sayılı Kanun'a göre öğretmenlik mesleğine hazırlık eğitiminin süresi nedir?",o:["Dört dönem; adayın mezuniyetine göre üç döneme indirilebilir","İki dönem","Bir yıl","Altı ay"],a:0,e:"Hazırlık eğitimi Millî Eğitim Akademisince teorik ve uygulamalı olarak verilir; başarısız olanların Akademi ile ilişiği kesilir.",d:"7528 s. K. md.8",s:"s7528b"},
{b:"b",k:"Öğretmenlik Mesleği (7528)",q:"7528 sayılı Kanun'a göre hazırlık eğitimini başarıyla tamamlayanlar nasıl istihdam edilir?",o:["Sözleşmeli öğretmen olarak","Doğrudan kadrolu öğretmen olarak","Ücretli öğretmen olarak","Aday memur olarak"],a:0,e:"Md.15: Sözleşmeli öğretmen olarak istihdam edilirler.",d:"7528 s. K. md.15",s:"s7528b"},
{b:"b",k:"Öğretmenlik Mesleği (7528)",q:"7528 sayılı Kanun'a göre sözleşmeli öğretmenler kaç yılı tamamladıktan sonra talepleri hâlinde bulundukları yerde kadrolu öğretmenliğe atanabilir?",o:["3 yıl","2 yıl","4 yıl","5 yıl"],a:0,e:"Md.16: Sözleşmeli öğretmenler can güvenliği ve sağlık nedenleri dışında üç yıl yer değiştiremez.",d:"7528 s. K. md.16",s:"s7528b"},
{b:"b",k:"Öğretmenlik Mesleği (7528)",q:"7528 sayılı Kanun'a göre öğretmenlik mesleğinin kariyer basamakları hangileridir?",o:["Öğretmen, uzman öğretmen, başöğretmen","Aday öğretmen, öğretmen, kıdemli öğretmen","Öğretmen, eğitim uzmanı, başuzman","Stajyer, öğretmen, eğitim yöneticisi"],a:0,e:"Md.20 üç kariyer basamağını düzenler.",d:"7528 s. K. md.20",s:"s7528b"},
{b:"b",k:"Öğretmenlik Mesleği (7528)",q:"7528 sayılı Kanun'a göre uzman öğretmen unvanı için öğretmenlikte en az kaç yıl hizmet gerekir?",o:["10 yıl","5 yıl","7 yıl","15 yıl"],a:0,e:"Md.20: Ayrıca kademe ilerlemesinin durdurulması cezası almamış olmak ve Akademinin eğitim programını tamamlamak gerekir. Başöğretmenlik için uzman öğretmenlikte en az 10 yıl aranır.",d:"7528 s. K. md.20",s:"s7528b"},

{b:"b",k:"Özel Eğitim Hizmetleri Yön.",q:"Özel eğitim anaokulu ve anasınıflarında sınıf mevcudu için hangisi doğrudur?",o:["En fazla 5 öğrenci; yetersizliği olmayan çocuklarla birlikteyse 5'i özel eğitim ihtiyacı olan olmak üzere en fazla 14","En fazla 10 öğrenci","En fazla 8 öğrenci; karma sınıfta en fazla 20","En fazla 4 öğrenci"],a:0,e:"Bu sınıflarda günde 50'şer dakikalık 6 etkinlik saati eğitim verilir.",d:"ÖEHY md.30",s:"pOehy"},

{b:"b",k:"Özel Eğitim Hizmetleri Yön.",q:"Özel eğitim programı uygulayan okullarda sınıf tekrarı için devamsızlık sınırı nedir?",o:["En az iki yazılı uyarıya rağmen, özürsüz devamsızlık 20 günü geçmemek kaydıyla toplam 70 iş günü","Toplam 30 iş günü","Özürsüz 10 gün","Sınıf tekrarı yaptırılamaz"],a:0,e:"Özel eğitim kurumlarına devam zorunludur; devamsızlıkla ilgili tedbirleri kurum yönetimi alır.",d:"ÖEHY md.36/2",s:"pOehy"},
{b:"b",k:"Özel Eğitim Hizmetleri Yön.",q:"BİLSEM'lerde bir eğitim yılı boyunca devamsızlık süresi eğitim süresinin en fazla yüzde kaçı olabilir?",o:["%30","%20","%10","%50"],a:0,e:"Mazeretsiz olarak bu sınırı aşanın kaydı silinir; adres değişikliğiyle BİLSEM olmayan yere gidenler veya zorunlu nedenle yurt dışına çıkanlar için bu hüküm uygulanmaz.",d:"ÖEHY md.36/7",s:"pOehy"},
{b:"b",k:"Özel Eğitim Hizmetleri Yön.",q:"Özel eğitim programı uygulanan okullarda başarı değerlendirmesinde “Orta” derecesinin puan aralığı hangisidir?",o:["55-69","45-54","70-84","50-64"],a:0,e:"Pekiyi 85-100, İyi 70-84, Orta 55-69, Geçer 45-54. Devam şartını sağlayan öğrenciler başarısız sayılmaz.",d:"ÖEHY md.38/1-f",s:"pOehy"},
{b:"b",k:"Özel Eğitim Hizmetleri Yön.",q:"İl/ilçe özel eğitim hizmetleri kurulunun başkanı kimdir ve kurul ne sıklıkla toplanır?",o:["Özel eğitim ve rehberlik hizmetleri şube müdürü; haftada bir","İl millî eğitim müdürü; ayda bir","RAM müdürü; iki haftada bir","Vali yardımcısı; dönemde bir"],a:0,e:"Üyelerin görev süresi iki yıldır; kararlar oy çokluğuyla alınır, eşitlikte başkanın oyu belirleyicidir.",d:"ÖEHY md.39, md.41",s:"pOehy"},
{b:"b",k:"Özel Eğitim Hizmetleri Yön.",q:"Veli, eğitsel değerlendirme ve tanılama ya da yerleştirme kararına tebliğden itibaren ne kadar sürede itiraz edebilir?",o:["Otuz iş günü","On iş günü","Beş iş günü","Altmış gün"],a:0,e:"İtiraz, kurula ulaştığı günden itibaren en geç otuz iş günü içinde sonuçlandırılır ve veliye, okula ve RAM'a yazılı bildirilir.",d:"ÖEHY md.42",s:"pOehy"},
{b:"b",k:"Özel Eğitim Hizmetleri Yön.",q:"RAM'daki özel eğitim değerlendirme kurulunun başkanı kimdir?",o:["RAM müdür yardımcısı","RAM müdürü","Özel eğitim ve rehberlik şube müdürü","Rehberlik öğretmeni"],a:0,e:"Kurul; özel eğitim hizmetleri bölüm başkanı, rehberlik öğretmeni, özel eğitim öğretmeni ve varsa fizyoterapistten oluşur, velisi veya bireyin kendisi de üye olarak katılır. Raporu RAM müdürünün onayına sunar.",d:"ÖEHY md.43-44",s:"pOehy"},
{b:"b",k:"Özel Eğitim Hizmetleri Yön.",q:"Okuldaki BEP geliştirme biriminin başkanı kimdir?",o:["Okul müdürü veya görevlendireceği bir müdür yardımcısı","Rehberlik öğretmeni","Sınıf öğretmeni","RAM müdürü"],a:0,e:"Birimde rehberlik öğretmeni, sınıf öğretmeni, alan öğretmenleri, veli ve öğrenci yer alır; kaynaştırma uygulanan okullarda birim oluşturmak zorunludur.",d:"ÖEHY md.47, md.22/4",s:"pOehy"},
{b:"b",k:"Özel Eğitim Hizmetleri Yön.",q:"Özel eğitim meslek okullarında koordinatör öğretmenler için hangisi doğrudur?",o:["En fazla 15 öğrenciden sorumludur; haftada iki gün okulda, üç gün işletmelerde görev yapar.","En fazla 30 öğrenciden sorumludur.","Haftanın tamamında işletmelerde görev yapar.","Rehberlik öğretmenleri arasından seçilir."],a:0,e:"Koordinatör öğretmenler meslek derslerini okutan alan öğretmenleri arasından görevlendirilir.",d:"ÖEHY md.56",s:"pOehy"},
{b:"b",k:"Özel Eğitim Hizmetleri Yön.",q:"Özel Eğitim Hizmetleri Yönetmeliği'ne göre öğretmen nöbet görevi ne zaman başlar ve biter?",o:["İlk ders başlamadan 30 dakika önce başlar, son ders bitiminden 30 dakika sonra sona erer.","İlk dersle başlar, son dersle biter.","İlk ders başlamadan 15 dakika önce başlar.","Yalnızca teneffüslerde tutulur."],a:0,e:"Engelli çocuğu bulunan öğretmenlerin ders programı ve nöbetlerinde gün ve saat tercihlerine öncelik verilir.",d:"ÖEHY md.60",s:"pOehy"},
{b:"b",k:"Özel Eğitim Hizmetleri Yön.",q:"Özel eğitim kurumlarına kayıtta aşağıdakilerden hangisi aranmaz?",o:["Gündüzlü özel eğitim okullarında tuvalet eğitimini kazanmış olma şartı","Yerleştirme kararı alınmış öğrenciler için kurul kararının sureti","Yatılı öğrenciler için yatılılığa engel hastalık olmadığına dair rapor","Velinin kimlik bilgileri"],a:0,e:"Gündüzlü özel eğitim okullarına kayıtta tuvalet eğitimi şartı aranmaz.",d:"ÖEHY md.34/6, md.35",s:"pOehy"},
{b:"b",k:"Ortaöğretim Kurumları Yön.",q:"Ortaöğretim Kurumları Yönetmeliği'ne göre dersler arasındaki dinlenme süresi ve öğle arası dinlenme süresi (ikili öğretim hariç) en az ne kadardır?",o:["10 dakika / 45 dakika","5 dakika / 30 dakika","15 dakika / 60 dakika","10 dakika / 30 dakika"],a:0,e:"Bir ders saati 40 dakikadır; teneffüs 10 dakikadan, öğle arası 45 dakikadan az olamaz. İkili öğretim yapan okullarda daha kısa belirlenebilir. Blok ders iki ders saatiyle sınırlıdır.",d:"OKY md.9/1-2",s:"pOkY"},
{b:"b",k:"Ortaöğretim Kurumları Yön.",q:"Ortaöğretim kurumlarında mesleki alan uygulamalarına ilişkin derslerin işletmelerde yapılması hâlinde bir ders saati kaç dakikadır?",o:["60 dakika","40 dakika","45 dakika","50 dakika"],a:0,e:"Okulun atölye ve laboratuvarlarında 40 dakika, işletmelerde 60 dakikadır; staj süresi de 60 dakika üzerinden değerlendirilir.",d:"OKY md.9/3",s:"pOkY"},
{b:"b",k:"Ortaöğretim Kurumları Yön.",q:"Ortaöğretim Kurumları Yönetmeliği'ne göre ders yılı süresi için esas alınan en az iş günü sayısı kaçtır?",o:["180 iş günü","170 iş günü","190 iş günü","200 iş günü"],a:0,e:"180. iş günü hafta arasına rastlarsa ders yılı haftanın son iş gününe kadar uzatılır. MEM'lerce hazırlanan çalışma takvimi valilik onayıyla yürürlüğe girer.",d:"OKY md.15/1",s:"pOkY"},
{b:"b",k:"Ortaöğretim Kurumları Yön.",q:"Ortaöğretim Kurumları Yönetmeliği'ne göre olağanüstü durum, sel, deprem, aşırı sıcak/soğuk gibi nedenlerle okullarda öğretime nasıl ara verilir?",o:["İl veya ilçe hıfzıssıhha kurulu kararı ve mahallî mülki idare amirinin onayıyla","Okul müdürünün kararıyla","Okul-aile birliğinin talebi ve il millî eğitim müdürünün onayıyla","Yalnızca Bakanlık kararıyla"],a:0,e:"Eksik kalan konular için okul yönetimleri ve MEM'lerce yetiştirme tedbirleri alınır.",d:"OKY md.15/2",s:"pOkY"},
{b:"b",k:"Ortaöğretim Kurumları Yön.",q:"Ortaöğretim Kurumları Yönetmeliği'ne göre günlük toplam ders saatinin hangi oranına gelmeyen öğrencinin devamsızlığı bir gün sayılır?",o:["2/3'ü ve daha fazlasına","Yarısına","1/3'üne","Tamamına"],a:0,e:"Günlük ders saatinin 2/3'ü ve daha fazlasına gelmeyenlerin devamsızlığı bir gün, diğer devamsızlıklar yarım gün sayılır.",d:"OKY md.36/2-b",s:"pOkY"},
{b:"b",k:"Ortaöğretim Kurumları Yön.",q:"Ortaöğretim Kurumları Yönetmeliği'ne göre (genel kural) devamsızlık nedeniyle başarısız sayılma sınırı nedir?",o:["Özürsüz 10 günü, toplamda 30 günü aşmak","Özürsüz 15 günü, toplamda 45 günü aşmak","Özürsüz 5 günü, toplamda 20 günü aşmak","Özürsüz 20 günü, toplamda 60 günü aşmak"],a:0,e:"Bu öğrenciler ders puanları ne olursa olsun başarısız sayılır ve durum veliye yazılı bildirilir.",d:"OKY md.36/5-a",s:"pOkY"},
{b:"b",k:"Ortaöğretim Kurumları Yön.",q:"Ortaöğretim Kurumları Yönetmeliği'ne göre tam zamanlı kaynaştırma/bütünleştirme yoluyla eğitim alan özel eğitim ihtiyacı olan öğrencilerde devamsızlık sınırı nasıl uygulanır?",o:["Özürsüz 20 günü geçmemek kaydıyla toplam 70 gün","Özürsüz 10 günü geçmemek kaydıyla toplam 40 gün","Özürsüz 10 günü geçmemek kaydıyla toplam 60 gün","Özürsüz 30 günü geçmemek kaydıyla toplam 90 gün"],a:0,e:"Birinci derece yakınını kaybedenlerde toplam 40; sürekli tedavi/organ nakli, koruma altındaki ve tutuklu öğrencilerde toplam 60 (özürsüz 10); kaynaştırma ve özel eğitim meslek lisesi öğrencilerinde toplam 70 (özürsüz 20) gündür.",d:"OKY md.36/5-b (RG 22/2/2025)",s:"pOkY"},
{b:"b",k:"Ortaöğretim Kurumları Yön.",q:"Ortaöğretim Kurumları Yönetmeliği'ne göre öğrencinin devamsızlığına ilişkin özür belgesi en geç ne zaman okul yönetimine verilmelidir?",o:["Özür gününü takip eden 5 iş günü içinde (zorunlu hâllerde 20 iş gününe kadar uzatılabilir)","Özür gününü takip eden 3 gün içinde","Dönem sonuna kadar","Özür gününü takip eden 10 iş günü içinde"],a:0,e:"Özür belgesi veya yazılı veli beyanı veli tarafından verilir ve e-Okul'a işlenir; zorunlu hâllerde süre okul yönetimince 20 iş gününü aşmamak üzere uzatılabilir.",d:"OKY md.36/7",s:"pOkY"},
{b:"b",k:"Ortaöğretim Kurumları Yön.",q:"Ortaöğretim Kurumları Yönetmeliği'ne göre 'İyi' derecesi hangi puan aralığına karşılık gelir?",o:["70,00 - 84,99","60,00 - 69,99","85,00 - 100","50,00 - 59,99"],a:0,e:"85-100 Pekiyi, 70-84,99 İyi, 60-69,99 Orta, 50-59,99 Geçer, 0-49,99 Geçmez.",d:"OKY md.44/2",s:"pOkY"},
{b:"b",k:"Ortaöğretim Kurumları Yön.",q:"Ortaöğretim Kurumları Yönetmeliği'ne göre bir dönemde her dersten kaç yazılı sınav yapılır?",o:["İki; haftalık ders saati altı ve üzeri olan derslerde il zümre kararıyla üçüncü sınav yapılabilir","Üç; haftalık ders saati iki olan derslerde bir","Bir; öğretmen isterse iki","En az iki, en fazla dört"],a:0,e:"Sınav tarihleri e-Okul/e-Mesem üzerinden ilan edilir; zorunlu hâller dışında yazılı sınav süresi bir ders saatini aşamaz.",d:"OKY md.45/1-a, ç",s:"pOkY"},
{b:"b",k:"Ortaöğretim Kurumları Yön.",q:"Ortaöğretim Kurumları Yönetmeliği'ne göre öğrencinin yılsonu başarı puanı nasıl hesaplanır?",o:["Derslerin ağırlıklı puanları toplamının haftalık ders saatleri toplamına bölümüyle","Tüm ders puanlarının basit aritmetik ortalamasıyla","İkinci dönem puanlarının ortalamasıyla","En yüksek beş dersin ortalamasıyla"],a:0,e:"Bir dersin ağırlığı haftalık ders saatine eşittir; ağırlıklı puan = yılsonu puanı × haftalık ders saati. Bölmede virgülden sonra dört basamak yürütülür.",d:"OKY md.54-55",s:"pOkY"},
{b:"b",k:"Ortaöğretim Kurumları Yön.",q:"Ortaöğretim Kurumları Yönetmeliği'ne göre öğrenci bir dersten ders yılı sonunda hangi koşulla başarılı sayılır?",o:["İki dönem puanı ortalaması en az 50 veya birinci dönem puanı ne olursa olsun ikinci dönem puanı en az 70 ise","İki dönem puanı ortalaması en az 45 ise","Her iki dönem puanı da en az 50 ise","İkinci dönem puanı en az 60 ise"],a:0,e:"İşletmelerde beceri eğitimi görenler için ayrıca beceri sınavı puanı şartı aranır.",d:"OKY md.56/1-a",s:"pOkY"},
{b:"b",k:"Ortaöğretim Kurumları Yön.",q:"Ortaöğretim Kurumları Yönetmeliği'ne göre doğrudan sınıf geçemeyen ancak yılsonu başarı puanı en az 50 olan öğrenci en fazla kaç dersten sorumlu geçebilir?",o:["Bulunduğu sınıfta en fazla 3 ders; alt sınıflar dâhil toplam 6 dersi aşarsa sınıf tekrar eder","En fazla 2 ders; toplam 4 dersi aşarsa sınıf tekrar eder","En fazla 4 ders; toplam 8 dersi aşarsa sınıf tekrar eder","Sınırsız"],a:0,e:"Nakil ve geçişler nedeniyle ortaya çıkan sorumlu dersler bu sayıya dâhil edilmez. En fazla 1 dersten başarısız ve YBP en az 50 olan öğrenci doğrudan sınıf geçer.",d:"OKY md.57/1-b, md.58/1",s:"pOkY"},
{b:"b",k:"Ortaöğretim Kurumları Yön.",q:"Ortaöğretim Kurumları Yönetmeliği'ne göre bir dersin sorumluluğu hangi durumda kalkar?",o:["Sorumluluk sınavından en az 50 puan alınması hâlinde","Sorumluluk sınavından en az 45 puan alınması hâlinde","Bir üst sınıfta aynı alanda başarılı olunması hâlinde","Yılsonu başarı puanının 70'i geçmesi hâlinde"],a:0,e:"Sorumluluk sınavları birinci dönemin ilk iki haftası, ikinci dönemin ilk ve son iki haftası içinde iki öğretmen ve bir gözcü öğretmenle yapılır.",d:"OKY md.58/2-a, 58/4",s:"pOkY"},
{b:"b",k:"Ortaöğretim Kurumları Yön.",q:"Ortaöğretim Kurumları Yönetmeliği'ne göre sınıf tekrarı (hazırlık sınıfı hariç) ortaöğrenim süresince en fazla kaç kez yapılabilir?",o:["Bir","İki","Üç","Sınırsız"],a:0,e:"İkinci kez sınıf tekrarı durumuna düşen öğrencinin ilişiği kesilerek MESEM'e veya açık öğretim liselerine kaydı yapılır. MESEM öğrencilerinde sınıf tekrarı en fazla iki defadır.",d:"OKY md.59/1-a, ç",s:"pOkY"},
{b:"b",k:"Ortaöğretim Kurumları Yön.",q:"Ortaöğretim Kurumları Yönetmeliği'ne göre sınıf tekrarı riski olan öğrencilere yönelik önleme, müdahale ve yönlendirme komisyonunun başkanı kimdir?",o:["Müdür veya görevlendireceği müdür yardımcısı","Rehber öğretmen","Sınıf rehber öğretmeni","İlçe millî eğitim müdürü"],a:0,e:"Komisyon; zümre başkanları, rehber öğretmen ve sınıf rehber öğretmeninden oluşur.",d:"OKY md.59/A-1",s:"pOkY"},
{b:"b",k:"Ortaöğretim Kurumları Yön.",q:"Ortaöğretim Kurumları Yönetmeliği'ne göre nöbet görevi kural olarak ne zaman başlar ve biter?",o:["İlk dersten 30 dakika önce başlar, son ders bitiminden 30 dakika sonra biter","İlk dersten 15 dakika önce başlar, son dersle biter","İlk dersle başlar, son ders bitiminden 15 dakika sonra biter","İlk dersten 45 dakika önce başlar, son ders bitiminden 45 dakika sonra biter"],a:0,e:"Öğretmenler kurulu kararıyla 15 dakikadan az olmamak üzere kısaltılabilir; ikili öğretimde öğretmenler tek devrede nöbet tutar.",d:"OKY md.91/2-c",s:"pOkY"},
{b:"b",k:"Ortaöğretim Kurumları Yön.",q:"Ortaöğretim Kurumları Yönetmeliği'ne göre istekleri hâlinde nöbet görevinden muaf tutulabilecek öğretmenler hangisidir?",o:["Hizmet yılı 20 yıldan fazla kadın, 25 yıldan fazla erkek öğretmenler","Hizmet yılı 15 yıldan fazla tüm öğretmenler","50 yaşını doldurmuş öğretmenler","Hizmet yılı 25 yıldan fazla kadın, 30 yıldan fazla erkek öğretmenler"],a:0,e:"Nöbet aksarsa bunlara da görev verilir. Hamile öğretmenlere 24. haftadan analık izni bitimini izleyen iki yılın sonuna kadar istemedikçe nöbet verilmez.",d:"OKY md.91/2-ç, d",s:"pOkY"},
{b:"b",k:"Ortaöğretim Kurumları Yön.",q:"Ortaöğretim Kurumları Yönetmeliği'ne göre okul değiştirme cezası hangi makamın onayıyla uygulanır?",o:["İlçe öğrenci disiplin kurulu","Okul müdürü","İl öğrenci disiplin kurulu","Öğrenci üst disiplin kurulu"],a:0,e:"Kınama ve okuldan kısa süreli uzaklaştırma okul müdürünün, okul değiştirme ilçe öğrenci disiplin kurulunun, örgün eğitim dışına çıkarma il öğrenci disiplin kurulunun onayıyla uygulanır.",d:"OKY md.163/2, 169/2",s:"pOkY"},
{b:"b",k:"Ortaöğretim Kurumları Yön.",q:"Ortaöğretim Kurumları Yönetmeliği'ne göre örgün eğitim dışına çıkarma cezasına itirazı hangi kurul sonuçlandırır?",o:["Öğrenci üst disiplin kurulu","İl öğrenci disiplin kurulu","İlçe öğrenci disiplin kurulu","Okul öğrenci ödül ve disiplin kurulu"],a:0,e:"Kınama ve kısa süreli uzaklaştırmaya itiraz ilçe, okul değiştirmeye itiraz il kurulunca bakılır. İtiraz tebliği izleyen 5 iş günü içinde okul müdürlüğü kanalıyla yapılır; itiraz sonucu verilen karar kesindir.",d:"OKY md.169/3-4",s:"pOkY"},
{b:"b",k:"Ortaöğretim Kurumları Yön.",q:"Ortaöğretim Kurumları Yönetmeliği'ne göre okul değiştirme cezası alan öğrencinin davranış puanından kaç puan indirilir?",o:["40","20","10","80"],a:0,e:"Ders yılı başında davranış puanı 100'dür; kınama 10, kısa süreli uzaklaştırma 20, okul değiştirme 40, örgün eğitim dışına çıkarma 80 puan indirilir.",d:"OKY md.170",s:"pOkY"},
{b:"b",k:"Ortaöğretim Kurumları Yön.",q:"Ortaöğretim Kurumları Yönetmeliği'ne göre okuldan kısa süreli uzaklaştırma cezası kaç gün olabilir ve bu süre nasıl sayılır?",o:["Bir günden beş güne kadar; özürlü devamsızlıktan sayılır","Bir günden on güne kadar; özürsüz devamsızlıktan sayılır","Üç günden yedi güne kadar; devamsızlıktan sayılmaz","Bir haftadan bir aya kadar; özürlü devamsızlıktan sayılır"],a:0,e:"Öğrenci bu sürede okul binası, eklentileri ve işletmelerdeki eğitim etkinlikleri, sınav ve staja katılamaz; katılamadığı sınavlara okulca belirlenen tarihlerde alınır.",d:"OKY md.172/1-a, md.173",s:"pOkY"},
{b:"b",k:"Ortaöğretim Kurumları Yön.",q:"Ortaöğretim Kurumları Yönetmeliği'ne göre okul müdürü disiplin olaylarında öğrenciyi tedbir olarak en fazla ne kadar süre okuldan geçici uzaklaştırabilir?",o:["On iş gününü geçmemek kaydıyla, millî eğitim müdürünü bilgilendirerek","Beş iş günü, valilik onayıyla","Bir ay, kurul kararıyla","Üç gün, veli onayıyla"],a:0,e:"Tedbiri izleyen en geç 3 iş günü içinde disiplin işlemine başlanır, sevkten itibaren 10 iş günü içinde karara bağlanmazsa tedbir kendiliğinden kalkar; MEM onayıyla iki kez uzatılabilir. Tedbir süresi devamsızlıktan sayılmaz.",d:"OKY md.175/1-2",s:"pOkY"},
{b:"b",k:"Ortaöğretim Kurumları Yön.",q:"Ortaöğretim Kurumları Yönetmeliği'ne göre okul öğrenci ödül ve disiplin kurulunun başkanı kimdir?",o:["Müdürün görevlendireceği müdür yardımcısı","Okul müdürü","Rehber öğretmen","Onur kurulu başkanı"],a:0,e:"Kurul; müdür yardımcısı, öğretmenler kurulunca ders yılının ilk ayında gizli oyla seçilen iki öğretmen, onur kurulu ikinci başkanı ve okul-aile birliğinin seçeceği bir veliden oluşur.",d:"OKY md.185/1, md.188 (RG 22/2/2025)",s:"pOkY"},
{b:"b",k:"Ortaöğretim Kurumları Yön.",q:"Ortaöğretim Kurumları Yönetmeliği'ne göre takdir belgesi almak için dönem puanlarının ağırlıklı ortalaması en az kaç olmalıdır?",o:["85,00","70,00","80,00","90,00"],a:0,e:"Tüm derslerden başarılı ve davranış puanı 100 olanlardan 70,00-84,99 teşekkür, 85,00 ve üzeri takdir; en az üç öğretim yılının bütün dönemlerinde takdir alanlar üstün başarı belgesi alır.",d:"OKY md.160/1",s:"pOkY"},
{b:"b",k:"Ortaöğretim Kurumları Yön.",q:"Ortaöğretim Kurumları Yönetmeliği'ne göre okul mallarına öğrencinin verdiği zarar ödenmezse ne yapılır?",o:["Genel hükümlere göre adli yargıda dava açılarak tahsil edilir","Öğrencinin davranış puanından düşülür","Okul-aile birliği bütçesinden karşılanır ve kapatılır","Öğrenci örgün eğitim dışına çıkarılır"],a:0,e:"Zarar öncelikle velilere rızaen veya sulh yoluyla ödettirilir.",d:"OKY md.174",s:"pOkY"},
{b:"b",k:"Okul Öncesi ve İlköğretim Kurumları Yön.",q:"Okul Öncesi Eğitim ve İlköğretim Kurumları Yönetmeliği'ne göre anaokulu ve ana sınıfı hangi yaştaki çocuklar için açılır?",o:["Anaokulu eylül sonu itibarıyla 36-68 aylık, ana sınıfı 57-68 aylık çocuklar için","Anaokulu 48-72 aylık, ana sınıfı 60-72 aylık çocuklar için","Anaokulu 36-60 aylık, ana sınıfı 48-66 aylık çocuklar için","Her ikisi de 36-72 aylık çocuklar için"],a:0,e:"Ana sınıfı ilkokul ve ortaokul bünyesinde açılır. Uygulama sınıfı da 36-68 aylık çocuklara yöneliktir.",d:"OÖİKY md.4/1-a, b, n",s:"pOoik"},
{b:"b",k:"Okul Öncesi ve İlköğretim Kurumları Yön.",q:"Okul Öncesi Eğitim ve İlköğretim Kurumları Yönetmeliği'ne göre ders yılı süresi hesaplanırken ikili eğitim yapılan okullarda sabah ve öğleden sonrası nasıl sayılır?",o:["Tam gün sayılır","Yarımşar gün sayılır","Yalnızca sabah grubu sayılır","Toplamı bir gün sayılır"],a:0,e:"Ders yılının 180 iş gününden az olmaması esastır. Tekli eğitim yapılan okullarda sabah ve öğleden sonrası yarımşar gün, ikili eğitim yapılan okullarda bu süreler tam gün sayılır.",d:"OÖİKY md.5/1-b",s:"pOoik"},
{b:"b",k:"Okul Öncesi ve İlköğretim Kurumları Yön.",q:"Okul Öncesi Eğitim ve İlköğretim Kurumları Yönetmeliği'ne göre okul öncesi eğitim kurumlarında günlük eğitim süresi nasıl planlanır?",o:["Ellişer dakikalık aralıksız 6 etkinlik saati, tekli eğitim esastır","Kırkar dakikalık 8 etkinlik saati, ikili eğitim esastır","Altmışar dakikalık 5 etkinlik saati","Otuzar dakikalık 10 etkinlik saati"],a:0,e:"Kayıt alanında kesin kaydı yapılamamış çocuk bulunan okullarda ikili eğitim zorunludur. Bir gruptaki çocuk sayısının 10'dan az, 20'den fazla olmaması esastır.",d:"OÖİKY md.6/1-a, b",s:"pOoik"},
{b:"b",k:"Okul Öncesi ve İlköğretim Kurumları Yön.",q:"Okul Öncesi Eğitim ve İlköğretim Kurumları Yönetmeliği'ne göre tekli eğitim yapılan ilköğretim kurumlarında teneffüs süreleri en az ne kadardır?",o:["Bir teneffüs en az 20, diğerleri en az 15 dakika","Tüm teneffüsler en az 10 dakika","Bir teneffüs en az 30, diğerleri en az 10 dakika","Tüm teneffüsler en az 15 dakika"],a:0,e:"İkili eğitimde teneffüsler en az 10 dakikadır. Tekli eğitimde yemek ve dinlenme için en az 30, en çok 90 dakika verilir; ikili eğitimde sabahçı-öğlenci arasında en fazla 30 dakika ayrılır.",d:"OÖİKY md.6/2-a, b",s:"pOoik"},
{b:"b",k:"Okul Öncesi ve İlköğretim Kurumları Yön.",q:"Okul Öncesi Eğitim ve İlköğretim Kurumları Yönetmeliği'ne göre okul tespiti için öğrenci yerleştirme komisyonu ne zaman ve kimin başkanlığında oluşturulur?",o:["Mart ayında, il/ilçe millî eğitim müdürünün görevlendireceği müdür yardımcısı veya şube müdürünün başkanlığında en çok beş okul müdüründen","Eylül ayında, kaymakamın başkanlığında muhtarlardan","Haziran ayında, il millî eğitim müdürünün başkanlığında tüm okul müdürlerinden","Ocak ayında, okul-aile birliği başkanlarından"],a:0,e:"Komisyon kayıt alanlarını belirleyip e-Okul'a işler; kesinleşen kayıt alanları MEBCBS'ye işlenir.",d:"OÖİKY md.10",s:"pOoik"},
{b:"b",k:"Okul Öncesi ve İlköğretim Kurumları Yön.",q:"Okul Öncesi Eğitim ve İlköğretim Kurumları Yönetmeliği'ne göre ilkokul birinci sınıfa kayıt kuralı hangisidir?",o:["Eylül sonu itibarıyla 69 ayını dolduranlar kaydedilir; 66-68 aylıklar velinin yazılı isteğiyle kaydedilebilir","72 ayını dolduranlar kaydedilir; 66-71 aylıklar okul öncesine yönlendirilir","60 ayını dolduranlar kaydedilir","66 ayını dolduranlar kaydedilir; erteleme yapılamaz"],a:0,e:"69, 70 ve 71 aylık çocuklar velinin yazılı talebiyle okul öncesi eğitime yönlendirilir veya kayıtları bir yıl ertelenir.",d:"OÖİKY md.11/6-a, b",s:"pOoik"},
{b:"b",k:"Okul Öncesi ve İlköğretim Kurumları Yön.",q:"Okul Öncesi Eğitim ve İlköğretim Kurumları Yönetmeliği'ne göre ilkokulda şube değişikliği nasıl yapılabilir?",o:["Velinin yazılı talebi üzerine rehberlik servisinin gerekçeli görüş raporu alınarak, ders yılı içinde bir defaya mahsus","Okul müdürünün resen kararıyla, sınırsız","İlçe millî eğitim müdürlüğünün onayıyla, dönemde bir kez","Şube değişikliği yapılamaz"],a:0,e:"Şubeler ve öğretmenler kura yöntemiyle e-Okul üzerinden Bakanlıkça belirlenir.",d:"OÖİKY md.11/6-d",s:"pOoik"},
{b:"b",k:"Okul Öncesi ve İlköğretim Kurumları Yön.",q:"Okul Öncesi Eğitim ve İlköğretim Kurumları Yönetmeliği'ne göre ilköğretim kurumlarında nakiller hangi tarihler arasında yapılır?",o:["Sınıf atlatma sürecinin tamamlanmasını takip eden ilk iş günü başlar, dönem sonuna 15 iş günü kalıncaya kadar sürer","Yalnızca yaz tatilinde yapılır","Ders yılı boyunca sınırsız yapılır","Ekim ayı sonuna kadar yapılır"],a:0,e:"Doğal afet, sağlık ve ailenin iller arası adres değişikliği gibi nedenlerde bu süre aranmaz. İller arası nakillerde en çok beş günlük süre devamsızlıktan sayılmaz.",d:"OÖİKY md.12/2-3 (RG 28/7/2026)",s:"pOoik"},
{b:"b",k:"Okul Öncesi ve İlköğretim Kurumları Yön.",q:"Okul Öncesi Eğitim ve İlköğretim Kurumları Yönetmeliği'ne göre okul öncesi eğitim kurumunda özürsüz olarak aralıksız 10 gün devam etmeyen çocuk için ne yapılır?",o:["Velisi okul müdürlüğünce yazı ile uyarılır","Kaydı silinir","Devam zorunluluğu olmadığından işlem yapılmaz","İlçe millî eğitim müdürlüğüne bildirilir ve idari para cezası verilir"],a:0,e:"Aralıksız 5 gün devam etmeyen çocuğun durumu veliye e-posta veya kısa mesajla bildirilir; 10 günde veli yazıyla uyarılır.",d:"OÖİKY md.18/2-b",s:"pOoik"},
{b:"b",k:"Okul Öncesi ve İlköğretim Kurumları Yön.",q:"Okul Öncesi Eğitim ve İlköğretim Kurumları Yönetmeliği'ne göre ilköğretim kurumlarında okul yönetimi geçerli mazeret ve veli başvurusu üzerine öğrenciye bir eğitim-öğretim yılında en fazla kaç gün izin verebilir?",o:["15 gün","10 gün","20 gün","30 gün"],a:0,e:"Özürsüz devamsızlığı 5, 10 ve 15 güne ulaşan öğrencilerin durumu veliye bildirilir.",d:"OÖİKY md.18/3-d, e",s:"pOoik"},
{b:"b",k:"Okul Öncesi ve İlköğretim Kurumları Yön.",q:"Okul Öncesi Eğitim ve İlköğretim Kurumları Yönetmeliği'ne göre ilköğretim kurumlarında devamsızlığa ilişkin özür belgesi en geç ne zaman verilmelidir?",o:["Özür gününü takip eden 3 iş günü içinde","Özür gününü takip eden 5 iş günü içinde","Özür gününü takip eden 10 gün içinde","Dönem sonuna kadar"],a:0,e:"Zorunlu hâllerde süre okul yönetimince 20 iş gününü aşmamak üzere uzatılabilir. (Ortaöğretim Kurumları Yönetmeliği'nde bu süre 5 iş günüdür.)",d:"OÖİKY md.18/3-f (RG 17/1/2025)",s:"pOoik"},
{b:"b",k:"Okul Öncesi ve İlköğretim Kurumları Yön.",q:"Okul Öncesi Eğitim ve İlköğretim Kurumları Yönetmeliği'ne göre mecburi öğrenim çağını bitirdiği ders yılı sonuna kadar ortaokulu tamamlayamayan öğrenci için ne yapılır?",o:["Öğrenimini tamamlamak üzere en çok iki eğitim-öğretim yılı daha okuluna devam ettirilir","Kaydı hemen silinir","Bir yıl daha devam ettirilir","Doğrudan mesleki eğitim merkezine kaydedilir"],a:0,e:"Bu uzatma sonunda da tamamlayamayanlara Öğrenim Belgesi (EK-3) düzenlenir ve Açık Öğretim Ortaokuluna yönlendirilir.",d:"OÖİKY md.19/1-b",s:"pOoik"},
{b:"b",k:"Okul Öncesi ve İlköğretim Kurumları Yön.",q:"Okul Öncesi Eğitim ve İlköğretim Kurumları Yönetmeliği'ne göre ortaokulda Türkçe dersi ile diğer dersler için başarı sınırı nedir?",o:["Türkçe için 70,00; diğer dersler için 50,00","Tüm dersler için 50,00","Türkçe için 60,00; diğer dersler için 45,00","Türkçe için 85,00; diğer dersler için 70,00"],a:0,e:"Bir üst sınıfa devam için iki dönem puanı ortalaması Türkçe dersinde 70,00'den, diğer derslerde 50,00'den az olamaz.",d:"OÖİKY md.21/1, md.28/2",s:"pOoik"},
{b:"b",k:"Okul Öncesi ve İlköğretim Kurumları Yön.",q:"Okul Öncesi Eğitim ve İlköğretim Kurumları Yönetmeliği'ne göre ortaokulda haftalık ders saati 2'den fazla olan bir dersten her dönemde kaç kez ders etkinliklerine katılım puanı verilir?",o:["3","2","1","4"],a:0,e:"Haftalık ders saati 2 ve daha az olan derslerde 2, 2'den fazla olanlarda 3 kez verilir. Rehberlik ve sosyal etkinlikler puanla değerlendirilmez.",d:"OÖİKY md.22/3-4",s:"pOoik"},
{b:"b",k:"Okul Öncesi ve İlköğretim Kurumları Yön.",q:"Okul Öncesi Eğitim ve İlköğretim Kurumları Yönetmeliği'ne göre ortaokulda sınav sonuçları (ortak sınavlar hariç) en geç ne zamana kadar e-Okul'a işlenir?",o:["Sınavın yapıldığı tarihten itibaren 10 iş günü içinde","5 iş günü içinde","15 gün içinde","Dönem sonuna kadar"],a:0,e:"Sınav kâğıtları öğrencilere incelettirilip geri alınarak bir eğitim-öğretim yılı saklanır.",d:"OÖİKY md.25/1",s:"pOoik"},
{b:"b",k:"Okul Öncesi ve İlköğretim Kurumları Yön.",q:"Okul Öncesi Eğitim ve İlköğretim Kurumları Yönetmeliği'ne göre ilkokullarda sınıf tekrarı nasıl düzenlenmiştir?",o:["Sınıf tekrarı yaptırılmaması esastır; veli dilekçesiyle ders yılı bitimine bir hafta kalıncaya kadar istenebilir ve ilkokul boyunca bir kez yapılır","Başarısız her öğrenciye zorunlu olarak yaptırılır","Okul müdürünün kararıyla iki kez yapılabilir","İlkokulda sınıf tekrarı hiçbir koşulda yapılamaz"],a:0,e:"Okula hiç devam etmeyenler ve en az bir dönem devam etmeyenlere (mazeretler dışında) sınıf tekrarı yaptırılır.",d:"OÖİKY md.31/1",s:"pOoik"},
{b:"b",k:"Okul Öncesi ve İlköğretim Kurumları Yön.",q:"Okul Öncesi Eğitim ve İlköğretim Kurumları Yönetmeliği'ne göre ortaokulda özürsüz 20 gün ve üzeri devamsızlık yapan öğrencinin sınıf geçme veya tekrarına kim karar verir?",o:["İkinci dönemin son haftasında şube öğretmenler kurulu","Okul müdürü","Öğrenci davranışlarını değerlendirme kurulu","İlçe millî eğitim müdürlüğü"],a:0,e:"Türkçeden yıl sonu puanı 70'ten, herhangi bir dersten 50'den az olanlar için de aynı kurul karar verir. Oy eşitliğinde başkanın oyu yönünde çoğunluk sağlanmış sayılır.",d:"OÖİKY md.31/2-b",s:"pOoik"},
{b:"b",k:"Okul Öncesi ve İlköğretim Kurumları Yön.",q:"Okul Öncesi Eğitim ve İlköğretim Kurumları Yönetmeliği'ne göre sınıf yükseltme sınavı hangi sınıflarda ve ne zaman yapılır?",o:["İlkokul 1, 2 ve 3. sınıflarda, ders yılının başladığı tarihten itibaren bir ay içinde","İlkokul 4. sınıfta, ikinci dönem başında","Ortaokul 5. sınıfta, ders yılı sonunda","Tüm sınıflarda, her dönem sonunda"],a:0,e:"Sınav okul müdürünün başkanlığında sınıf öğretmeni ve bir üst sınıfın öğretmenlerinden oluşan komisyonca yapılır. Sınıf yükseltme aynı öğrenci için bir kez yapılır.",d:"OÖİKY md.32/1",s:"pOoik"},
{b:"b",k:"Okul Öncesi ve İlköğretim Kurumları Yön.",q:"Okul Öncesi Eğitim ve İlköğretim Kurumları Yönetmeliği'ne göre öğretmenler kurulu toplantısının günü ve gündemi en az ne kadar önce duyurulur?",o:["Beş gün","Üç gün","On gün","Bir gün"],a:0,e:"Kurul ders yılı başlamadan önce, ikinci dönem başında ve ders yılı sonunda toplanır. Tek öğretmenli birleştirilmiş sınıflı ilkokullarda öğretmenler kurulu toplantısı yapılmaz.",d:"OÖİKY md.34/2-b, 34/3",s:"pOoik"},
{b:"b",k:"Okul Öncesi ve İlköğretim Kurumları Yön.",q:"Okul Öncesi Eğitim ve İlköğretim Kurumları Yönetmeliği'ne göre ortaokul öğrencilerine uygulanabilecek yaptırımlar hangileridir?",o:["Uyarma, kınama ve okul değiştirme","Kınama, okuldan kısa süreli uzaklaştırma ve örgün eğitim dışına çıkarma","Uyarma, kınama ve örgün eğitim dışına çıkarma","Yalnızca kınama"],a:0,e:"Uyarma ve kınama okul müdürünün, okul değiştirme ilçe öğrenci davranışlarını değerlendirme kurulunun onayından sonra uygulanır. Ortaöğretimdeki ceza türleri farklıdır.",d:"OÖİKY md.54/1, 56/6",s:"pOoik"},
{b:"b",k:"Okul Öncesi ve İlköğretim Kurumları Yön.",q:"Okul Öncesi Eğitim ve İlköğretim Kurumları Yönetmeliği'ne göre ortaokulda sınıfta cep telefonu kullanmak hangi yaptırımı gerektirir?",o:["Kınama","Uyarma","Okul değiştirme","Yaptırım gerektirmez"],a:0,e:"Sınavda kopya çekmek, okulda kavga etmek ve sigara içmek de kınama gerektiren davranışlardandır.",d:"OÖİKY md.55/1-b",s:"pOoik"},
{b:"b",k:"Okul Öncesi ve İlköğretim Kurumları Yön.",q:"Okul Öncesi Eğitim ve İlköğretim Kurumları Yönetmeliği'ne göre okul öğrenci davranışlarını değerlendirme kurulu nasıl oluşur?",o:["Müdürün görevlendireceği müdür yardımcısı başkanlığında, öğretmenler kurulunca gizli oyla seçilen üç öğretmen ve okul-aile birliğinin seçeceği bir veliden","Okul müdürü başkanlığında iki öğretmen ve iki veliden","Rehber öğretmen başkanlığında üç öğretmenden","Müdür yardımcısı başkanlığında iki öğretmen, onur kurulu başkanı ve bir veliden"],a:0,e:"Rehberlik öğretmeni ihtiyaç hâlinde katılır, ancak oy kullanamaz. Kurul kararları oy çokluğuyla alınır, çekimser oy kullanılamaz.",d:"OÖİKY md.57/2, 57/8, 59/2",s:"pOoik"},
{b:"b",k:"Okul Öncesi ve İlköğretim Kurumları Yön.",q:"Okul Öncesi Eğitim ve İlköğretim Kurumları Yönetmeliği'ne göre ortaokulda verilen yaptırım kararlarına veli ne kadar sürede itiraz edebilir?",o:["Tebliğ tarihinden itibaren beş iş günü içinde okul müdürlüğüne","Tebliğden itibaren on gün içinde ilçe millî eğitim müdürlüğüne","Otuz gün içinde idare mahkemesine","Yedi gün içinde valiliğe"],a:0,e:"Okul müdürü okul değiştirmeye ilişkin itiraz dilekçesini beş iş günü içinde ilçe kuruluna gönderir; itiraz sonuçlanıncaya kadar yaptırım uygulanmaz. İlçe kurulunun karar süresi on beş günü geçemez.",d:"OÖİKY md.56/11-12, 64/3",s:"pOoik"},
{b:"b",k:"Okul Öncesi ve İlköğretim Kurumları Yön.",q:"Okul Öncesi Eğitim ve İlköğretim Kurumları Yönetmeliği'ne göre okul öncesi eğitimde katkı payı tespit komisyonu kararı ne zaman yürürlüğe girer?",o:["Valiliğin onayından sonra","Okul müdürünün onayından sonra","Okul-aile birliği genel kurulunun kabulünden sonra","Bakanlık onayından sonra"],a:0,e:"Komisyon il/ilçe millî eğitim müdürü başkanlığında nisan ayında tavan katkı payını tespit eder; oy eşitliğinde başkanın oyu iki oy sayılır. Haziranda katkı payı alınmaz.",d:"OÖİKY md.67, 68/1",s:"pOoik"},
{b:"b",k:"Okul Öncesi ve İlköğretim Kurumları Yön.",q:"Okul Öncesi Eğitim ve İlköğretim Kurumları Yönetmeliği'ne göre hangi öğretmenlere (istemedikçe) nöbet görevi verilmez?",o:["Engelli olanlar, özel eğitim ihtiyacı olan çocuğu bulunanlar ve bakmakla yükümlü olduğu engelli birey bulunanlar","Tüm sınıf öğretmenleri","Hizmet yılı 10 yılı geçen öğretmenler","Ücretli öğretmenler"],a:0,e:"Bu öğretmenlere istemeleri hâlinde gün tercihlerine öncelik verilerek nöbet verilir. Nöbet ilk dersten 30 dakika önce başlar, son dersten 30 dakika sonra biter.",d:"OÖİKY md.44/8, 44/11",s:"pOoik"},
{b:"b",k:"Ölçme ve Değerlendirme Yön.",q:"MEB Ölçme ve Değerlendirme Yönetmeliği'ne göre okullarda 2. dönem 2. yazılı sınavlar hangi tarih aralığında yapılır?",o:["Mayıs ayı son haftası – Haziran ayı ilk haftası","Nisan ayı son haftası – Mayıs ayı ilk haftası","Mart ayı son haftası – Nisan ayı ilk haftası","Haziran ayının ikinci haftası"],a:0,e:"1. dönem 1. sınav: Ekim son–Kasım ilk hafta; 1. dönem 2. sınav: Aralık son–Ocak ilk hafta; 2. dönem 1. sınav: Mart son–Nisan ilk hafta. Mücbir sebeplerle tarihleri il MEM gerekçesiyle değiştirebilir.",d:"ÖDY md.5/1-ç",s:"pOdy"},
{b:"b",k:"Ölçme ve Değerlendirme Yön.",q:"MEB Ölçme ve Değerlendirme Yönetmeliği'ne göre bir sınıfta bir günde yapılacak yazılı ve uygulamalı sınav sayısı için esas nedir?",o:["İkiyi geçmemesi esastır; zorunlu hâllerde bir sınav daha yapılabilir","Üçü geçmemesi esastır","Bir sınavla sınırlıdır","Sınırlama yoktur"],a:0,e:"Merkezî sınavlar ve izleme araştırmaları hariç, zorunlu hâller dışında yazılı sınav süresi bir ders saatini aşamaz.",d:"ÖDY md.5/1-k, l",s:"pOdy"},
{b:"b",k:"Ölçme ve Değerlendirme Yön.",q:"MEB Ölçme ve Değerlendirme Yönetmeliği'ne göre il/ilçe genelinde hangi sınıf ve derslerde ortak yazılı sınav yapılacağına kim karar verir?",o:["İlçe Millî Eğitim Müdürleri Kurulu","Ölçme Değerlendirme Merkezi Müdürü","Okul zümre başkanları","Valilik"],a:0,e:"Bu kurul il millî eğitim müdürünün başkanlığında ilçe millî eğitim müdürleri ile il millî eğitim müdür yardımcıları/şube müdürlerinden oluşur. Bakanlıkça ve bu kurulca belirlenenler dışındaki sınavlar okul genelinde ortak yapılır.",d:"ÖDY md.3/1-ı, md.6/1-b, c",s:"pOdy"},
{b:"b",k:"Ölçme ve Değerlendirme Yön.",q:"MEB Ölçme ve Değerlendirme Yönetmeliği'ne göre il/ilçe ve okul geneli ortak yazılı sınavların konu soru dağılım tablosunu kim hazırlar?",o:["İl sınıf/alan zümreleri","Ölçme, Değerlendirme ve Sınav Hizmetleri Genel Müdürlüğü","Okul müdürü","Ders öğretmeni"],a:0,e:"Bakanlıkça yapılan ortak sınavlar için tabloyu Genel Müdürlük hazırlar. Tablo öğrencilere bildirilir.",d:"ÖDY md.6/1-ç",s:"pOdy"},
{b:"b",k:"Ölçme ve Değerlendirme Yön.",q:"MEB Ölçme ve Değerlendirme Yönetmeliği'ne göre okullarda yapılan sınavlar (ülke/il/ilçe ortak sınavları hariç) hangi biçimde yapılır?",o:["Cevaplarını öğrencilerin oluşturduğu, farklı bilişsel düzeyde kazanımları ölçen yazılı yoklama şeklinde","Çoktan seçmeli test şeklinde","Yalnızca sözlü yoklama şeklinde","Proje değerlendirmesi şeklinde"],a:0,e:"Uygulamalı sınavların hangi derslerden yapılacağı, şekli, sayısı ve süresi eğitim kurumu sınıf/alan zümrelerince belirlenir ve okul müdürünün onayıyla uygulanır.",d:"ÖDY md.5/1-g, ğ",s:"pOdy"},
{b:"b",k:"Ölçme ve Değerlendirme Yön.",q:"MEB Ölçme ve Değerlendirme Yönetmeliği'ne göre ABİDE araştırmasına ilişkin hangisi doğrudur?",o:["İki yıllık döngüler hâlinde yapılır ve örneklem ili temsil edecek şekilde belirlenir","Her yıl yapılır ve yalnızca ülke raporu hazırlanır","Dört yılda bir yapılır ve tam sayım esastır","OECD döngülerine göre yapılır"],a:0,e:"ABİDE, gerçek yaşam senaryolarıyla üst düzey düşünme becerilerini il düzeyinde izler; il ve ülke raporu hazırlanır. Dört beceride Türkçe dil sınavında örneklem ülkeyi temsil eder.",d:"ÖDY md.7, md.8",s:"pOdy"},
{b:"b",k:"Ölçme ve Değerlendirme Yön.",q:"MEB Ölçme ve Değerlendirme Yönetmeliği'ne göre PISA hangi yaş grubundaki öğrencileri ve hangi alanları kapsar?",o:["15 yaş grubu; okuma becerileri, matematik okuryazarlığı ve fen okuryazarlığı","10 yaş grubu; matematik ve fen","13 yaş grubu; Türkçe ve matematik","17 yaş grubu; yabancı dil ve fen"],a:0,e:"PISA, İktisadi İşbirliği ve Gelişme Teşkilatının (OECD) belirlediği döngülerle Genel Müdürlükçe uygulanır. TIMSS ise Uluslararası Eğitim Başarılarını Değerlendirme Kuruluşunun (IEA) döngüleriyle uygulanır.",d:"ÖDY md.10-11",s:"pOdy"},
{b:"b",k:"Ölçme ve Değerlendirme Yön.",q:"MEB Ölçme ve Değerlendirme Yönetmeliği'ne göre Ölçme Değerlendirme Merkezinde görevlendirilecek öğretmende aranan şartlardan biri hangisidir?",o:["Adaylık süresi dâhil en az dört yıl öğretmenlik yapmış olmak","En az on yıl öğretmenlik yapmış olmak","Yüksek lisans mezunu olmak","Başka ilde görev yapıyor olmak"],a:0,e:"Ayrıca Bakanlık kadrosunda öğretmen olmak, merkezin bulunduğu ilde görev yapmak ve en az 30 saatlik Uygulamalı Ölçme ve Değerlendirme Kursunu başarıyla tamamlamak gerekir.",d:"ÖDY md.15, md.3/1-v",s:"pOdy"},
{b:"b",k:"Ölçme ve Değerlendirme Yön.",q:"MEB Ölçme ve Değerlendirme Yönetmeliği'ne göre Ölçme Değerlendirme Merkezi nasıl açılır?",o:["Genel Müdürlük teklifi üzerine Kurum Açma, Kapatma ve Ad Verme Yönetmeliğine göre Bakanlıkça","Valilik onayıyla","İl millî eğitim müdürlüğünün kararıyla","Cumhurbaşkanı kararıyla"],a:0,e:"Merkez aynı usulle kapatılır. Merkez müdürü harcama yetkilisi olarak merkez müdür yardımcısını gerçekleştirme görevlisi olarak görevlendirir.",d:"ÖDY md.14, md.18/1-ı",s:"pOdy"},
{b:"b",k:"Ölçme ve Değerlendirme Yön.",q:"MEB Ölçme ve Değerlendirme Yönetmeliği'ne göre ülke veya il/ilçe genelinde ortak yazılı sınav yapılan Türkçe ve yabancı dil derslerinde sınavın uygulamalı kısmını kim yapar?",o:["Okul","Ölçme Değerlendirme Merkezi","İl millî eğitim müdürlüğü","Genel Müdürlük"],a:0,e:"Bu derslerin sınavları dinleme, konuşma, okuma ve yazma becerilerini ölçmek için yazılı ve uygulamalı yapılır; iki sınav birlikte değerlendirilir.",d:"ÖDY md.5/1-ı",s:"pOdy"},
{b:"b",k:"Ölçme ve Değerlendirme Yön.",q:"MEB Ölçme ve Değerlendirme Yönetmeliği'ne göre kaynaştırma/bütünleştirme yoluyla eğitim alan öğrencilerin ölçme ve değerlendirmesinde neye göre hareket edilir?",o:["Bireyselleştirilmiş Eğitim Programı (BEP)","Sınıfın ortak sınavı","RAM raporu","Okul müdürünün takdiri"],a:0,e:"Başarı değerlendirmesinde BEP'te yer alan amaçlar esas alınır.",d:"ÖDY md.4/1-ç, md.5/1-n, md.6/1-d",s:"pOdy"},
{b:"b",k:"Ölçme ve Değerlendirme Yön.",q:"MEB Ölçme ve Değerlendirme Yönetmeliği'ne göre merkezî sınav ve izleme araştırması sorularını çoğaltan veya yayımlayanlar hakkında hangi kanun kapsamında işlem yapılır?",o:["5846 sayılı Fikir ve Sanat Eserleri Kanunu","5237 sayılı Türk Ceza Kanunu","4982 sayılı Bilgi Edinme Hakkı Kanunu","3628 sayılı Kanun"],a:0,e:"Hüküm ilgili diğer mevzuatı da saklı tutar.",d:"ÖDY md.23",s:"pOdy"},
{b:"b",k:"Ölçme ve Değerlendirme Yön.",q:"MEB Ölçme ve Değerlendirme Yönetmeliği'ne göre okul öncesi ve ilkokul 1-4. sınıflarda akademik ve sosyal gelişim nasıl takip edilir?",o:["Ders öğretmenlerince sürekli; katılım gözlem formları, oyun temelli değerlendirmeler ve görev amaçlı ölçme araçlarıyla","Dönemde iki yazılı sınavla","Ortak yazılı sınavlarla","Yılda bir yapılan merkezî sınavla"],a:0,e:"İlkokullarda Türkçenin dinleme, konuşma, okuma ve yazma becerilerinin izlenmesine yönelik ölçme araçları da kullanılır.",d:"ÖDY md.5/1-i, j",s:"pOdy"},
{b:"b",k:"Teftiş Kurulu Yön.",q:"MEB Teftiş Kurulu Yönetmeliği'ne göre müfettişlere hangi makamlar emir ve talimat verebilir?",o:["Yalnızca Bakan ve Başkan","Bakan, bakan yardımcıları ve Başkan","Vali ve il millî eğitim müdürü","Tüm disiplin amirleri"],a:0,e:"Kurul doğrudan Bakana bağlıdır ve müfettişler görevlerini Bakan adına yapar.",d:"TKY md.4",s:"pTky"},
{b:"b",k:"Teftiş Kurulu Yön.",q:"MEB Teftiş Kurulu Yönetmeliği'ne göre çalışma merkezleri nasıl kurulur?",o:["Başkanın teklifi ve Bakanın onayı ile","Valinin teklifi ve Bakanın onayı ile","Bakan yardımcısının onayı ile","Cumhurbaşkanı kararıyla"],a:0,e:"Kurulun merkezi Ankara'dır. Çalışma merkezleri için yer, personel, taşıt tahsisi merkezin bulunduğu il millî eğitim müdürlüğünce yapılır; koordinatörü Başkan görevlendirir.",d:"TKY md.5",s:"pTky"},
{b:"b",k:"Teftiş Kurulu Yön.",q:"MEB Teftiş Kurulu Yönetmeliği'ne göre müfettiş yardımcılığı yarışma sınavı duyurusu ilk başvuru tarihinden en az ne kadar önce yapılır?",o:["On beş gün","Yedi gün","Otuz gün","Beş iş günü"],a:0,e:"Duyuru Resmî Gazete'de ilan verilerek yapılır. Başvuru süresi beş iş gününden az olamaz.",d:"TKY md.15/1, 15/3",s:"pTky"},
{b:"b",k:"Teftiş Kurulu Yön.",q:"MEB Teftiş Kurulu Yönetmeliği'ne göre öğretmenlik alanından müfettiş yardımcılığı yazılı sınavına katılacaklarda aranan yaş şartı nedir?",o:["Sınav yılının 1 Ocak tarihi itibarıyla 35 yaşını doldurmamış olmak","Son başvuru günü itibarıyla 40 yaşını doldurmamış olmak","Sınav tarihi itibarıyla 30 yaşını doldurmamış olmak","Yaş şartı yoktur"],a:0,e:"Ayrıca adaylık ve sözleşmeli öğretmenlik dâhil sekiz yıl ve daha fazla öğretmenlik hizmeti, bunun en az üç yılının Bakanlığa bağlı resmî eğitim kurumlarında geçmesi ve hâlen Bakanlık kadrosunda olmak gerekir.",d:"TKY md.16/1-a, b, c",s:"pTky"},
{b:"b",k:"Teftiş Kurulu Yön.",q:"MEB Teftiş Kurulu Yönetmeliği'ne göre müfettiş yardımcılığı yazılı sınavında başarılı sayılma şartı nedir?",o:["Sınav gruplarının her birinden en az 50 ve ortalamanın en az 70 olması","Ortalamanın en az 60 olması","Her gruptan en az 60, ortalamanın en az 70 olması","Ortalamanın en az 50 olması"],a:0,e:"Yazılı sınavı Ölçme, Değerlendirme ve Sınav Hizmetleri Genel Müdürlüğü yapar; sonuçlar öğretmenlik ve öğretmenlik dışı alanlara göre ayrı listelenir.",d:"TKY md.18/1, 18/4 (RG 17/8/2024)",s:"pTky"},
{b:"b",k:"Teftiş Kurulu Yön.",q:"MEB Teftiş Kurulu Yönetmeliği'ne göre yazılı sınav sonucunda kaç aday sözlü sınava çağrılır?",o:["İlan edilen kadro sayısının iki katı (son adayla eşit puanlılar dâhil)","Kadro sayısının üç katı","Kadro sayısının dört katı","Kadro sayısı kadar"],a:0,e:"Yazılı sınava ise (KPSS ile çağrılanlarda) kadro sayısının en fazla 20 katı aday çağrılır.",d:"TKY md.19/1, 18/2",s:"pTky"},
{b:"b",k:"Teftiş Kurulu Yön.",q:"MEB Teftiş Kurulu Yönetmeliği'ne göre sözlü sınavda 'sınav konularına ilişkin bilgi düzeyi' kaç puan üzerinden değerlendirilir?",o:["50 puan","20 puan","40 puan","10 puan"],a:0,e:"Kavrayıp özetleme ve muhakeme; liyakat ve temsil kabiliyeti; özgüven ve ikna; genel yetenek ve genel kültür; bilimsel ve teknolojik gelişmelere açıklık onar puandır. Başarı için en az 70 puan gerekir.",d:"TKY md.19/3-4",s:"pTky"},
{b:"b",k:"Teftiş Kurulu Yön.",q:"MEB Teftiş Kurulu Yönetmeliği'ne göre müfettiş yardımcılığı sözlü sınav sonuçlarına itiraz nasıl yapılır?",o:["İlan tarihinden itibaren beş iş günü içinde Başkanlığa; itiraz on iş günü içinde sonuçlandırılır","Yedi gün içinde ÖDSHGM'ye","On gün içinde Bakana","Otuz gün içinde idare mahkemesine"],a:0,e:"Yazılı sınav soruları, cevap anahtarı ve sonuçlarına ise duyuruda belirtilen süre içinde ÖDSHGM'ye itiraz edilir.",d:"TKY md.20 (RG 17/8/2024)",s:"pTky"},
{b:"b",k:"Teftiş Kurulu Yön.",q:"MEB Teftiş Kurulu Yönetmeliği'ne göre yarışma sınavında yedek listede yer alan adayların hakları ne kadar süre geçerlidir?",o:["İlan tarihinden itibaren bir yılı aşmamak üzere müteakip sınav duyurusunun ilan tarihine kadar","İki yıl","Altı ay","Süresiz"],a:0,e:"Yarışma sınavı puanı yazılı ve sözlü puanların aritmetik ortalamasıdır; asıl aday sayısının yarısı kadar yedek belirlenir.",d:"TKY md.21/1",s:"pTky"},
{b:"b",k:"Teftiş Kurulu Yön.",q:"MEB Teftiş Kurulu Yönetmeliği'ne göre müfettiş yardımcılarının yetişme dönemi ve refakat süresi nedir?",o:["Üç yıllık yetişme dönemi; ilk iki yılı rehber müfettiş refakatinde","İki yıllık yetişme dönemi; ilk yılı refakatte","Dört yıllık yetişme dönemi; ilk üç yılı refakatte","Bir yıllık yetişme dönemi; tamamı refakatte"],a:0,e:"Refakatte görevlendirildikleri sürede tek başlarına soruşturma, inceleme, denetim yapamaz ve bağımsız rapor düzenleyemezler.",d:"TKY md.26/3-4, 26/7",s:"pTky"},
{b:"b",k:"Teftiş Kurulu Yön.",q:"MEB Teftiş Kurulu Yönetmeliği'ne göre müfettiş yardımcısı tez konusu kesinleştikten sonra tezini en geç ne zaman sunmalıdır?",o:["Bir yıl içinde (bir defaya mahsus altı ayı aşmayan ilave süre verilebilir)","İki yıl içinde","Altı ay içinde","Üç ay içinde"],a:0,e:"Tez konuları iki yıllık fiilî hizmetin bitiminden itibaren bir ay içinde üç konu olarak sunulur. Sınav kurulu tezi en geç iki ay içinde inceler; intihal tespitinde tez geçersizdir.",d:"TKY md.26/8, 26/10-11",s:"pTky"},
{b:"b",k:"Teftiş Kurulu Yön.",q:"MEB Teftiş Kurulu Yönetmeliği'ne göre müfettiş yardımcılarına bağımsız rehberlik, denetim, inceleme, soruşturma ve ön inceleme yetkisi nasıl verilebilir?",o:["Üçüncü yıllarında, rehber müfettiş değerlendirmeleri dikkate alınarak Başkanın önerisi ve Bakan onayı ile","İkinci yılın başında Başkan onayı ile","Tezin kabulüyle kendiliğinden","Yeterlik sınavından önce verilemez"],a:0,e:"Rehber müfettişler değerlendirme belgesini altı aylık dönemlerle gizli olarak Başkanlığa sunar. Yetki verilenler müfettiş yetkilerini kullanır.",d:"TKY md.27",s:"pTky"},
{b:"b",k:"Teftiş Kurulu Yön.",q:"MEB Teftiş Kurulu Yönetmeliği'ne göre yeterlik sınavında başarılı sayılmak için gereken şart nedir?",o:["Yazılı sınavdan en az 70 alıp sözlüye çağrılmak ve yazılı-sözlü ortalamasının en az 70 olması","Yazılı ve sözlünün her birinden en az 60 almak","Yalnızca yazılıdan en az 70 almak","Ortalamanın en az 65 olması"],a:0,e:"Sınava girebilmek için fiilen en az üç yıl çalışmış olmak ve tezin kabul edilmiş olması gerekir. Sınav, üç yıllık sürenin bitimini izleyen altı ay içinde yapılır.",d:"TKY md.28, 30/1, 31/2, 34/2",s:"pTky"},
{b:"b",k:"Teftiş Kurulu Yön.",q:"MEB Teftiş Kurulu Yönetmeliği'ne göre yeterlik sınavında başarısız olan müfettiş yardımcısına ne hak tanınır?",o:["Bir yıl içinde bir defaya mahsus ikinci sınav hakkı","İki yıl içinde iki ek hak","Sınırsız sınav hakkı","Hiçbir ek hak tanınmaz"],a:0,e:"İkinci sınavda da başarısız olan veya girmeyenler unvanını kaybeder; önceden öğretmen olanlar durumlarına uygun öğretmen kadrolarına atanır.",d:"TKY md.35-36",s:"pTky"},
{b:"b",k:"Teftiş Kurulu Yön.",q:"MEB Teftiş Kurulu Yönetmeliği'ne göre başmüfettişliğe atanabilmek için müfettişlik mesleğinde en az kaç yıl görev yapmış olmak gerekir?",o:["Müfettiş yardımcılığı dâhil on yıl","Müfettiş yardımcılığı hariç on yıl","Sekiz yıl","On beş yıl"],a:0,e:"Mesleki yeterlilik, kıdem, başarı ve kadro durumu dikkate alınır. Başmüfettişler müfettişlerden kıdemlidir.",d:"TKY md.39, 41/7",s:"pTky"},

{b:"b",k:"Teftiş Kurulu Yön.",q:"MEB Teftiş Kurulu Yönetmeliği'ne göre ilgili birimler, gereği için gönderilen raporlara ilişkin işlemler hakkında Başkanlığa ne kadar sürede bilgi verir?",o:["Otuz gün","On beş gün","Altmış gün","Yedi gün"],a:0,e:"Rapor sonuçlarının takibi bu bildirimle sağlanır.",d:"TKY md.64",s:"pTky"},

{b:"b",k:"Teftiş Kurulu Yön.",q:"MEB Teftiş Kurulu Yönetmeliği'ne göre resmî mühür kimlere verilir?",o:["Müfettişlere ve yetkili müfettiş yardımcılarına, mühür beratı ile","Tüm müfettiş yardımcılarına","Yalnızca başmüfettişlere","Yalnızca Başkana"],a:0,e:"Yetkisiz müfettiş yardımcılarına yalnızca fotoğraflı kimlik belgesi verilir.",d:"TKY md.68",s:"pTky"},

{b:"b",k:"Okul-Aile Birliği Yön.",q:"MEB Okul-Aile Birliği Yönetmeliği'ne göre okul-aile birliğinin hukuki niteliği nedir?",o:["Okul bünyesinde kurulan, tüzel kişiliği haiz olmayan birliktir","Tüzel kişiliği olan dernektir","Kamu tüzel kişiliğidir","Vakıftır"],a:0,e:"Birlik kurulduğu okulun adını alır. Yönetmeliğin dayanağı 1739 sayılı Kanunun 16. maddesidir.",d:"OABY md.3, md.5",s:"pOab"},

{b:"b",k:"Okul-Aile Birliği Yön.",q:"MEB Okul-Aile Birliği Yönetmeliği'ne göre olağanüstü genel kurul birlik üyelerinin hangi oranının yazılı başvurusuyla toplanabilir?",o:["%10","%25","%5","Salt çoğunluk"],a:0,e:"Yönetim kurulu, okul müdürü ve (aykırılık tespitinde) denetleme kurulu da olağanüstü genel kurulu çağırabilir; gündeme bağlılık ilkesi geçerlidir.",d:"OABY md.9/6",s:"pOab"},

{b:"b",k:"Okul-Aile Birliği Yön.",q:"MEB Okul-Aile Birliği Yönetmeliği'ne göre okul-aile birlikleri hangi vergi ve harçlardan muaftır?",o:["Görevleri kapsamındaki işlem ve kâğıtlar yönünden damga vergisi ve harçlardan; yapılan bağışlar veraset ve intikal vergisinden","Kurumlar vergisi ve KDV'den","Gelir vergisinden","Hiçbir vergiden muaf değildir"],a:0,e:"Kantin birlikçe işletilip vergi mükellefiyeti doğarsa Vergi Usul Kanunu uygulanır.",d:"OABY md.24, md.23/3",s:"pOab"},

{b:"b",k:"Taşıma Yoluyla Eğitime Erişim Yön.",q:"Taşıma Yoluyla Eğitime Erişim Yönetmeliği'ne göre planlama komisyonu ne zaman ve nasıl oluşturulur?",o:["Her yıl ocak ayı içinde, MEM'in uygun görüşü ve mahallî mülki idare amirinin onayıyla; ilk toplantı şubat ayını geçmez","Her yıl eylül ayında valilik oluruyla","Mart ayında il millî eğitim müdürünün teklifiyle","Haziran ayında Bakanlık onayıyla"],a:0,e:"Komisyon il MEM müdür yardımcısı veya il/ilçe şube müdürü başkanlığında, başkan dâhil en az üç, en fazla on bir üyeden oluşur ve bir yıl çalışır.",d:"TYEEY md.5/2-4 (RG 1/8/2024)",s:"pTyee"},

{b:"b",k:"Taşıma Yoluyla Eğitime Erişim Yön.",q:"Taşıma Yoluyla Eğitime Erişim Yönetmeliği'ne göre zorunlu sebepler dışında hangi okullar taşıma merkezi okul olarak belirlenemez?",o:["Yatılı bölge ortaokulları ve ikili eğitim yapan okullar","Pansiyonlu ortaöğretim kurumları","İmam-hatip ortaokulları","Özel eğitim sınıfı bulunan okullar"],a:0,e:"Taşıma merkezi ilkokulda birleştirilmiş sınıf uygulaması yapılmaz (zorunlu hâllerde komisyon teklifi, il değerlendirme komisyonu kararı ve mülki amir onayıyla yapılabilir).",d:"TYEEY md.7/2-3",s:"pTyee"},
{b:"b",k:"Taşıma Yoluyla Eğitime Erişim Yön.",q:"Taşıma Yoluyla Eğitime Erişim Yönetmeliği'ne göre öğrencisi taşınacak yerleşim biriminin belirlenmesinde hangi şartlar birlikte aranır?",o:["Toplu taşıma hizmetinin bulunmaması ve öğrencinin ihtiyacını karşılayacak türde eğitim kurumunun bulunmaması veya kapalı olması","Nüfusun 1000'in altında olması ve okulun bulunmaması","Köy statüsünde olması ve yolun asfalt olmaması","Velinin talepte bulunması ve okulun 3 km'den uzak olması"],a:0,e:"Özel eğitim öğrencileri bu şartlar aranmaksızın kayıtlı oldukları okul/kurum/sınıflara taşınır; aynı okula veya kampüse devam eden kardeşleri de aynı araçla taşınabilir.",d:"TYEEY md.8/1, md.9",s:"pTyee"},

{b:"b",k:"Rehberlik ve Psikolojik Danışma Hiz. Yön.",q:"MEB Rehberlik ve Psikolojik Danışma Hizmetleri Yönetmeliği'ne göre rehberlik hizmetleri hangi gelişim alanlarında sunulur?",o:["Sosyal duygusal, akademik ve kariyer gelişim alanları","Bilişsel, fiziksel ve dil gelişim alanları","Eğitsel, mesleki ve kişisel alanlar","Ahlaki, sosyal ve sağlık alanları"],a:0,e:"Hizmet türleri ise gelişimsel ve önleyici hizmetler, iyileştirici hizmetler ve destek hizmetlerdir.",d:"RPDHY md.6, md.11/1",s:"pRpdhy"},
{b:"b",k:"Rehberlik ve Psikolojik Danışma Hiz. Yön.",q:"MEB Rehberlik ve Psikolojik Danışma Hizmetleri Yönetmeliği'ne göre okul rehberlik programı için öğrencilerin ihtiyaç analizi ne zaman yapılır?",o:["Her eğitim-öğretim yılı mayıs ayında","Eylül ayının ilk haftasında","Ekim ayında","Ocak ayında"],a:0,e:"İhtiyaç analizi test ve test dışı tekniklerle yapılır.",d:"RPDHY md.8",s:"pRpdhy"},
{b:"b",k:"Rehberlik ve Psikolojik Danışma Hiz. Yön.",q:"MEB Rehberlik ve Psikolojik Danışma Hizmetleri Yönetmeliği'ne göre rehberlik hedeflerini kim belirler?",o:["Genel hedefleri Bakanlık, yerel hedefleri il yürütme komisyonu, özel hedefleri eğitim kurumları","Tüm hedefleri RAM","Tüm hedefleri okul müdürü","Genel hedefleri valilik, özel hedefleri rehber öğretmen"],a:0,e:"Yerel hedefler eylül ayının ilk haftasında e-Rehberlik sistemine işlenir.",d:"RPDHY md.9, md.13/1-b",s:"pRpdhy"},
{b:"b",k:"Rehberlik ve Psikolojik Danışma Hiz. Yön.",q:"MEB Rehberlik ve Psikolojik Danışma Hizmetleri Yönetmeliği'ne göre rehberlik ve psikolojik danışma hizmetleri il yürütme komisyonu ne zaman toplanır ve başkanı kimdir?",o:["Biri eylülde, diğeri haziranda olmak üzere yılda en az iki kez; il millî eğitim müdürü","Her ay; özel eğitim şube müdürü","Yılda bir kez; vali yardımcısı","Her dönem başında; RAM müdürü"],a:0,e:"Sekretaryayı il MEM'deki özel eğitim ve rehberlik hizmetleri birimi yürütür. Haziran toplantısında bir sonraki yılın yerel hedefleri belirlenir.",d:"RPDHY md.12/1-3, 13/1-a",s:"pRpdhy"},
{b:"b",k:"Rehberlik ve Psikolojik Danışma Hiz. Yön.",q:"MEB Rehberlik ve Psikolojik Danışma Hizmetleri Yönetmeliği'ne göre okul rehberlik ve psikolojik danışma hizmetleri yürütme komisyonu en az kaç kez toplanır?",o:["Birinci dönem başında, ikinci dönem başında ve ders yılı sonunda olmak üzere en az üç kez","Yılda bir kez","Her ay","Dönemde bir kez"],a:0,e:"Komisyon müdür başkanlığında müdür yardımcıları, rehber öğretmenler, her sınıf düzeyinden en az bir sınıf rehber öğretmeni, kurul temsilcisi ve okul-aile birliği temsilcisinden oluşur. İlk toplantı öğretmenler kurulundan itibaren en geç bir ay içinde yapılır.",d:"RPDHY md.16/2, 16/6-7",s:"pRpdhy"},
{b:"b",k:"Rehberlik ve Psikolojik Danışma Hiz. Yön.",q:"MEB Rehberlik ve Psikolojik Danışma Hizmetleri Yönetmeliği'ne göre okul rehberlik ve psikolojik danışma programı en geç ne zaman e-Rehberlik sistemi üzerinden onaylanarak RAM'a ulaştırılır?",o:["Ekim ayının ilk haftasında","Eylül ayının son haftasında","Kasım ayında","Ders yılı başlamadan önce"],a:0,e:"Program rehberlik servisince hazırlanır, okul müdürünce onaylanır. Sınıf rehberlik planı ise en geç ekim ayının ikinci haftasında müdüre onaylatılır.",d:"RPDHY md.18/1-ğ, 21/4-b-1, 23/1-a",s:"pRpdhy"},
{b:"b",k:"Rehberlik ve Psikolojik Danışma Hiz. Yön.",q:"MEB Rehberlik ve Psikolojik Danışma Hizmetleri Yönetmeliği'ne göre okul risk haritası ne zaman RAM'a ulaştırılır?",o:["Her yıl kasım ayı içinde","Her yıl mayıs ayında","Her dönem sonunda","Eylül ayının ilk haftasında"],a:0,e:"Sınıf rehber öğretmenleri kasım ayında risk altındaki öğrenci verilerini rehberlik servisine iletir; rehber öğretmen bunları birleştirerek risk haritasını oluşturur.",d:"RPDHY md.18/1-m, 21/4-b-3, 23/1-d",s:"pRpdhy"},
