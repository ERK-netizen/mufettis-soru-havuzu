<style>
/* Layout: tek ekranlı uygulama — üstte ince başlık çubuğu, ortada kaydırılan görünüm, altta beş sekmeli gezinme çubuğu. Soru ekranı "dosya kâğıdı" kartı; madde atıfları mühür gibi monospace etiket. */
:root{
  --bg:#eef1f5;
  --paper:#ffffff;
  --ink:#16202c;
  --muted:#5a6676;
  --line:#d5dbe3;
  --accent:#1d4e89;
  --accent-ink:#ffffff;
  --accent-soft:#e3ebf6;
  --ok:#1d7a4f;
  --ok-soft:#e1f2e9;
  --bad:#b3261e;
  --bad-soft:#f8e3e1;
  --warn:#8a5a00;
  --warn-soft:#f7edd8;
  --shade:rgba(22,32,44,.08);
  --f-read:"Literata", Georgia, "Times New Roman", serif;
  --f-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b;--paper:#171e28;--ink:#e6ebf2;--muted:#9aa6b6;--line:#2b3542;--accent:#8db6ee;--accent-ink:#0f141b;--accent-soft:#1d2b3e;
  --ok:#5fcf98;--ok-soft:#14301f;--bad:#f08a80;--bad-soft:#3a1b19;--warn:#e6b65c;--warn-soft:#33270f;--shade:rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b;--paper:#171e28;--ink:#e6ebf2;--muted:#9aa6b6;--line:#2b3542;--accent:#8db6ee;--accent-ink:#0f141b;--accent-soft:#1d2b3e;
  --ok:#5fcf98;--ok-soft:#14301f;--bad:#f08a80;--bad-soft:#3a1b19;--warn:#e6b65c;--warn-soft:#33270f;--shade:rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html{height:100%;background:var(--paper)}
body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.gut{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.col{max-width:760px;margin:0 auto;width:100%}

/* üst çubuk */
.topbar{background:var(--paper);border-bottom:1px solid var(--line);padding-block:10px}
.topbar .col{display:flex;align-items:center;gap:10px}
.topbar .back{appearance:none;border:0;background:transparent;color:var(--accent);font:inherit;font-weight:600;padding:6px 8px 6px 0;cursor:pointer;display:inline-flex;align-items:center;gap:2px}
.brand{min-width:0;flex:1}
.brand small{display:block;font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:600;line-height:1.2}
.brand b{display:block;font-family:var(--f-read);font-weight:600;font-size:1.12rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back[hidden]{display:none}
.sync{font-size:.7rem;font-weight:600;letter-spacing:.03em;padding:4px 9px;border-radius:999px;background:var(--line);color:var(--muted);white-space:nowrap}
.sync.on{background:var(--ok-soft);color:var(--ok)}
.sync.busy{background:var(--accent-soft);color:var(--accent)}
.sync.err{background:var(--warn-soft);color:var(--warn)}

/* görünüm */
.view{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.page{padding-block:16px 28px;display:grid;gap:16px}
h2{font-family:var(--f-read);font-weight:600;font-size:1.3rem;line-height:1.25;margin:0;text-wrap:balance}
h3{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
.lead{margin:0;color:var(--muted);font-size:.9rem;max-width:62ch}
.group{display:grid;gap:8px}

/* segment ve çipler */
.seg{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;overflow-x:auto}
.seg button{appearance:none;flex:1 0 auto;border:0;background:transparent;color:var(--ink);font:inherit;font-size:.84rem;font-weight:500;padding:7px 10px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:.82rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip small{opacity:.7;font-variant-numeric:tabular-nums;margin-left:4px}

/* listeler */
.list{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{appearance:none;width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;padding:12px 14px;cursor:pointer}
.row:first-child{border-top:0}
.row:active{background:var(--accent-soft)}
.row .t{font-weight:600;font-size:.94rem;min-width:0}
.row .s{grid-column:1;font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.row .n{grid-row:1/3;grid-column:2;font-family:var(--f-mono);font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.row .n::after{content:"›";font-family:var(--f-ui);font-size:1.3rem;color:var(--line);line-height:1}
.meter{grid-column:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .g{background:var(--ok)} .meter .r{background:var(--bad)}

/* kartlar */
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.resume{appearance:none;font:inherit;color:var(--ink);text-align:left;cursor:pointer;border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:12px 16px;display:grid;gap:2px}
.resume small{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:600}
.resume b{font-size:.98rem}
.resume span{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{width:100%;appearance:none;font:inherit;color:var(--ink);text-align:left;cursor:pointer;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:4px;min-width:0}
.tile:disabled{opacity:.5;cursor:default}
.tile .big{font-family:var(--f-read);font-size:1.9rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.tile .lab{font-weight:600;font-size:.88rem}
.tile .sub{font-size:.76rem;color:var(--muted)}
.tile.bad .big{color:var(--bad)} .tile.mark .big{color:var(--warn)} .tile.new .big{color:var(--accent)}

/* düğmeler */
.btn{appearance:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:.9rem;font-weight:500;padding:10px 16px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* soru ekranı */
.qhead{display:grid;gap:8px}
.qmeta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.76rem;color:var(--muted);align-items:center}
.qmeta .no{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.qmeta .flag{color:var(--bad);font-weight:600}
.progress{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px clamp(14px,4vw,26px);display:grid;gap:14px;min-width:0;touch-action:pan-y}
.q{font-family:var(--f-read);font-size:1.1rem;line-height:1.55;margin:0}
.opts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.opt{appearance:none;width:100%;text-align:left;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:.95rem;padding:12px;border-radius:10px;cursor:pointer;line-height:1.45;min-height:48px}
.opt .L{font-family:var(--f-mono);font-weight:500;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);font-size:.8rem}
.opt:disabled{cursor:default}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--accent)}}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .L{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .L{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .L{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.explain{border-top:1px dashed var(--line);padding-top:14px;display:grid;gap:10px}
.explain p{margin:0}
.verdict{font-weight:600}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}
.ref{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.madde{font-family:var(--f-mono);font-size:.78rem;border:1px solid var(--ink);border-radius:4px;padding:2px 7px}
.vb{font-size:.68rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:4px}
.vb.R{background:var(--ok-soft);color:var(--ok)} .vb.E{background:var(--accent-soft);color:var(--accent)}
.vb.D{background:var(--warn-soft);color:var(--warn)} .vb.A{background:var(--line);color:var(--muted)}
.src{font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.src a{color:var(--accent)}
.ask{display:grid;gap:8px}
.askbox{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:.9rem;white-space:pre-wrap;line-height:1.55}
.askbox .who{display:block;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:4px;white-space:normal}
.linkbtn{appearance:none;border:0;background:transparent;color:var(--accent);font:inherit;font-size:.85rem;font-weight:600;padding:0;cursor:pointer;justify-self:start}
.actionbar{position:sticky;bottom:0;background:linear-gradient(to bottom,transparent,var(--bg) 30%);padding-block:14px 4px;display:grid;grid-template-columns:auto 1fr 1fr;gap:8px}
.mark{appearance:none;border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:10px;width:46px;cursor:pointer;display:grid;place-items:center}
.mark[aria-pressed="true"]{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.mark svg{width:20px;height:20px}
.hint{font-size:.72rem;color:var(--muted);text-align:center}

/* sonuç ve istatistik */
.score{font-family:var(--f-read);font-size:2.6rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:1rem;color:var(--muted);font-weight:500}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.86rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
td.num,th.num{text-align:right;white-space:nowrap}
.bars{display:grid;gap:10px}
.bars .b{display:grid;gap:4px}
.bars .b div{display:flex;justify-content:space-between;gap:8px;font-size:.85rem}
.bars .b span{color:var(--muted);font-variant-numeric:tabular-nums}
.bars .meter{height:8px;border-radius:4px}
.wrongs{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.wrongs li{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.86rem;display:grid;gap:4px}
.wrongs .ans{color:var(--ok);font-weight:600}
.timer{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.86rem}
.prose{display:grid;gap:10px;font-size:.88rem}
.prose p{margin:0}
.prose ol,.prose ul{margin:0;padding-left:20px;display:grid;gap:4px}
.legend{display:grid;gap:6px}
.legend div{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.srclist{margin:0;padding-left:18px;display:grid;gap:4px;font-size:.82rem;overflow-wrap:anywhere}
.empty{color:var(--muted);text-align:center;padding:28px 8px}

/* alt gezinme */
.tabbar{background:var(--paper);border-top:1px solid var(--line)}
.tabbar .col{display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:.68rem;font-weight:600;padding:8px 2px 9px;cursor:pointer;display:grid;justify-items:center;gap:3px}
.tabbar svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar .dot{position:relative}
.tabbar .dot[data-n]::after{content:attr(data-n);position:absolute;top:-4px;left:14px;background:var(--bad);color:var(--paper);font-size:.58rem;border-radius:999px;padding:0 4px;line-height:1.5;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<template id="kapsamTpl"><p>Sorular özgün olarak yazıldı; her mevzuat sorusu cevabın dayandığı maddeye bağlandı. Ekim 2026 güncellemesinde projeye eklenen resmî mevzuat metinleri (mevzuat.gov.tr çıktıları) esas alındı ve mevcut sorular bu metinlerle yeniden karşılaştırıldı. Bu karşılaştırmada 222 sayılı Kanun'daki yürürlükten kalkmış kurul hükmüne dayanan soru, Anayasa md.123 ifadesi, 3628 md.7 atfı, 3628 md.10 süresi ve 4734 md.53/j'deki 2025 değişikliği düzeltildi.</p>
      <div class="legend">
        <div><span class="vb R">Resmî metin</span> Projedeki resmî mevzuat metni (mevzuat.gov.tr çıktısı) veya kurum sitesindeki konsolide metinle karşılaştırıldı.</div>
        <div><span class="vb E">İfade eşleşmesi</span> Madde ifadesi Anayasa Mahkemesi kararlarında (anayasa.gov.tr) birebir arandı ve bulundu.</div>
        <div><span class="vb D">Derleme metin</span> Güncel konsolide metni yayımlayan hukuk/mevzuat sitesiyle karşılaştırıldı. Sınavdan önce resmî metinden bir kez daha kontrol edin.</div>
        <div><span class="vb A">Mevzuat dışı</span> İstatistik, Ölçme ve Değerlendirme ile İnkılap Tarihi soruları; projedeki ders notlarına ve yerleşik akademik bilgiye dayanır.</div>
      </div>
      <p><b>Kapsam:</b> Sorular, 17/8/2024 değişikliğiyle güncellenen sınav konularına göre düzenlendi. 5378 sayılı Engelliler Hakkında Kanun, 573 sayılı Özel Eğitim Hakkında KHK, İstatistik ile Ölçme ve Değerlendirme eklendi. Listede yer almayan 652 sayılı KHK, 439 sayılı Kanun ve Öğretmenlik Meslek Bilgisi soruları çıkarıldı; bunlardan ölçme-değerlendirme ve özel eğitim soruları ilgili konulara taşındı. Genel Kültür ve Özel Alan Bilgisi için sabit bir mevzuat dayanağı olmadığından soru yazılmadı. 657 md.104'teki analık izni süreleri olası değişiklikler nedeniyle soru dışında bırakıldı.</p>
      <p><b>Yönetmelik soruları (15.10.2026):</b> Projedeki 15 yönetmelik metninden madde atıflı 257 soru eklendi: Özel Eğitim Hizmetleri, Ortaöğretim Kurumları, Okul Öncesi ve İlköğretim Kurumları (28.07.2026 değişikliği işlenmiş), Ölçme ve Değerlendirme, Teftiş Kurulu, Okul-Aile Birliği, Taşıma Yoluyla Eğitime Erişim, Eğitim Kurumları Yönetici Görevlendirme (30.01.2026), Rehberlik ve Psikolojik Danışma, Sosyal Etkinlikler, Millî Eğitim Müdürlükleri (26.04.2025), Kurum Açma-Kapatma ve Ad Verme, Döner Sermaye İşletmeleri; genel mevzuata Devlet Memurları Disiplin Yönetmeliği, mali mevzuata Taşınır Mal Yönetmeliği (10.10.2024). Mülga 2021 Yönetici Seçme ve 2012 İl-İlçe MEM yönetmeliklerinden soru yazılmadı.</p>
      <p><b>Dikkat:</b> 7354 sayılı Öğretmenlik Meslek Kanunu, 7528 sayılı Öğretmenlik Mesleği Kanunu (RG 18.10.2024) ile yürürlükten kalktı. 2577 md.10-11 ve md.16'daki süreler bugün 30 gündür; eski metinlerde 60 gün yazar. İhale eşik değerleri, kesinlik sınırları ve para cezası tutarları her yıl güncellendiği için sorularda tutar yerine süre ve oranlar esas alındı.</p>
    </template>

var Q=[
{b:"a",k:"Anayasa",q:"Anayasa'nın 4. maddesine göre “değiştirilemez ve değiştirilmesi teklif edilemez” hükümler hangi maddelerdir?",o:["1, 2 ve 3. maddeler","1, 2 ve 5. maddeler","2, 3 ve 10. maddeler","1, 3 ve 42. maddeler"],a:0,e:"Devletin şeklinin Cumhuriyet olduğu (md.1), Cumhuriyetin nitelikleri (md.2) ve devletin bütünlüğü, resmî dili, bayrağı, millî marşı ve başkentini düzenleyen md.3 değiştirilemez ve değiştirilmesi teklif edilemez.",d:"Anayasa md.4",s:"pAy"},
{b:"a",k:"Anayasa",q:"Aşağıdakilerden hangisi Anayasa'nın 2. maddesinde Cumhuriyetin nitelikleri arasında sayılmaz?",o:["Demokratik","Laik","Sosyal hukuk devleti","Federal"],a:3,e:"Md.2: Türkiye Cumhuriyeti, insan haklarına saygılı, Atatürk milliyetçiliğine bağlı, demokratik, laik ve sosyal bir hukuk devletidir. Devletin ülkesi ve milletiyle bölünmez bütünlüğü md.3'tedir; federal yapı yoktur.",d:"Anayasa md.2",s:"pAy"},
{b:"a",k:"Anayasa",q:"Anayasa'ya göre din kültürü ve ahlak öğretimi hangi kurumlarda okutulan zorunlu dersler arasında yer alır?",o:["Yalnızca ilköğretim kurumlarında","İlk ve ortaöğretim kurumlarında","Ortaöğretim ve yükseköğretim kurumlarında","Velinin yazılı talebi bulunan okullarda"],a:1,e:"Md.24: Din ve ahlak eğitim ve öğretimi Devletin gözetim ve denetimi altında yapılır; din kültürü ve ahlak öğretimi ilk ve ortaöğretim kurumlarında zorunlu dersler arasındadır. Bunun dışındaki din eğitimi kişinin veya küçüklerde kanuni temsilcisinin isteğine bağlıdır.",d:"Anayasa md.24",s:"pAy"},
{b:"a",k:"Anayasa",q:"Anayasa'nın 42. maddesine göre “İlköğretim kız ve erkek bütün vatandaşlar için zorunludur ve … parasızdır.” cümlesinde boş bırakılan yere ne gelir?",o:["tüm okullarda","Devlet okullarında","yatılı okullarda","ilk dört yılda"],a:1,e:"Md.42: İlköğretim kız ve erkek bütün vatandaşlar için zorunludur ve Devlet okullarında parasızdır.",d:"Anayasa md.42",s:"pAy"},
{b:"a",k:"Anayasa",q:"Anayasa'nın 42. maddesine göre aşağıdakilerden hangisi doğrudur?",o:["Türkçeden başka hiçbir dil, eğitim ve öğretim kurumlarında Türk vatandaşlarına ana dilleri olarak okutulamaz ve öğretilemez.","Eğitim kurumlarında yabancı dil öğretimi yasaktır.","Ana dil olarak okutulacak diller Cumhurbaşkanlığı kararnamesiyle belirlenir.","Ana dil öğretimi yalnızca özel okullarda serbesttir."],a:0,e:"Md.42 ana dil yasağını koyar; eğitim ve öğretim kurumlarında okutulacak yabancı diller ise ayrıca kanunla düzenlenir.",d:"Anayasa md.42",s:"pAy"},
{b:"a",k:"Anayasa",q:"Cumhurbaşkanlığı ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?",o:["Aday, kırk yaşını doldurmuş olmalıdır.","Aday, yükseköğrenim yapmış olmalıdır.","Bir kimse en fazla iki defa Cumhurbaşkanı seçilebilir.","Cumhurbaşkanının görev süresi yedi yıldır."],a:3,e:"Md.101: Cumhurbaşkanı, kırk yaşını doldurmuş, yükseköğrenim yapmış ve milletvekili seçilme yeterliliğine sahip Türk vatandaşları arasından halk tarafından seçilir; görev süresi beş yıldır, bir kimse en fazla iki defa seçilebilir. Md.77 seçimlerin beş yılda bir aynı gün yapılacağını düzenler.",d:"Anayasa md.101, md.77",s:"pAy"},
{b:"a",k:"Anayasa",q:"Aşağıdakilerden hangisi Cumhurbaşkanlığı kararnamesiyle düzenlenemez?",o:["Bakanlıkların kuruluş ve görevleri","Siyasi haklar ve ödevler","Üst kademe kamu yöneticilerinin atanma usul ve esasları","Cumhurbaşkanlığı teşkilatı"],a:1,e:"Md.104: Temel haklar, kişi hakları ve ödevleri ile siyasi haklar ve ödevler Cumhurbaşkanlığı kararnamesiyle düzenlenemez. Anayasada münhasıran kanunla düzenleneceği belirtilen ve kanunda açıkça düzenlenen konularda da CBK çıkarılamaz.",d:"Anayasa md.104",s:"pAy"},
{b:"a",k:"Anayasa",q:"Anayasa'ya göre kamu tüzelkişiliği nasıl kurulur?",o:["Yalnızca kanunla","Kanunla veya Cumhurbaşkanlığı kararnamesiyle","Kanun veya yönetmelikle","Bakanın onayıyla"],a:1,e:"Md.123: Kamu tüzelkişiliği, ancak kanunla veya Cumhurbaşkanlığı kararnamesiyle kurulur. İdarenin kuruluş ve görevleri merkezden yönetim ve yerinden yönetim esaslarına dayanır.",d:"Anayasa md.123",s:"pAy"},
{b:"a",k:"Anayasa",q:"Anayasa'ya göre idari işlemlere karşı açılan davalarda süre ne zaman başlar?",o:["İşlemin yapıldığı tarihte","Yazılı bildirim tarihinde","İşlemin Resmî Gazete'de yayımlandığı tarihte","İlgilinin işlemi öğrendiği tarihten 15 gün sonra"],a:1,e:"Md.125: İdari işlemlere karşı açılan davalarda süre, yazılı bildirim tarihinden başlar. 2577 md.7 de sürenin yazılı bildirimi izleyen günden başlayacağını düzenler.",d:"Anayasa md.125",s:"pAy"},
{b:"a",k:"Anayasa",q:"Anayasa'ya göre illerin idaresi hangi esasa dayanır?",o:["Yerinden yönetim","Yetki genişliği","İdari vesayet","Hizmet yerinden yönetim"],a:1,e:"Md.126: Türkiye, merkezî idare kuruluşu bakımından illere, iller de diğer kademeli bölümlere ayrılır. İllerin idaresi yetki genişliği esasına dayanır.",d:"Anayasa md.126",s:"pAy"},
{b:"a",k:"Anayasa",q:"Merkezî idarenin mahallî idareler üzerindeki yetkisi Anayasa'da nasıl adlandırılır?",o:["Hiyerarşi yetkisi","İdari vesayet yetkisi","Yetki genişliği","Disiplin yetkisi"],a:1,e:"Md.127: Merkezî idare, mahallî idareler üzerinde kanunda belirtilen esas ve usuller dairesinde idari vesayet yetkisine sahiptir. Mahallî idare organlarının seçimleri beş yılda bir yapılır.",d:"Anayasa md.127",s:"pAy"},
{b:"a",k:"Anayasa",q:"Anayasa'nın 129. maddesine göre aşağıdakilerden hangisi yanlıştır?",o:["Memurlara savunma hakkı tanınmadıkça disiplin cezası verilemez.","Disiplin kararları yargı denetimi dışında bırakılamaz.","Memurlar hakkında ceza kovuşturması açılması, kanunla belirlenen istisnalar dışında, kanunun gösterdiği idari merciin iznine bağlıdır.","Uyarma ve kınama cezaları yargı denetimi dışındadır."],a:3,e:"2010 değişikliğiyle uyarma ve kınama dahil bütün disiplin kararları yargı denetimine açıldı. Md.129: Disiplin kararları yargı denetimi dışında bırakılamaz.",d:"Anayasa md.129",s:"pAy"},
{b:"a",k:"Anayasa",q:"Anayasa değişikliği en az kaç milletvekili tarafından teklif edilebilir?",o:["TBMM üye tamsayısının beşte biri","TBMM üye tamsayısının üçte biri","TBMM üye tamsayısının salt çoğunluğu","TBMM üye tamsayısının üçte ikisi"],a:1,e:"Md.175: Anayasanın değiştirilmesi TBMM üye tamsayısının en az üçte biri tarafından yazıyla teklif edilebilir.",d:"Anayasa md.175",s:"pAy"},
{b:"a",k:"Anayasa",q:"2017 Anayasa değişikliğiyle Bakanlar Kuruluna kanun hükmünde kararname çıkarma yetkisi veren hangi madde yürürlükten kaldırılmıştır?",o:["Md.91","Md.104","Md.106","Md.123"],a:0,e:"6771 sayılı Kanunla md.91 yürürlükten kaldırıldı; yürütme alanında Cumhurbaşkanlığı kararnamesi (md.104) düzenlendi.",d:"Anayasa md.91 (mülga)",s:"pAy"},
{b:"a",k:"Anayasa",q:"2017 değişikliklerine göre TBMM ve Cumhurbaşkanlığı seçimleri ne sıklıkla yapılır?",o:["Beş yılda bir aynı gün","Dört yılda bir aynı gün","TBMM dört, Cumhurbaşkanı beş yılda bir","TBMM beş, Cumhurbaşkanı yedi yılda bir"],a:0,e:"Md.77: TBMM genel seçimleri ile Cumhurbaşkanı seçimi beş yılda bir aynı gün yapılır.",d:"Anayasa md.77",s:"pAy"},
{b:"a",k:"Anayasa",q:"Anayasa'nın 24. maddesine göre din kültürü ve ahlak öğretimi dışındaki din eğitimi ve öğretimi neye bağlıdır?",o:["Kişilerin kendi isteğine, küçüklerde kanuni temsilcinin talebine","Okul müdürünün kararına","Diyanet İşleri Başkanlığının onayına","Valiliğin iznine"],a:0,e:"Md.24: Din ve ahlak eğitim ve öğretimi Devletin gözetim ve denetimi altında yapılır.",d:"Anayasa md.24",s:"pAy"},
{b:"a",k:"İdare Hukuku",q:"2577 sayılı Kanun'un 2. maddesinde sayılan idari dava türlerinden biri değildir?",o:["İptal davası","Tam yargı davası","İdari sözleşmelerden doğan uyuşmazlıklara ilişkin davalar","Tespit davası"],a:3,e:"Md.2: İdari dava türleri iptal davaları, tam yargı davaları ve idari sözleşmelerden doğan uyuşmazlıklara ilişkin davalardır.",d:"2577 s. K. md.2",s:"p2577"},
{b:"a",k:"İdare Hukuku",q:"İptal davasında idari işlemin hukuka aykırılığı aşağıdaki unsurlardan hangisi yönünden incelenemez?",o:["Yetki","Sebep","Maksat","Yerindelik"],a:3,e:"İptal davası yetki, şekil, sebep, konu ve maksat yönlerinden biriyle hukuka aykırılık hâlinde açılır. Md.2/2: İdari yargı yetkisi hukuka uygunluk denetimiyle sınırlıdır; mahkemeler yerindelik denetimi yapamaz.",d:"2577 s. K. md.2",s:"p2577"},
{b:"a",k:"İdare Hukuku",q:"Özel kanunlarında ayrı süre gösterilmeyen hâllerde genel dava açma süreleri hangisidir?",o:["Danıştay ve idare mahkemelerinde 60, vergi mahkemelerinde 30 gün","Danıştay ve idare mahkemelerinde 30, vergi mahkemelerinde 60 gün","Bütün idari yargı mercilerinde 60 gün","Bütün idari yargı mercilerinde 30 gün"],a:0,e:"Md.7: Dava açma süresi Danıştayda ve idare mahkemelerinde altmış, vergi mahkemelerinde otuz gündür.",d:"2577 s. K. md.7",s:"p2577"},
{b:"a",k:"İdare Hukuku",q:"İlgililer, idari davaya konu olabilecek bir işlemin yapılması için idari makamlara başvurduğunda kaç gün içinde cevap verilmezse istek reddedilmiş sayılır?",o:["15 gün","30 gün","60 gün","90 gün"],a:1,e:"Md.10 güncel metne göre süre otuz gündür (eski metinlerde altmış gün yazar). Kesin olmayan cevapta bekleme süresi başvuru tarihinden itibaren dört ayı geçemez.",d:"2577 s. K. md.10",s:"p2577"},
{b:"a",k:"İdare Hukuku",q:"İşlemin kaldırılması veya değiştirilmesi için dava açmadan önce üst makama başvurulmasıyla ilgili hangisi doğrudur?",o:["Başvuru işlemekte olan dava açma süresini durdurur; otuz gün içinde cevap verilmezse istek reddedilmiş sayılır.","Başvuru dava açma süresini keser ve süre baştan başlar.","Başvurunun dava açma süresine etkisi yoktur.","Altmış gün içinde cevap verilmezse istek kabul edilmiş sayılır."],a:0,e:"Md.11: Üst makama başvuru dava açma süresini durdurur. Ret veya ret sayılma hâlinde süre yeniden işlemeye başlar ve başvuru tarihine kadar geçmiş süre de hesaba katılır.",d:"2577 s. K. md.11",s:"p2577"},
{b:"a",k:"İdare Hukuku",q:"2577 sayılı Kanun'a göre yürütmenin durdurulması kararı için hangisi gerekir?",o:["Telafisi güç veya imkânsız zarar ya da açıkça hukuka aykırılık şartlarından biri","Telafisi güç veya imkânsız zararların doğması ve işlemin açıkça hukuka aykırı olması şartlarının birlikte gerçekleşmesi","Dava açılmış olması yeterlidir","Davacının teminat yatırması yeterlidir"],a:1,e:"Md.27: Dava açılması işlemin yürütülmesini kendiliğinden durdurmaz. İki şart birlikte aranır. Yürütmeyi durdurma kararlarına karşı itiraz süresi yedi gündür.",d:"2577 s. K. md.27",s:"p2577"},
{b:"a",k:"İdare Hukuku",q:"Aşağıdakilerden hangisi mahallî idare değildir?",o:["İl özel idaresi","Belediye","Köy","Valilik"],a:3,e:"Mahallî idareler il, belediye veya köy halkının mahallî müşterek ihtiyaçlarını karşılayan, karar organları seçimle oluşan kamu tüzelkişileridir. Valilik merkezî idarenin taşra teşkilatıdır ve yetki genişliği esasıyla yönetilir.",d:"Anayasa md.126-127",s:"pAy"},
{b:"a",k:"İdare Hukuku",q:"2577 sayılı Kanun'a göre yürütmenin durdurulması kararına karşı itiraz süresi nedir?",o:["7 gün","15 gün","30 gün","60 gün"],a:0,e:"Md.27/7: Yürütmenin durdurulması isteminin kabulü veya reddi kararlarına tebliğden itibaren yedi gün içinde bir defaya mahsus itiraz edilebilir.",d:"2577 s. K. md.27",s:"p2577"},
{b:"a",k:"İdare Hukuku",q:"2577 sayılı Kanun'a göre yürütmenin durdurulması kararında kural nedir?",o:["Kararın teminat karşılığında verilmesi esastır.","Teminat hiçbir durumda alınamaz.","Teminat yalnızca vergi davalarında alınır.","Teminatı idare yatırır."],a:0,e:"Md.27/6 teminatı esas kabul eder; Kanunda sayılan bazı hâllerde teminat aranmayabilir.",d:"2577 s. K. md.27",s:"p2577"},
{b:"a",k:"İdare Hukuku",q:"İdari makama başvuruya kesin olmayan bir cevap verilmesi hâlinde, ilgilinin kesin cevabı bekleme süresi en fazla ne kadardır?",o:["Başvuru tarihinden itibaren dört ay","İki ay","Altı ay","Bir yıl"],a:0,e:"Md.10/2: İlgili bu cevabı ret sayarak dava açabileceği gibi kesin cevabı da bekleyebilir; bekleme süresi başvuru tarihinden itibaren dört ayı geçemez.",d:"2577 s. K. md.10",s:"p2577"},
{b:"a",k:"İdare Hukuku",q:"Üst makama yapılan başvurunun reddi hâlinde dava açma süresi için hangisi doğrudur?",o:["Süre yeniden işlemeye başlar ve başvuru tarihine kadar geçmiş süre de hesaba katılır.","Süre en baştan yeniden başlar.","Dava açma hakkı düşer.","Süre iki katına çıkar."],a:0,e:"Md.11/2 durma etkisinin sonucunu düzenler.",d:"2577 s. K. md.11",s:"p2577"},
{b:"a",k:"İdare Hukuku",q:"2577 sayılı Kanun'a göre idari yargı yetkisi için hangisi doğrudur?",o:["İdari eylem ve işlemlerin hukuka uygunluğunun denetimiyle sınırlıdır; yerindelik denetimi yapılamaz.","İdarenin takdir yetkisini kullanarak işlem tesis edebilir.","Yalnızca yerindelik denetimi yapar.","Kanunların Anayasaya uygunluğunu denetler."],a:0,e:"Md.2/2: İdari mahkemeler idari eylem ve işlem niteliğinde yargı kararı veremez, idarenin takdir yetkisini kaldıracak biçimde karar veremez.",d:"2577 s. K. md.2",s:"p2577"},
{b:"a",k:"İdare Hukuku",q:"2577 sayılı Kanun'a göre idari eylemlerden hakları ihlal edilenler, tam yargı davası açmadan önce idareye hangi süre içinde başvurmalıdır?",o:["Eylemi öğrendikleri tarihten itibaren bir yıl ve her hâlde eylem tarihinden itibaren beş yıl içinde","Eylemi öğrendikleri tarihten itibaren 60 gün içinde","Eylem tarihinden itibaren on yıl içinde","Herhangi bir süreye bağlı olmaksızın"],a:0,e:"İdari eylemlerde önce idareye başvurulur: öğrenmeden itibaren 1 yıl, her hâlde eylemden itibaren 5 yıl. İdarenin cevabına veya zımni redde göre dava süresi ayrıca işler.",d:"2577 s. İYUK md.13",s:"p2577"},
{b:"a",k:"İdare Hukuku",q:"Aşağıdakilerden hangisi 2577 md.14 uyarınca dava dilekçesinin ilk incelemesinde bakılan hususlardan biri değildir?",o:["Dava konusu işlemin esas yönünden hukuka uygun olup olmadığı","Görev ve yetki","Ehliyet ve husumet","Süre aşımı"],a:0,e:"İlk inceleme; görev ve yetki, idari merci tecavüzü, ehliyet, kesin ve yürütülmesi gereken işlem, süre aşımı, husumet ve dilekçenin md.3 ve md.5'e uygunluğu üzerinedir. Esasa ilişkin hukuka uygunluk incelemesi sonraki aşamadır.",d:"2577 s. İYUK md.14",s:"p2577"},
{b:"a",k:"İdare Hukuku",q:"2577 sayılı Kanun'a göre dava dilekçesine karşı savunma (cevap) verme süresi ne kadardır?",o:["Tebliğden itibaren 30 gün","Tebliğden itibaren 15 gün","Tebliğden itibaren 60 gün","Tebliğden itibaren 7 gün"],a:0,e:"Güncel metinde dilekçeye cevap süresi tebliğden itibaren 30 gündür; eski metinlerdeki 60 günlük süre değiştirilmiştir.",d:"2577 s. İYUK md.16",s:"p2577"},
{b:"a",k:"İdare Hukuku",q:"2577 md.20/A'da düzenlenen ivedi yargılama usulünde dava açma süresi ve kararlara karşı temyiz süresi hangisidir?",o:["Dava açma 30 gün; temyiz 15 gün","Dava açma 60 gün; temyiz 30 gün","Dava açma 10 gün; temyiz 5 gün","Dava açma 15 gün; temyiz 7 gün"],a:0,e:"İvedi yargılamada dava açma süresi 30 gün, temyiz süresi kararın tebliğinden itibaren 15 gündür; yürütmeyi durdurma kararlarına itiraz edilemez.",d:"2577 s. İYUK md.20/A",s:"p2577"},
{b:"a",k:"İdare Hukuku",q:"2577 md.20/A kapsamındaki ivedi yargılama usulünde yürütmeyi durdurma kararlarına itiraz için hangisi doğrudur?",o:["Yürütmeyi durdurma isteği hakkında verilen kararlara itiraz edilemez.","Yedi gün içinde bölge idare mahkemesine itiraz edilebilir.","Danıştay İdari Dava Daireleri Kuruluna itiraz edilebilir.","Yalnızca idare itiraz edebilir."],a:0,e:"İvedi yargılamada süreler kısaltılmış ve yürütmeyi durdurma kararlarına itiraz yolu kapatılmıştır.",d:"2577 s. İYUK md.20/A",s:"p2577"},
{b:"a",k:"İdare Hukuku",q:"2577 md.20/B kapsamında, MEB veya ÖSYM gibi kurumlarca yapılan sınavlara ilişkin işlemlere karşı dava açma süresi kaç gündür?",o:["10 gün","30 gün","60 gün","15 gün"],a:0,e:"Sınav işlemlerine karşı özel ivedi usulde dava açma süresi 10 gün, temyiz süresi 5 gündür; mahkeme 15 gün içinde karar verir.",d:"2577 s. İYUK md.20/B",s:"p2577"},
{b:"a",k:"İdare Hukuku",q:"2577 md.20/B kapsamındaki sınav davalarında verilen kararlara karşı temyiz süresi ne kadardır?",o:["Tebliğden itibaren 5 gün","Tebliğden itibaren 15 gün","Tebliğden itibaren 30 gün","Temyiz yolu kapalıdır"],a:0,e:"Sınav davalarına ilişkin özel usulde temyiz süresi 5 gündür; dava açma süresi 10 gündür.",d:"2577 s. İYUK md.20/B",s:"p2577"},
{b:"a",k:"İdare Hukuku",q:"2577 sayılı Kanun'a göre idare, mahkeme kararının gereğini kararın tebliğinden başlayarak en geç ne kadar sürede yerine getirmek zorundadır?",o:["30 gün","60 gün","15 gün","90 gün"],a:0,e:"İdare, esasa ve yürütmeyi durdurmaya ilişkin kararların gereğini gecikmeksizin, tebliğden itibaren 30 günü geçmemek üzere yerine getirir.",d:"2577 s. İYUK md.28",s:"p2577"},
{b:"a",k:"İdare Hukuku",q:"2577 sayılı Kanun'a göre idari davalarda genel yetkili idare mahkemesi hangisidir?",o:["Dava konusu işlemi yapan idari merciin bulunduğu yer idare mahkemesi","Davacının yerleşim yeri idare mahkemesi","Ankara idare mahkemesi","Davalı idarenin merkezinin bulunduğu yer idare mahkemesi"],a:0,e:"Genel kural, işlemi yapan idari merciin bulunduğu yer idare mahkemesinin yetkili olmasıdır; kamu görevlilerinin özlük davaları gibi istisnalar ayrıca düzenlenmiştir.",d:"2577 s. İYUK md.32",s:"p2577"},
{b:"a",k:"İdare Hukuku",q:"İdare ve vergi mahkemelerinin kesin olmayan nihai kararlarına karşı istinaf başvuru süresi nedir?",o:["Kararın tebliğinden itibaren 30 gün","Kararın tebliğinden itibaren 15 gün","Kararın tebliğinden itibaren 60 gün","Kararın tebliğinden itibaren 7 gün"],a:0,e:"İstinaf ve temyiz için genel süre tebliğden itibaren 30 gündür. Kesinlik sınırları her yıl güncellendiği için tutar ezberlemek yerine süreye odaklanın.",d:"2577 s. İYUK md.45-46",s:"p2577"},
{b:"a",k:"İdare Hukuku",q:"Kesinleşmiş idare mahkemesi kararlarına karşı kanun yararına temyiz yoluna kim başvurabilir?",o:["Danıştay Başsavcısı","Davanın tarafları","Adalet Bakanı","Bölge idare mahkemesi başkanı"],a:0,e:"Kanun yararına temyiz, Danıştay Başsavcısına tanınmış olağanüstü kanun yoludur; verilen bozma kararı kesinleşmiş kararın hukuki sonuçlarını kaldırmaz.",d:"2577 s. İYUK md.51",s:"p2577"},
{b:"a",k:"İdare Hukuku",q:"2577 sayılı Kanun'a göre yargılamanın yenilenmesi için başvuru süresi kaç gündür?",o:["60 gün","30 gün","15 gün","1 yıl"],a:0,e:"Yargılamanın yenilenmesi süresi 60 gündür; süre, sebebin öğrenilmesinden itibaren işler ve kanunda üst sınır süreleri de öngörülmüştür.",d:"2577 s. İYUK md.53",s:"p2577"},
{b:"a",k:"İdare Hukuku",q:"İdari yargıda adli tatil hangi tarihler arasındadır?",o:["20 Temmuz – 31 Ağustos","1 Temmuz – 31 Ağustos","15 Temmuz – 15 Eylül","1 Ağustos – 15 Eylül"],a:0,e:"Danıştay ve idari mahkemeler her yıl 20 Temmuz'dan 31 Ağustos'a kadar tatile girer; ivedi işler için nöbetçi daireler görev yapar.",d:"2577 s. İYUK md.61",s:"p2577"},
{b:"a",k:"657 DMK",q:"Aşağıdakilerden hangisi 657 sayılı Kanun'un 3. maddesinde sayılan temel ilkelerden biri değildir?",o:["Sınıflandırma","Kariyer","Liyakat","Kıdem"],a:3,e:"Md.3: Kanunun temel ilkeleri sınıflandırma, kariyer ve liyakattir.",d:"657 s. K. md.3",s:"s657"},
{b:"a",k:"657 DMK",q:"Devlet memurları yemin belgesini, asli memurluğa atandıktan sonra en geç ne kadar süre içinde düzenlenen merasimle imzalar?",o:["15 gün","Bir ay","İki ay","Adaylık süresinin sonunda"],a:1,e:"Md.6: Memurlar sadakat yükümlülüğünü asli memurluğa atandıktan sonra en geç bir ay içinde kurumlarınca düzenlenecek merasimle yemin ederek belirtir.",d:"657 s. K. md.6",s:"s657"},
{b:"a",k:"657 DMK",q:"657 sayılı Kanun'un 11. maddesine göre aşağıdakilerden hangisi doğrudur?",o:["Mevzuata aykırı bulunan emrinde ısrar eden amir bu emri yazı ile yenilerse memur emri yapmaya mecburdur; sorumluluk emri verene aittir.","Mevzuata aykırı emir yazı ile yenilense de yerine getirilmez.","Konusu suç teşkil eden emir yazılı verilirse yerine getirilir.","Konusu suç teşkil eden emri yerine getiren memur sorumluluktan kurtulur."],a:0,e:"Md.11: Konusu suç teşkil eden emir hiçbir suretle yerine getirilmez; yerine getiren kimse sorumluluktan kurtulamaz. Acele hâllerde kanunla gösterilen istisnalar saklıdır.",d:"657 s. K. md.11",s:"s657"},
{b:"a",k:"657 DMK",q:"Memurun kusuruyla idarenin uğradığı zararlardan, memur kabul ederse disiplin amiri veya disiplin kurulu kararıyla ödettirilebilecek olanların üst sınırı nedir?",o:["Fiil tarihinde en alt derecenin birinci kademesindeki memurun brüt aylığının yarısı","Memurun kendi net aylığının yarısı","Asgari ücretin iki katı","En yüksek Devlet memuru aylığının tamamı"],a:0,e:"Md.12: Bu sınırı geçmeyen zararlar, kabul etmesi hâlinde disiplin amiri veya yetkili disiplin kurulu kararına göre ilgili memurca ödenir; aşan zararlarda genel hükümler uygulanır.",d:"657 s. K. md.12",s:"s657"},
{b:"a",k:"657 DMK",q:"Kişiler, kamu hukukuna tabi görevlerle ilgili uğradıkları zararlardan dolayı kime karşı dava açar?",o:["Görevi yerine getiren personele","İlgili kuruma","Personel ve kuruma birlikte","Yalnızca Hazineye"],a:1,e:"Md.13: Dava personel aleyhine değil ilgili kurum aleyhine açılır; kurumun genel hükümlere göre sorumlu personele rücu hakkı saklıdır.",d:"657 s. K. md.13",s:"s657"},
{b:"a",k:"657 DMK",q:"Kamu görevleri hakkında basına bilgi kim tarafından verilebilir?",o:["Görevle ilgili her memur","Bakanın yetkili kılacağı görevli; illerde valiler veya yetkili kılacakları görevli","Yalnızca kurum hukuk müşaviri","Yetkili sendika temsilcisi"],a:1,e:"Md.15: Devlet memurları kamu görevleri hakkında basına, haber ajanslarına veya radyo ve televizyona bilgi veya demeç veremez.",d:"657 s. K. md.15",s:"s657"},
{b:"a",k:"657 DMK",q:"Eşi veya reşit olmayan çocuğu ticaret yasağı kapsamındaki bir faaliyette bulunan memur, bu durumu kaç gün içinde kurumuna bildirmekle yükümlüdür?",o:["7 gün","15 gün","30 gün","60 gün"],a:1,e:"Md.28 son fıkra: Eşleri, reşit olmayan veya mahcur olan çocukları yasaklanan faaliyetlerde bulunan memurlar bu durumu 15 gün içinde bağlı oldukları kuruma bildirir.",d:"657 s. K. md.28",s:"s657"},
{b:"a",k:"657 DMK",q:"I. Kasten işlenen bir suçtan 1 yıl hapis cezası almak<br>II. Taksirli bir suçtan 2 yıl hapis cezası almak<br>III. Affa uğramış olsa bile zimmet suçundan mahkûm olmak<br>IV. Kasten işlenen ve katalogda sayılmayan bir suçtan 9 ay hapis cezası almak<br>Hangileri Devlet memurluğuna alınmaya engeldir?",o:["I ve III","I, II ve III","II ve IV","I, III ve IV"],a:0,e:"Md.48/A-5: Kasten işlenen bir suçtan bir yıl veya daha fazla hapis ya da affa uğramış olsa bile sayılan suçlardan (zimmet, irtikâp, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, ihaleye fesat karıştırma vb.) mahkûmiyet engeldir. Taksirli suçlar sayılmamıştır.",d:"657 s. K. md.48/A-5",s:"s657"},
{b:"a",k:"657 DMK",q:"657 sayılı Kanun'a tabi kurumların kadrolarında çalıştırmak zorunda oldukları engelli personel oranı nedir?",o:["%2","%3","%4","%5"],a:1,e:"Md.53: Oran %3'tür; hesaplamada yurtdışı teşkilat hariç toplam dolu kadro sayısı esas alınır.",d:"657 s. K. md.53",s:"s657"},
{b:"a",k:"657 DMK",q:"Aday memurun adaylık süresi için hangisi doğrudur?",o:["Altı aydan az, bir yıldan çok olamaz.","Bir yıldan az, iki yıldan çok olamaz; bu sürede başka kuruma nakli yapılamaz.","En az iki yıldır.","Bir yıldır ve uzatılamaz."],a:1,e:"Md.54: Aday olarak atanmış memurun adaylık süresi bir yıldan az, iki yıldan çok olamaz ve bu süre içinde başka kurumlara nakli yapılamaz.",d:"657 s. K. md.54",s:"s657"},
{b:"a",k:"657 DMK",q:"Adaylık devresi içinde veya sonunda ilişiği kesilenler (sağlık nedenleri hariç) kaç yıl Devlet memurluğuna alınmaz?",o:["1 yıl","2 yıl","3 yıl","5 yıl"],a:2,e:"Md.57: Adaylık süresinde aylıktan kesme veya kademe ilerlemesinin durdurulması cezası alanların ilişiği kesilir; md.56-57'ye göre ilişiği kesilenler 3 yıl memurluğa alınmaz.",d:"657 s. K. md.56-57",s:"s657"},
{b:"a",k:"657 DMK",q:"Yükselebilecekleri derecenin dördüncü kademesinden aylık almaya hak kazanan memurların kazanılmış hak aylıklarının bir üst dereceye yükseltilmesi için son kaç yıl içinde disiplin cezası almamış olmaları gerekir?",o:["5 yıl","6 yıl","8 yıl","10 yıl"],a:2,e:"Md.37: Son sekiz yıllık süre içinde herhangi bir disiplin cezası almayanların kazanılmış hak aylıkları kadro şartı aranmaksızın bir üst dereceye yükseltilir.",d:"657 s. K. md.37",s:"s657"},
{b:"a",k:"657 DMK",q:"Bakanlık maarif müfettiş yardımcıları, yeterlik sınavında başarı göstererek maarif müfettişliğine atanırken hangi ilerlemeden yararlanır?",o:["Bir kademe ilerlemesi","Bir derece yükselmesi","İki kademe ilerlemesi","Herhangi bir ilerleme uygulanmaz"],a:1,e:"Md.36 Ortak Hükümler A/11: Özel yarışma sınavıyla alınan müfettiş yardımcıları, yeterlik sınavında başarıyla müfettişliğe atanmaları sırasında bir defaya mahsus olmak üzere bir derece yükselmesinden yararlanır. Bakanlık maarif müfettiş yardımcıları 6764 sayılı Kanunla listeye eklendi.",d:"657 s. K. md.36/A-11",s:"s657"},
{b:"a",k:"657 DMK",q:"657 sayılı Kanun'a göre Eğitim ve Öğretim Hizmetleri Sınıfı kimleri kapsar?",o:["Eğitim ve öğretim vazifesiyle görevlendirilen öğretmenleri","Öğretmenler ile okul memurlarını","Millî Eğitim Bakanlığının bütün personelini","Öğretmenler ile maarif müfettişlerini"],a:0,e:"Md.36/IV: Sınıf, kurumlarda eğitim ve öğretim vazifesiyle görevlendirilen öğretmenleri kapsar. Daha önce bulunan “ilköğretim müfettişlerini ve yardımcılarını” ibaresi 5984 sayılı Kanunla çıkarıldı.",d:"657 s. K. md.36/IV",s:"s657"},
{b:"a",k:"657 DMK",q:"Devlet memurluğuna alınacak kadroların duyurusu, başvuru süresinin bitiminden en az kaç gün önce yapılır?",o:["7 gün","15 gün","30 gün","45 gün"],a:1,e:"Md.47: Duyuru, başvurma süresinin bitiminden en az 15 gün önce Resmî Gazete, internet haber sitesi, radyo, televizyon, gazete ve Basın İlân Kurumu İlan Portalından asgari biriyle yapılır.",d:"657 s. K. md.47",s:"s657"},
{b:"a",k:"657 DMK",q:"Hizmet süresi 12 yıl olan bir memurun yıllık izin süresi ne kadardır?",o:["20 gün","24 gün","30 gün","36 gün"],a:2,e:"Md.102: Hizmet süresi bir yıldan on yıla kadar (on yıl dahil) olanlara 20 gün, on yıldan fazla olanlara 30 gün yıllık izin verilir; zorunlu hâllerde gidiş-dönüş için ikişer gün yol izni eklenebilir.",d:"657 s. K. md.102",s:"s657k"},
{b:"a",k:"657 DMK",q:"657 sayılı Kanun'a göre öğretmenlerin yıllık izni hakkında hangisi doğrudur?",o:["Yaz tatili ve dinlenme tatillerinde izinli sayılırlar; ayrıca yıllık izin verilmez.","Yaz tatiline ek olarak 20 gün yıllık izin kullanırlar.","Yıllık izinlerini ders yılı içinde kullanırlar.","Yıllık izinleri üç yıl biriktirilebilir."],a:0,e:"Md.103: Öğretmenler yaz tatili ile dinlenme tatillerinde izinli sayılır. Hastalık ve diğer mazeret izinleri saklıdır.",d:"657 s. K. md.103",s:"s657k"},
{b:"a",k:"657 DMK",q:"Eşi doğum yapan erkek memura isteği üzerine ne kadar babalık izni verilir?",o:["3 gün","5 gün","10 gün","15 gün"],a:2,e:"Md.104/B: Babalık izni 10 gündür. Kendisinin veya çocuğunun evlenmesi ya da eşinin, çocuğunun, kendisinin veya eşinin ana, baba ve kardeşinin ölümü hâlinde isteği üzerine 7 gün izin verilir.",d:"657 s. K. md.104/B",s:"s657k"},
{b:"a",k:"657 DMK",q:"Kadın memura analık izninin bitiminden itibaren verilen süt izni hangisidir?",o:["İlk altı ayda günde üç saat, ikinci altı ayda günde bir buçuk saat","İlk altı ayda günde bir buçuk saat, ikinci altı ayda günde üç saat","Bir yıl boyunca günde iki saat","İlk yıl günde bir saat"],a:0,e:"Md.104/D: Süt izninin hangi saatler arasında ve kaç kerede kullanılacağına kadın memur karar verir.",d:"657 s. K. md.104/D",s:"s657k"},
{b:"a",k:"657 DMK",q:"657 sayılı Kanun'a göre genel kural olarak kaç yaşını tamamlayanlar Devlet memuru olabilir?",o:["15","16","18","21"],a:2,e:"Md.40: Genel olarak 18 yaşını tamamlayanlar memur olabilir. Bir meslek veya sanat okulunu bitirenler en az 15 yaşını doldurmuş olmak ve kazai rüşt kararı almak şartıyla atanabilir.",d:"657 s. K. md.40",s:"s657"},
{b:"a",k:"657 DMK",q:"Aşağıdakilerden hangisi 657 sayılı Kanun'a değil özel kanunlarına tabidir?",o:["Hâkimler ve savcılar","Belediye memurları","İl özel idaresi memurları","Döner sermayeli kuruluşlarda çalışan memurlar"],a:0,e:"Md.1/3: Anayasa Mahkemesi üyeleri, hâkim ve savcılar, Danıştay ve Sayıştay meslek mensupları, öğretim üyeleri, subay ve astsubaylar, emniyet mensupları gibi gruplar özel kanunlarına tabidir.",d:"657 s. K. md.1",s:"s657"},
{b:"a",k:"657 DMK",q:"657 sayılı Kanun'da öngörülen yönetmelikler kim tarafından yürürlüğe konulur?",o:["Cumhurbaşkanınca","Bakanlar Kurulunca","Devlet Personel Başkanlığınca","İlgili bakanlıkça"],a:0,e:"Md.2: 703 sayılı KHK ile “Bakanlar Kurulu kararı ile” ibaresi “Cumhurbaşkanınca” olarak değiştirildi.",d:"657 s. K. md.2",s:"s657"},
{b:"a",k:"657 DMK",q:"657 md.4/B'ye 7433 sayılı Kanunla eklenen hükme göre, Cumhurbaşkanınca belirlenen pozisyonlarda istihdam edilen sözleşmeli personel aynı kurumda kaç yılı tamamlayınca talebi hâlinde memur kadrosuna atanır?",o:["3 yıl","2 yıl","4 yıl","5 yıl"],a:0,e:"Talep sürenin bitiminden itibaren 30 gün içinde yapılır. Bu personel üç yıl başka yere atanamaz; memur kadrosuna atananlar aynı yerde en az bir yıl daha görev yapar.",d:"657 s. K. md.4/B",s:"s657"},
{b:"a",k:"657 DMK",q:"Sözleşmesini sözleşme dönemi içinde tek taraflı fesheden sözleşmeli personel, fesih tarihinden itibaren ne kadar süre kurumların sözleşmeli pozisyonlarında istihdam edilemez?",o:["1 yıl","6 ay","2 yıl","3 yıl"],a:0,e:"Md.4/B: Hizmet sözleşmesine aykırılık nedeniyle feshedilenler ve sözleşmeyi yenilemeyenler için de bir yıl kuralı uygulanır (Cumhurbaşkanınca belirlenen istisnalar hariç).",d:"657 s. K. md.4/B",s:"s657"},
{b:"a",k:"657 DMK",q:"7433 sayılı Kanunla 4/B'ye eklenen hükme göre, kademe ilerlemesinin durdurulması ve üstü ceza gerektiren fiillerde sözleşmeli personel hakkında ne yapılır?",o:["Disiplin kurulunun kararı alınarak atamaya yetkili amirin onayıyla sözleşmesine son verilir.","Aylıktan kesme cezası verilir.","Yalnızca uyarı yapılır.","Memurluktan çıkarma cezası verilir."],a:0,e:"Diğer disiplin konularında sözleşmeli personele Devlet memurlarının tabi olduğu hükümler uygulanır.",d:"657 s. K. md.4/B",s:"s657"},
{b:"a",k:"657 DMK",q:"657 sayılı Kanun'a göre geçici işçiler hangi süreyle çalıştırılır?",o:["Altı aydan az belirli süreli iş sözleşmesiyle","Bir yıldan az belirli süreli iş sözleşmesiyle","Üç aydan az","Dokuz aya kadar"],a:0,e:"Md.4/D: Mevsimlik veya kampanya işlerinde ya da orman yangınıyla mücadelede geçici iş pozisyonlarında çalışanlar; bunlar hakkında 657 hükümleri uygulanmaz.",d:"657 s. K. md.4/D",s:"s657"},
{b:"a",k:"657 DMK",q:"Amir durumundaki Devlet memurları için aşağıdakilerden hangisi doğrudur?",o:["Maiyetindeki memurdan hediye kabul edemez ve borç alamaz.","Maiyetindeki memura sözlü olarak kanuna aykırı emir verebilir.","Maiyetindeki memurun yetiştirilmesinden sorumlu değildir.","Amirlik yetkisini takdirine göre kullanır."],a:0,e:"Md.10: Amir maiyetine hakkaniyet ve eşitlik içinde davranır; kanunlara ve Cumhurbaşkanlığı kararnamelerine aykırı emir veremez.",d:"657 s. K. md.10",s:"s657"},
{b:"a",k:"657 DMK",q:"Görevleri icabı teslim edilen resmî belge, araç ve gereçleri görev sona erdiğinde iade zorunluluğu kimleri kapsar?",o:["Memuru ve mirasçılarını","Yalnızca memuru","Yalnızca amiri","Memurun eşini"],a:0,e:"Md.16: Bu zorunluluk memurun mirasçılarına da şamildir.",d:"657 s. K. md.16",s:"s657"},
{b:"a",k:"657 DMK",q:"Memurların müracaat ve şikâyetleri nasıl yapılır?",o:["Söz veya yazı ile en yakın amirden başlayarak silsile yoluyla, şikâyet edilen amir atlanarak","Doğrudan bakana","Yalnızca sendika aracılığıyla","Yalnızca noter kanalıyla"],a:0,e:"Md.21: Müracaat ve şikâyetler incelenerek en kısa zamanda ilgiliye bildirilir.",d:"657 s. K. md.21",s:"s657"},
{b:"a",k:"657 DMK",q:"Memur hakkındaki ihbarın garaz için uydurma suç isnadı olduğu anlaşılırsa, illerde isnatta bulunan hakkında kamu davası açılmasını kim ister?",o:["Vali","Kaymakam","İl millî eğitim müdürü","Memurun kendisi"],a:0,e:"Md.25: Merkezde memurun en büyük amiri, illerde valiler Cumhuriyet savcılığından kamu davası açılmasını ister.",d:"657 s. K. md.25",s:"s657"},
{b:"a",k:"657 DMK",q:"Memurlar aşağıdakilerden hangisinde görev alabilir?",o:["Üyesi olduğu yapı kooperatifinin yönetim kurulunda","Vakıf yükseköğretim kurumunda","Serbest meslek için açtığı büroda","Kollektif şirkette ortak olarak"],a:0,e:"Md.28/2: Üyesi olunan yapı, kalkınma ve tüketim kooperatifleri, kamu kurumu niteliğindeki meslek kuruluşları ve kanunla veya CBK ile kurulan yardım sandıklarının yönetim, denetim ve disiplin kurulu üyelikleri yasak dışındadır.",d:"657 s. K. md.28",s:"s657"},
{b:"a",k:"657 DMK",q:"Hediye alma yasağının kapsamını belirlemeye yetkili kurum hangisidir?",o:["Kamu Görevlileri Etik Kurulu","Sayıştay","Devlet Denetleme Kurulu","Kamu Denetçiliği Kurumu"],a:0,e:"Md.29: Etik Kurulu, en az genel müdür veya eşiti üst düzey görevlilerce alınan hediyelerin listesini gerektiğinde her yıl sonunda isteyebilir.",d:"657 s. K. md.29",s:"s657"},
{b:"a",k:"657 DMK",q:"Memurların kamu hizmetleriyle ilgili gizli bilgileri görevden ayrıldıktan sonra açıklaması için hangisi doğrudur?",o:["Yetkili bakanın yazılı izni olmadıkça yasaktır.","Görevden ayrılınca serbesttir.","Beş yıl geçince serbesttir.","Amirin sözlü izni yeterlidir."],a:0,e:"Md.31 yasağı görevden ayrılmış olanlara da uygular.",d:"657 s. K. md.31",s:"s657"},
{b:"a",k:"657 DMK",q:"657 sayılı Kanun'a göre kadrolar nasıl düzenlenir?",o:["Cumhurbaşkanlığı kararnamesinde gösterildiği şekilde","Kanunla","Bakan onayıyla","Devlet Personel Başkanlığı kararıyla"],a:0,e:"Md.33: Kadrosuz memur çalıştırılamaz. İkinci fıkra 703 sayılı KHK ile değiştirildi.",d:"657 s. K. md.33",s:"s657"},
{b:"a",k:"657 DMK",q:"Aşağıdakilerden hangisi 657 sayılı Kanun'un 36. maddesinde sayılan hizmet sınıflarından biri değildir?",o:["Yönetim Hizmetleri Sınıfı","Genel İdare Hizmetleri Sınıfı","Yardımcı Hizmetler Sınıfı","Mülki İdare Amirliği Hizmetleri Sınıfı"],a:0,e:"Md.36'da 12 sınıf vardır: Genel İdare, Teknik, Sağlık, Eğitim ve Öğretim, Avukatlık, Din, Emniyet, Jandarma, Sahil Güvenlik, Yardımcı, Mülki İdare Amirliği ve Millî İstihbarat Hizmetleri.",d:"657 s. K. md.36",s:"s657"},
{b:"a",k:"657 DMK",q:"Dört yıl süreli yükseköğrenimi bitirenlerin memuriyete giriş derece ve kademesi hangisidir?",o:["9. derece 1. kademe","10. derece 1. kademe","8. derece 1. kademe","9. derece 3. kademe"],a:0,e:"Md.36 Ortak Hükümler A: İki yıllık yükseköğrenim 10/2, üç yıllık 10/3, beş yıllık 9/2, altı yıllık 9/3.",d:"657 s. K. md.36/A",s:"s657"},
{b:"a",k:"657 DMK",q:"Liseyi bitirenlerin memuriyete giriş derece ve kademesi hangisidir?",o:["13. derece 3. kademe","14. derece 1. kademe","12. derece 1. kademe","13. derece 1. kademe"],a:0,e:"Md.36 Ortak Hükümler A tablosu; liseyi bitirenler 3. derecenin son kademesine kadar yükselebilir.",d:"657 s. K. md.36/A",s:"s657"},
{b:"a",k:"657 DMK",q:"Memurluğa girmeden önce veya memurluk sırasında yüksek lisans (master) derecesi alana ne uygulanır?",o:["Bir kademe ilerlemesi","Bir derece yükselmesi","İki kademe ilerlemesi","Herhangi bir ilerleme uygulanmaz"],a:0,e:"Md.36 Ortak Hükümler A/9: Mesleğiyle ilgili dalda doktora yapanlara bir derece; master ile bir kademe almış olan doktora yaparsa iki kademe ilerlemesi uygulanır.",d:"657 s. K. md.36/A-9",s:"s657"},
{b:"a",k:"657 DMK",q:"Özel okullarda öğretmenlik veya yöneticilik yaptıktan sonra MEB'de memuriyete girenlerin özel okulda geçen hizmet sürelerinin ne kadarı değerlendirilir?",o:["2/3'ü","3/4'ü","Tamamı","Yarısı"],a:0,e:"Md.36 Ortak Hükümler C/5. Bu fıkralara göre yalnızca özel sektörde geçen ve değerlendirilecek süre 12 yılı geçemez.",d:"657 s. K. md.36/C-5",s:"s657"},
{b:"a",k:"657 DMK",q:"657 sayılı Kanun'a göre hangisi doğrudur?",o:["Hiçbir memur sınıfının dışında ve sınıfı içindeki derecesinin altında bir derecenin görevinde çalıştırılamaz.","Memur ihtiyaç hâlinde başka sınıfta çalıştırılabilir.","Memur bir alt derecede süresiz çalıştırılabilir.","Sınıflar dışında memurluk kadrosu ihdas edilebilir."],a:0,e:"Md.45/1. Md.39 ise sınıflar dışında memurluk kadrosu ihdas edilemeyeceğini düzenler.",d:"657 s. K. md.45, md.39",s:"s657"},
{b:"a",k:"657 DMK",q:"657 sayılı Kanun'a göre genel olarak memur olabilmek için aranan öğrenim düzeyi nedir?",o:["Ortaokul","İlkokul","Lise","Ön lisans"],a:0,e:"Md.41: Ortaokul mezunlarından istekli bulunmazsa ilkokul mezunlarının alınması caizdir.",d:"657 s. K. md.41",s:"s657"},
{b:"a",k:"657 DMK",q:"Devlet memurluğu sınavlarında ilan edilen sınav sonuçları ne zamana kadar geçerlidir?",o:["Müteakip sınav tarihine kadar","Bir yıl","İki yıl","Süresiz"],a:0,e:"Md.51/2.",d:"657 s. K. md.51",s:"s657"},
{b:"a",k:"657 DMK",q:"Engelli açığı bulunan kurumlar, bir sonraki yıl alacakları engellilere ilişkin taleplerini ne zamana kadar bildirir?",o:["Her yılın ekim ayı sonuna kadar","Her yılın ocak ayı sonuna kadar","Her yılın haziran ayı sonuna kadar","Her yılın aralık ayı sonuna kadar"],a:0,e:"Md.53/3: Talepler Devlet Personel Başkanlığına (bugün yetkili kuruma) bildirilir.",d:"657 s. K. md.53",s:"s657"},
{b:"a",k:"657 DMK",q:"Aday memurların yetiştirilmesi hangi aşamalardan oluşur?",o:["Temel eğitim, hazırlayıcı eğitim ve staj","Oryantasyon ve sınav","Hizmet içi eğitim ve tez","Yalnızca staj"],a:0,e:"Md.55: Temel eğitim ile hazırlayıcı eğitim aynı kurumda yapılır; ayrıntılar Cumhurbaşkanınca çıkarılan yönetmelikle düzenlenir.",d:"657 s. K. md.55",s:"s657"},
{b:"a",k:"657 DMK",q:"Asli memurluğa geçiş tarihi için hangisi doğrudur?",o:["Adaylık süresinin sonunu geçemez.","Adaylık bitiminden üç ay sonradır.","Atamaya yetkili amirin takdirine göre belirlenir.","Adaylığın ilk günüdür."],a:0,e:"Md.58: Eğitimde başarılı adaylar disiplin amirlerinin teklifi ve atamaya yetkili amirin onayıyla, onay tarihinden geçerli olarak asli memurluğa atanır.",d:"657 s. K. md.58",s:"s657"},
{b:"a",k:"657 DMK",q:"Aşağıdakilerden hangisi 657 sayılı Kanun'da sayılan istisnai memurluklardan biridir?",o:["Valilikler","Şube müdürlükleri","Okul müdürlükleri","Maarif müfettişlikleri"],a:0,e:"Md.59: Özel kalem müdürlükleri, büyükelçilikler, Cumhurbaşkanlığı ve TBMM memurlukları gibi kadrolara atanma, sınav, kademe ve derece hükümlerine bağlı olmaksızın atama yapılabilir.",d:"657 s. K. md.59",s:"s657"},
{b:"a",k:"657 DMK",q:"Bakan müşavirlerinin görev süresi için hangisi doğrudur?",o:["Bakanın görev süresiyle sınırlıdır.","Beş yıldır.","Süresizdir.","Dört yıldır, bir kez uzatılabilir."],a:0,e:"Md.61/A (703 s. KHK): Bakanın görevi sona erince bakan müşavirlerinin görevi de sona erer; gerektiğinde süre dolmadan görevden alınabilirler.",d:"657 s. K. md.61/A",s:"s657"},
{b:"a",k:"657 DMK",q:"Doğum yapan memura, analık izninin bitiminden itibaren isteği hâlinde ne kadar süreye kadar aylıksız izin verilir?",o:["24 ay","12 ay","18 ay","36 ay"],a:0,e:"Md.108/B: Eşi doğum yapan memura da doğum tarihinden itibaren aynı süre verilir; doğum yapan memura iznin verilmesi takdire bağlı değildir.",d:"657 s. K. md.108/B",s:"s657i"},
{b:"a",k:"657 DMK",q:"Beş hizmet yılını tamamlayan memura isteği hâlinde hangi aylıksız izin verilebilir?",o:["Memuriyeti boyunca en fazla iki defada kullanılmak üzere toplam bir yıla kadar","Her beş yılda bir altı ay","Bir defada iki yıl","Her yıl bir ay"],a:0,e:"Md.108/E. Olağanüstü hâl veya afet bölgelerinde zorunlu sürekli görevdeki süreler bu hükmün dışındadır.",d:"657 s. K. md.108/E",s:"s657i"},
{b:"a",k:"657 DMK",q:"Aylıksız izin süresi bitiminde veya mazeretin kalkmasını izleyen on gün içinde göreve dönmeyen memur hakkında ne olur?",o:["Memuriyetten çekilmiş sayılır.","Kınama cezası verilir.","İzni kendiliğinden uzar.","Aylıktan kesme cezası verilir."],a:0,e:"Md.108/F göreve dönüş yükümlülüğünü düzenler.",d:"657 s. K. md.108/F",s:"s657i"},
{b:"a",k:"657 DMK",q:"Sağlık kurulu raporuyla belgelenmek şartıyla, hastalık izninin bitiminden itibaren en fazla ne kadar aylıksız izin verilebilir?",o:["18 ay","6 ay","12 ay","24 ay"],a:0,e:"Md.108/A, md.105 son fıkraya göre verilen iznin bitiminden itibaren uygulanır.",d:"657 s. K. md.108/A",s:"s657i"},
{b:"a",k:"657 Disiplin",q:"Kademe ilerlemesinin durdurulması cezası nasıl verilir?",o:["Disiplin amirince doğrudan","Memurun bağlı olduğu kurumdaki disiplin kurulunun kararı alındıktan sonra atamaya yetkili amirlerce","Yüksek disiplin kurulunca","Yalnızca valilerce"],a:1,e:"Md.126: Uyarma, kınama ve aylıktan kesme cezaları disiplin amirlerince verilir. Kademe ilerlemesinin durdurulmasında disiplin kurulu kararı alınır; il disiplin kurulu kararına dayanan hâllerde vali verir. Not: md.126'daki “aylıktan kesme” ibaresi için AYM'ye itiraz başvurusu yapılmıştır (E.2025/154).",d:"657 s. K. md.126",s:"s657a"},
{b:"a",k:"657 Disiplin",q:"Disiplin cezalarına itiraz süresi ve itiraz merciinin karar verme süresi hangisidir?",o:["7 gün / 30 gün","15 gün / 30 gün","7 gün / 15 gün","30 gün / 60 gün"],a:0,e:"Md.135: İtiraz süresi tebliğden itibaren 7 gündür; merci 30 gün içinde karar verir. Uyarma, kınama ve aylıktan kesmeye disiplin kuruluna, kademe ilerlemesinin durdurulmasına yüksek disiplin kuruluna itiraz edilir.",d:"657 s. K. md.135",s:"s657k"},
{b:"a",k:"657 Disiplin",q:"Aylıktan kesme cezasında memurun brüt aylığından ne kadar kesinti yapılır?",o:["1/30 – 1/8","1/10 – 1/5","1/4 – 1/2","1/8 – 1/4"],a:0,e:"Md.125/C. Bulunduğu kademede ilerleme mümkün olmayan memurlara kademe ilerlemesinin durdurulması cezası yerine brüt aylığın 1/4 – 1/2'si kesilir.",d:"657 s. K. md.125",s:"s657c"},
{b:"a",k:"657 Disiplin",q:"Kademe ilerlemesinin durdurulması cezasında memurun kademe ilerlemesi ne kadar süre durdurulur?",o:["Fiilin ağırlık derecesine göre 1 – 3 yıl","6 ay – 1 yıl","2 – 4 yıl","1 – 5 yıl"],a:0,e:"Md.125/D.",d:"657 s. K. md.125/D",s:"s657c"},
{b:"a",k:"657 Disiplin",q:"Özürsüz ve izinsiz olarak bir veya iki gün göreve gelmeyen memura hangi ceza verilir?",o:["Aylıktan kesme","Uyarma","Kınama","Kademe ilerlemesinin durdurulması"],a:0,e:"Md.125/C-b. Kesintisiz 3-9 gün kademe ilerlemesinin durdurulması, bir yılda toplam 20 gün Devlet memurluğundan çıkarma cezasını gerektirir.",d:"657 s. K. md.125/C-b",s:"s657c"},
{b:"a",k:"657 Disiplin",q:"Özürsüz olarak kesintisiz 3 – 9 gün göreve gelmeyen memura hangi ceza verilir?",o:["Kademe ilerlemesinin durdurulması","Aylıktan kesme","Kınama","Devlet memurluğundan çıkarma"],a:0,e:"Md.125/D-b.",d:"657 s. K. md.125/D-b",s:"s657c"},
{b:"a",k:"657 Disiplin",q:"Bir yıl içinde özürsüz olarak toplam 20 gün göreve gelmeyen memura hangi ceza verilir?",o:["Devlet memurluğundan çıkarma","Kademe ilerlemesinin durdurulması","Aylıktan kesme","Kınama"],a:0,e:"Md.125/E-d.",d:"657 s. K. md.125/E-d",s:"s657c"},
{b:"a",k:"657 Disiplin",q:"Mal bildiriminde süresi içinde bulunmayan memura hangi disiplin cezası verilir?",o:["Kademe ilerlemesinin durdurulması","Uyarma","Kınama","Aylıktan kesme"],a:0,e:"Md.125/D-j. Ayrıca 3628 sayılı Kanun'a göre ihtara rağmen bildirimde bulunmayanlar hakkında suç duyurusunda bulunulur.",d:"657 s. K. md.125/D-j",s:"s657c"},
{b:"a",k:"657 Disiplin",q:"Yetkili olmadığı hâlde basına bilgi veya demeç veren memura hangi ceza verilir?",o:["Kınama","Uyarma","Aylıktan kesme","Kademe ilerlemesinin durdurulması"],a:0,e:"Md.125/B-m.",d:"657 s. K. md.125/B-m",s:"s657c"},
{b:"a",k:"657 Disiplin",q:"Kılık ve kıyafete ilişkin hükümlere aykırı davranan memura hangi ceza verilir?",o:["Uyarma","Kınama","Aylıktan kesme","Kademe ilerlemesinin durdurulması"],a:0,e:"Md.125/A-g.",d:"657 s. K. md.125/A-g",s:"s657c"},
{b:"a",k:"657 Disiplin",q:"Siyasi partiye giren memura hangi ceza verilir?",o:["Devlet memurluğundan çıkarma","Kademe ilerlemesinin durdurulması","Aylıktan kesme","Kınama"],a:0,e:"Md.125/E-c. Siyasi parti yararına veya zararına fiilen faaliyette bulunmak ise kademe ilerlemesinin durdurulmasını gerektirir (D-o).",d:"657 s. K. md.125/E-c",s:"s657c"},
{b:"a",k:"657 Disiplin",q:"Görev sırasında amire hal ve hareketleriyle saygısızlık eden memura hangi ceza verilir?",o:["Kınama","Uyarma","Aylıktan kesme","Kademe ilerlemesinin durdurulması"],a:0,e:"Md.125/B-c. Amire sözle saygısızlık aylıktan kesmeyi (C-e), amire veya maiyetine karşı onur kırıcı davranış kademe ilerlemesinin durdurulmasını (D-d) gerektirir.",d:"657 s. K. md.125/B-c",s:"s657c"},
{b:"a",k:"657 Disiplin",q:"Disiplin cezasını gerektiren bir fiil, cezanın sicilden silinmesi için gereken süre içinde tekrar işlenirse ne olur?",o:["Bir derece ağır ceza verilir.","Aynı ceza tekrar verilir.","İki derece ağır ceza verilir.","Doğrudan memurluktan çıkarılır."],a:0,e:"Md.125: Aynı derecede cezayı gerektiren farklı fiillerden üçüncü defa ceza alınması hâlinde de bir derece ağır ceza uygulanır.",d:"657 s. K. md.125",s:"s657c"},
{b:"a",k:"657 Disiplin",q:"Uyarma, kınama, aylıktan kesme ve kademe ilerlemesinin durdurulması cezalarında, fiilin öğrenilmesinden itibaren ne kadar süre içinde disiplin soruşturmasına başlanmazsa ceza verme yetkisi zamanaşımına uğrar?",o:["1 ay","15 gün","2 ay","6 ay"],a:0,e:"Md.127: Memurluktan çıkarma cezasında bu süre altı aydır.",d:"657 s. K. md.127",s:"s657z"},
{b:"a",k:"657 Disiplin",q:"Devlet memurluğundan çıkarma cezasında, fiilin öğrenilmesinden itibaren kaç ay içinde disiplin soruşturmasına başlanmalıdır?",o:["6 ay","1 ay","3 ay","12 ay"],a:0,e:"Md.127.",d:"657 s. K. md.127",s:"s657z"},
{b:"a",k:"657 Disiplin",q:"Disiplin cezasını gerektiren fiilin işlendiği tarihten itibaren en geç ne kadar süre içinde ceza verilmezse ceza verme yetkisi zamanaşımına uğrar?",o:["2 yıl","1 yıl","4 yıl","5 yıl"],a:0,e:"Md.127 son fıkra. İptal edilen bir cezanın aynı konuda yeniden tesisi bu süreye tabi değildir (Danıştay).",d:"657 s. K. md.127",s:"s657z"},
{b:"a",k:"657 Disiplin",q:"657 sayılı Kanun'a göre savunma için verilecek süre, savunma isteminin tebliğinden itibaren en az ne kadardır?",o:["7 gün","3 gün","15 gün","30 gün"],a:0,e:"Md.130: Süresi içinde savunma vermeyen memur savunma hakkından vazgeçmiş sayılır. Anayasa md.129 savunma alınmadan disiplin cezası verilemeyeceğini düzenler.",d:"657 s. K. md.130",s:"s657s"},
{b:"a",k:"657 Disiplin",q:"Devlet memurluğundan çıkarma cezası istenen memur, Yüksek Disiplin Kurulu önünde hangi hakka sahiptir?",o:["Soruşturma dosyasını inceleme, tanık dinletme ve sözlü veya yazılı olarak bizzat ya da vekil aracılığıyla savunma yapma","Yalnızca yazılı savunma","Hiçbir savunma hakkı yoktur","Yalnızca sendika temsilcisi aracılığıyla savunma"],a:0,e:"Md.129/2: Bu hak memura verilen temel haklardandır.",d:"657 s. K. md.129",s:"s657s"},
{b:"a",k:"657 Disiplin",q:"Aylıktan kesme ve kademe ilerlemesinin durdurulması cezası alanlar, sırasıyla kaç yıl daire başkanlığı ve daha üst kadrolar ile il teşkilatının en üst yönetici kadrolarına atanamaz?",o:["5 yıl / 10 yıl","3 yıl / 5 yıl","10 yıl / 10 yıl","2 yıl / 4 yıl"],a:0,e:"Md.132/4 (6111 s. K.). Vali ve büyükelçi kadroları ile düzenleyici ve denetleyici kurum başkan ve üyelikleri de bu kapsamdadır.",d:"657 s. K. md.132/4",s:"s657a"},
{b:"a",k:"657 Disiplin",q:"Disiplin kovuşturması gerektiren hâllerde görevden uzaklaştırma tedbiri en çok ne kadar sürebilir?",o:["3 ay","1 ay","6 ay","1 yıl"],a:0,e:"Md.145: Bu süre sonunda hakkında karar verilmezse memur görevine başlatılır.",d:"657 s. K. md.145",s:"s657u"},
{b:"a",k:"Devlet Memurları Disiplin Yön.",q:"Devlet Memurları Disiplin Yönetmeliği'ne göre disiplin amirleri hangi cezaları vermeye yetkilidir?",o:["Uyarma, kınama ve aylıktan kesme","Uyarma, kınama, aylıktan kesme ve kademe ilerlemesinin durdurulması","Yalnızca uyarma ve kınama","Tüm disiplin cezaları"],a:0,e:"Disiplin amirliği yetkisi devredilemez. Kademe ilerlemesinin durdurulması disiplin kurulu kararıyla, memurluktan çıkarma yüksek disiplin kurulunca verilir.",d:"DMDY md.7/1, 7/3",s:"pDmdy"},
{b:"a",k:"Devlet Memurları Disiplin Yön.",q:"Devlet Memurları Disiplin Yönetmeliği'ne göre il millî eğitim disiplin kurulunun başkanı kimdir?",o:["Valinin görevlendireceği vali yardımcısı","İl millî eğitim müdürü","İl hukuk işleri müdürü","Personelden sorumlu şube müdürü"],a:0,e:"Üyeler: il millî eğitim müdürü, valinin görevlendirdiği personelden sorumlu bir şube müdürü, biri ilköğretim diğeri ortaöğretim kurumu müdürü iki eğitim kurumu müdürü ve varsa memurun üyesi olduğu sendikanın temsilcisi.",d:"DMDY md.11",s:"pDmdy"},
{b:"a",k:"Devlet Memurları Disiplin Yön.",q:"Devlet Memurları Disiplin Yönetmeliği'ne göre disiplin kurullarının yetkisi için hangisi doğrudur?",o:["Ayrı bir ceza tayin edemez, cezayı kabul veya reddeder","Teklif edilenden ağır ceza verebilir","Teklif edilenden hafif ceza tayin edebilir","Memurluktan çıkarma cezası verebilir"],a:0,e:"Disiplin kurulları; kademe ilerlemesinin durdurulması teklifini, uyarma-kınama-aylıktan kesmeye itirazları değerlendirir ve KİD cezasının özlük dosyasından çıkarılması taleplerine mütalaa verir.",d:"DMDY md.14",s:"pDmdy"},
{b:"a",k:"Devlet Memurları Disiplin Yön.",q:"Devlet Memurları Disiplin Yönetmeliği'ne göre bakanlıklarda yüksek disiplin kurulunun başkanı kimdir?",o:["Bakan tarafından görevlendirilen bakan yardımcısı","Bakan","Personel genel müdürü","Teftiş kurulu başkanı"],a:0,e:"Yüksek disiplin kurulu bir başkan ve dört üye ile varsa sendika temsilcisinden oluşur; memurluktan çıkarma cezası vermeye ve KİD itirazlarını değerlendirmeye yetkilidir.",d:"DMDY md.16/1-a, b-2; md.18",s:"pDmdy"},
{b:"a",k:"Devlet Memurları Disiplin Yön.",q:"Devlet Memurları Disiplin Yönetmeliği'ne göre disiplin kurulu ve yüksek disiplin kurulu başkan ve üyeleri kaç yıl süreyle görevlendirilir?",o:["Üç yıl","İki yıl","Dört yıl","Beş yıl"],a:0,e:"Süresi dolanlar yeniden görevlendirilebilir. Aylıktan kesme cezası alanlar beş yıl, kademe ilerlemesinin durdurulması cezası alanlar on yıl boyunca bu kurullarda görevlendirilemez.",d:"DMDY md.19/1-2",s:"pDmdy"},
{b:"a",k:"Devlet Memurları Disiplin Yön.",q:"Devlet Memurları Disiplin Yönetmeliği'ne göre disiplin kurullarında oylama nasıl yapılır?",o:["Açık oyla, oy çokluğuyla; çekimser kalınamaz, başkan oyunu en son kullanır, eşitlikte başkanın tarafı üstündür","Gizli oyla, oy birliğiyle","Açık oyla; çekimser oy kullanılabilir","Gizli oyla; eşitlikte kura çekilir"],a:0,e:"Üç kişilik kurullar tam sayıyla, üçten fazla üyeli kurullar salt çoğunlukla toplanır. Karar oylamayı izleyen yedi gün içinde gerekçeli yazılır.",d:"DMDY md.22/1, 22/6; md.23",s:"pDmdy"},
{b:"a",k:"Devlet Memurları Disiplin Yön.",q:"Devlet Memurları Disiplin Yönetmeliği'ne göre disiplin soruşturmasında görevlendirilen muhakkik için hangisi doğrudur?",o:["Soruşturulan memurdan hiyerarşik olarak alt seviyede olamaz; savunma isteme ve ceza verme yetkisi yoktur","Savunma isteme yetkisine sahiptir","Soruşturma sırasında tespit ettiği yeni fiilleri kendiliğinden soruşturur","Disiplin cezası verebilir"],a:0,e:"Muhakkik yeni bir fiil tespit ederse disiplin amirine yazılı bildirir; yazılı ek görev verilirse soruşturabilir. Raporunu gizli yazıyla disiplin amirine sunar.",d:"DMDY md.28/3, 29/1-3",s:"pDmdy"},
{b:"a",k:"Devlet Memurları Disiplin Yön.",q:"Devlet Memurları Disiplin Yönetmeliği'ne göre disiplin amirleri uyarma, kınama ve aylıktan kesme cezalarını hangi süre içinde vermek zorundadır?",o:["Soruşturmanın tamamlandığı günden itibaren on beş gün içinde","Soruşturmanın tamamlandığı günden itibaren otuz gün içinde","Fiilin öğrenilmesinden itibaren bir ay içinde","Savunmanın alınmasından itibaren yedi gün içinde"],a:0,e:"KİD gerektiren hâllerde dosya 15 gün içinde disiplin kuruluna gönderilir, kurul 30 gün içinde karar verir; memurluktan çıkarmada yüksek disiplin kurulu azami 6 ay içinde karar verir.",d:"DMDY md.31/1-3",s:"pDmdy"},
{b:"a",k:"Devlet Memurları Disiplin Yön.",q:"Devlet Memurları Disiplin Yönetmeliği'ne göre devlet memurluğundan çıkarma cezası kararın verildiği tarihi izleyen kaç gün içinde ilgilisine tebliğ edilir?",o:["Yedi gün","On beş gün","Otuz gün","Üç gün"],a:0,e:"Diğer disiplin cezaları 15 gün, itiraz sonuçları 7 gün içinde tebliğ edilir.",d:"DMDY md.33",s:"pDmdy"},
{b:"a",k:"Devlet Memurları Disiplin Yön.",q:"Devlet Memurları Disiplin Yönetmeliği'ne göre kademe ilerlemesinin durdurulması cezasına karşı nereye ve hangi sürede itiraz edilir?",o:["Tebliğden itibaren yedi gün içinde yüksek disiplin kuruluna","Tebliğden itibaren on beş gün içinde disiplin kuruluna","Otuz gün içinde disiplin amirine","Altmış gün içinde idare mahkemesine"],a:0,e:"Uyarma, kınama ve aylıktan kesmeye disiplin kuruluna itiraz edilir. Süresinde itiraz edilmeyen cezalar kesinleşir; tüm cezalara karşı idari yargı yolu açıktır. İtiraz mercileri 30 gün içinde karar verir.",d:"DMDY md.35-36, 31/5",s:"pDmdy"},
{b:"a",k:"Devlet Memurları Disiplin Yön.",q:"Devlet Memurları Disiplin Yönetmeliği'ne göre aylıktan kesme cezası ne zaman uygulanır?",o:["Verildiği tarihi takip eden ay başında","Kesinleştiği tarihte","Verildiği tarihte","Bir sonraki yılın başında"],a:0,e:"Disiplin cezaları özlük dosyasına işlenir, verildiği tarihten itibaren hüküm ifade eder ve derhal uygulanır; aylıktan kesme ise takip eden ay başında uygulanır.",d:"DMDY md.37",s:"pDmdy"},
{b:"a",k:"Devlet Memurları Disiplin Yön.",q:"Devlet Memurları Disiplin Yönetmeliği'ne göre kınama cezası alan memur, cezanın özlük dosyasından silinmesini ne zaman talep edebilir?",o:["Cezanın uygulanma tarihinden itibaren beş yıl geçtikten sonra","Üç yıl geçtikten sonra","On yıl geçtikten sonra","İki yıl geçtikten sonra"],a:0,e:"Uyarma ve kınamada beş, aylıktan kesme ve KİD'de on yıl geçtikten sonra atamaya yetkili amire başvurulur. KİD için ayrıca disiplin kurulunun mütalaası alınır.",d:"DMDY md.40",s:"pDmdy"},
{b:"a",k:"Devlet Memurları Disiplin Yön.",q:"Devlet Memurları Disiplin Yönetmeliği'ne göre başvuru sahibinin adı, soyadı, imzası ve adresi bulunmayan ancak somut delillere dayanan şikâyet hakkında ne yapılır?",o:["Disiplin soruşturmasına başlanır","İşleme konulmaz","Başvuru sahibine iade edilir","Valiliğe gönderilir"],a:0,e:"Belirli konu içermeyen veya somut delile dayanmayan, daha önce sonuçlanmış hususlarda yeni delil içermeyen şikâyetler işleme konulmaz.",d:"DMDY md.38",s:"pDmdy"},
{b:"a",k:"Devlet Memurları Disiplin Yön.",q:"Devlet Memurları Disiplin Yönetmeliği hangi kanun maddesine dayanılarak hazırlanmıştır?",o:["657 sayılı Kanun md.134","657 sayılı Kanun md.125","5442 sayılı Kanun md.9","4483 sayılı Kanun md.1"],a:0,e:"Yönetmelik 29/4/2021 tarihli ve 3935 sayılı Cumhurbaşkanı Kararıyla yürürlüğe konuldu (RG 30/4/2021, 31470) ve Disiplin Kurulları ve Disiplin Amirleri Hakkında Yönetmeliği kaldırdı.",d:"DMDY md.3, md.42",s:"pDmdy"},
{b:"a",k:"5442 İl İdaresi",q:"5442 sayılı Kanun'a göre Türkiye merkezî idare bakımından nasıl bölünmüştür?",o:["İllere, iller ilçelere, ilçeler bucaklara","Bölgelere, bölgeler illere","İllere, iller belediyelere","İllere, iller köylere"],a:0,e:"Md.1: Bölünme coğrafya durumu, ekonomik şartlar ve kamu hizmetleri gereklerine göre yapılır.",d:"5442 s. K. md.1",s:"p5442"},
{b:"a",k:"5442 İl İdaresi",q:"İl kurulması, kaldırılması ve merkezlerinin belirlenmesi hangi işlemle olur?",o:["Kanunla","Cumhurbaşkanlığı kararnamesiyle","İçişleri Bakanının onayıyla","Valilik kararıyla"],a:0,e:"Md.2: İl ve ilçe kurulması, kaldırılması, merkezlerinin belirlenmesi ve adlarının değiştirilmesi kanunla yapılır.",d:"5442 s. K. md.2",s:"p5442"},
{b:"a",k:"5442 İl İdaresi",q:"5442 sayılı Kanun'a göre vali ilde kimin temsilcisidir?",o:["TBMM Başkanının","Cumhurbaşkanının","Anayasa Mahkemesinin","Yalnızca İçişleri Bakanlığının"],a:1,e:"Md.9 (703 sayılı KHK değişikliğiyle): Vali ilde Cumhurbaşkanının temsilcisi ve idari yürütme vasıtasıdır; il genel idaresinden Cumhurbaşkanına karşı sorumludur.",d:"5442 s. K. md.9",s:"p5442"},
{b:"a",k:"5442 İl İdaresi",q:"İl genel idaresinin başı ve mercii kimdir?",o:["Vali","İl özel idaresi genel sekreteri","Belediye başkanı","İl genel meclisi başkanı"],a:0,e:"Md.4: İl genel idaresinin başı ve mercii validir; ildeki bakanlık teşkilatı valinin emri altındadır (yargı mensupları ve askerî birlikler hariç).",d:"5442 s. K. md.4",s:"p5442"},
{b:"a",k:"5442 İl İdaresi",q:"Vali, kamu düzeni için ciddi tehlike hâllerinde belirli yerlere giriş ve çıkışı en fazla kaç gün süreyle sınırlayabilir?",o:["7 gün","10 gün","15 gün","30 gün"],a:2,e:"Md.11: Vali il sınırları içindeki genel ve özel kolluk kuvvetlerinin amiridir; ciddi tehlike hâllerinde on beş günü geçmemek üzere giriş-çıkış sınırlaması getirebilir.",d:"5442 s. K. md.11",s:"p5442"},
{b:"a",k:"5442 İl İdaresi",q:"Kaymakam ilçedeki memurlara hangi disiplin cezalarını verebilir?",o:["Uyarma ve kınama","Aylıktan kesme","Kademe ilerlemesinin durdurulması","Devlet memurluğundan çıkarma"],a:0,e:"Md.31: Kaymakam ilçedeki daire ve işletmeleri denetler ve ilçe memurlarına uyarma ve kınama cezası verebilir.",d:"5442 s. K. md.31",s:"p5442"},
{b:"a",k:"5442 İl İdaresi",q:"5442 sayılı Kanun'a göre bucak kurulması hangi işlemle olur?",o:["Cumhurbaşkanı onayıyla","Kanunla","Valilik kararıyla","İl genel meclisi kararıyla"],a:0,e:"Md.2: İl ve ilçe kurulması kanunla, bucak kurulması Cumhurbaşkanı onayıyla yapılır; köy ve mahalleye ilişkin bazı işler İçişleri Bakanlığının onayına bağlıdır.",d:"5442 s. K. md.2",s:"p5442"},
{b:"a",k:"5442 İl İdaresi",q:"İldeki teşkilatın valinin emri altında olmasının istisnası hangisidir?",o:["Yargı mensupları ve askerî birlikler","İl millî eğitim müdürlüğü","Defterdarlık","İl sağlık müdürlüğü"],a:0,e:"Md.4: Bakanlıkların ildeki teşkilatı valinin emri altındadır; adlî ve askerî teşkilat bu hükmün dışındadır.",d:"5442 s. K. md.4",s:"p5442"},
{b:"a",k:"5442 İl İdaresi",q:"Vali, il genel idaresinden kime karşı sorumludur?",o:["Cumhurbaşkanına","TBMM'ye","İl genel meclisine","Sayıştaya"],a:0,e:"Md.9: Vali ilde Cumhurbaşkanının temsilcisi ve idari yürütme vasıtasıdır.",d:"5442 s. K. md.9",s:"p5442"},
{b:"a",k:"5442 İl İdaresi",q:"Kaymakam, kamu düzenini bozan ve önleyemediği olaylarda ne yapar?",o:["Validen yardım ister","Doğrudan Genelkurmaydan asker ister","Olağanüstü hâl ilan eder","Belediye başkanına yetki devreder"],a:0,e:"Md.32: Kaymakam ilçe sınırları içindeki genel ve özel kolluk kuvvetlerinin amiridir.",d:"5442 s. K. md.32",s:"p5442"},
{b:"a",k:"5442 İl İdaresi",q:"5442 sayılı Kanun'a göre valilerin ve kaymakamların bu Kanuna dayanarak aldıkları kararlara aykırı hareket edenler hakkında hangi hüküm uygulanır?",o:["5326 sayılı Kabahatler Kanunu'nun 32. maddesi (emre aykırı davranış)","657 sayılı Kanun'un disiplin hükümleri","2577 sayılı Kanun'un yürütmeyi durdurma hükmü","3628 sayılı Kanun'un ceza hükümleri"],a:0,e:"Mülki amirlerin kanuna dayanan kararlarına aykırılık Kabahatler Kanunu md.32'ye göre idari yaptırıma bağlanır; toplumsal olaylar sırasında ayrıca hapis cezası öngörülmüştür.",d:"5442 s. K. md.66",s:"p5442"},
{b:"a",k:"5378 Engelliler",q:"5378 sayılı Engelliler Hakkında Kanun hangi tarihte Resmî Gazete'de yayımlanmıştır?",o:["7 Temmuz 2005","1 Temmuz 2005","30 Mayıs 1997","18 Ekim 2024"],a:0,e:"Kanun 1/7/2005'te kabul edilmiş, 7/7/2005 tarihli ve 25868 sayılı Resmî Gazete'de yayımlanmıştır. 30/5/1997, 573 sayılı KHK'nin tarihidir.",d:"5378 s. K., künye",s:"p5378"},
{b:"a",k:"5378 Engelliler",q:"5378 sayılı Kanun'daki tanıma göre “makul düzenleme” nedir?",o:["Engellilerin diğer bireylerle eşit şekilde haklardan yararlanması için ihtiyaç duyulan, orantısız veya aşırı yük getirmeyen gerekli ve uygun değişiklik ve tedbirler","Engellilere yalnızca para yardımı yapılması","Engellilerin ayrı kurumlarda eğitim alması","Yalnızca kamu binalarına rampa yapılması"],a:0,e:"Makul düzenleme, bireysel ihtiyaca göre yapılan ve aşırı yük getirmeyen uyarlamalardır; yapılmaması ayrımcılık sayılabilir.",d:"5378 s. K. md.3",s:"p5378"},
{b:"a",k:"5378 Engelliler",q:"5378 sayılı Kanun'a göre “erişilebilirlik” kavramı neyi ifade eder?",o:["Binaların, açık alanların, ulaşım ve bilgi hizmetlerinin engelliler tarafından güvenli ve bağımsız olarak kullanılabilmesini","Engellilerin özel eğitim kurumlarına yerleştirilmesini","Engellilik oranının tespit edilmesini","Engellilere istihdamda kontenjan ayrılmasını"],a:0,e:"Erişilebilirlik; fiziksel çevre, ulaşım ve bilgi-iletişim hizmetlerinin güvenli ve bağımsız kullanımını kapsar.",d:"5378 s. K. md.3",s:"p5378"},
{b:"a",k:"5378 Engelliler",q:"5378 sayılı Kanun'daki tanımlar dikkate alındığında habilitasyon ile rehabilitasyon arasındaki temel fark nedir?",o:["Habilitasyon hiç kazanılmamış becerilerin kazandırılmasına, rehabilitasyon sonradan kaybedilen işlevlerin yeniden kazandırılmasına yöneliktir.","İkisi aynı anlamdadır.","Habilitasyon yalnızca tıbbi tedavidir, rehabilitasyon yalnızca eğitimdir.","Habilitasyon yetişkinlere, rehabilitasyon çocuklara yöneliktir."],a:0,e:"Doğuştan engellilikte henüz kazanılmamış işlevlerin geliştirilmesi habilitasyon, sonradan kaybedilen işlevlerin yeniden kazandırılması rehabilitasyondur.",d:"5378 s. K. md.3",s:"p5378"},
{b:"a",k:"5378 Engelliler",q:"5378 sayılı Kanun'a göre “korumalı işyeri” hangisidir?",o:["İşgücü piyasasına kazandırılmalarında özel politika gerektiren engellilerin istihdam edildiği, Devletçe teknik ve mali yönden desteklenen işyeri","Engelli çalışanların bulunduğu her özel işyeri","Yalnızca kamu kurumlarındaki engelli kadroları","Engellilerin gündüz bakım aldığı merkezler"],a:0,e:"Korumalı işyeri, çalışma ortamı özel olarak düzenlenmiş ve Devlet tarafından desteklenen bir istihdam modelidir.",d:"5378 s. K. md.3",s:"p5378"},
{b:"a",k:"5378 Engelliler",q:"5378 sayılı Kanun'a göre, engellilerin diğer bireylerle eşitliğini sağlamaya yönelik özel tedbirler için hangisi doğrudur?",o:["Ayrımcılık olarak yorumlanamaz.","Eşitlik ilkesine aykırıdır.","Yalnızca mahkeme kararıyla uygulanabilir.","Yalnızca kamu kurumlarında uygulanabilir."],a:0,e:"Engellilere yönelik pozitif tedbirler ayrımcılık sayılmaz; aksine engellilik temelli ayrımcılığın önlenmesi Kanunun temel ilkesidir.",d:"5378 s. K. md.4/A",s:"p5378"},
{b:"a",k:"5378 Engelliler",q:"5378 sayılı Kanun'a göre habilitasyon ve rehabilitasyon hizmetleri için hangisi doğrudur?",o:["Mümkün olan en erken evrede başlar ve bireyin yaşadığı yere en yakın yerde sunulur.","Yalnızca il merkezlerinde sunulur.","Okul çağı bitince başlar.","Yalnızca yatılı kurumlarda sunulur."],a:0,e:"Kanun, hizmetlerin erken başlamasını ve yerleşim yerine en yakın noktada verilmesini esas alır.",d:"5378 s. K. md.10",s:"p5378"},
{b:"a",k:"5378 Engelliler",q:"5378 sayılı Kanun'a göre engelliliğin önlenmesi amacıyla erken tanı ve tedavi hizmetlerinden öncelikle hangi Bakanlık sorumludur?",o:["Sağlık Bakanlığı","Millî Eğitim Bakanlığı","Çalışma ve Sosyal Güvenlik Bakanlığı","İçişleri Bakanlığı"],a:0,e:"Engelliliğin önlenmesine yönelik erken tanı ve tedavi hizmetleri Sağlık Bakanlığının sorumluluğundadır.",d:"5378 s. K. md.11",s:"p5378"},
{b:"a",k:"5378 Engelliler",q:"5378 sayılı Kanun'un eğitim ve öğretime ilişkin hükmüne göre hangisi doğrudur?",o:["Hiçbir gerekçeyle engellilerin eğitim alması engellenemez.","Ağır engelli bireyler eğitim hakkından muaf tutulur.","Engelli bireylerin eğitimi velinin talebine bağlıdır.","Engellilerin eğitimi yalnızca özel eğitim okullarında yapılır."],a:0,e:"Eğitim hakkı mutlak biçimde güvence altına alınmıştır; engelliler bütünleştirilmiş ortamlarda eğitimden yararlanır.",d:"5378 s. K. md.15",s:"p5378"},
{b:"a",k:"5378 Engelliler",q:"5378 sayılı Kanun'a göre Türk işaret diline ilişkin çalışmalar kimlerce yürütülür?",o:["Aile ve sosyal hizmetlerden sorumlu Bakanlığın koordinasyonunda Millî Eğitim Bakanlığı ve Türk Dil Kurumunca","Yalnızca Türk Dil Kurumunca","Yükseköğretim Kurulunca","Sağlık Bakanlığınca"],a:0,e:"Türk işaret dilinin geliştirilmesi ve standartlaştırılması, sosyal hizmetlerden sorumlu Bakanlığın koordinasyonunda MEB ve TDK tarafından yürütülür.",d:"5378 s. K. md.15",s:"p5378"},
{b:"a",k:"5378 Engelliler",q:"5378 sayılı Kanun'a göre özel eğitim değerlendirme kurulları nerede oluşturulur?",o:["Rehberlik ve araştırma merkezleri bünyesinde","Okul müdürlüklerinde","Valiliklerde","Hastanelerde"],a:0,e:"Özel eğitim değerlendirme kurulu RAM bünyesindedir; bireyin eğitsel değerlendirmesini yapar ve eğitim planını her yıl yeniden gözden geçirir.",d:"5378 s. K. md.16",s:"p5378"},
{b:"b",k:"1 sayılı CBK",q:"1 sayılı Cumhurbaşkanlığı Kararnamesi'ne göre Millî Eğitim Bakanlığının bilimsel danışma ve inceleme organı hangisidir?",o:["Teftiş Kurulu Başkanlığı","Talim ve Terbiye Kurulu Başkanlığı","Strateji Geliştirme Başkanlığı","Hukuk Hizmetleri Genel Müdürlüğü"],a:1,e:"Talim ve Terbiye Kurulu Başkanlığı, CBK'nin MEB bölümünde (md.319) bilimsel danışma ve inceleme organı olarak düzenlenir; teşkilatı ve çalışma esasları yönetmelikle belirlenir.",d:"1 sayılı CBK md.319",s:"pCbk"},
